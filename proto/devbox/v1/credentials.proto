syntax = "proto3";

// Instance credentials (sections 4.8, 4.9 and 4.11).
//
// Console is the source of truth and mints everything (Ingest.GetInstanceCredentials). The gateway caches it:
//   * scm, ai-proxy, console and claude-oauth are injected by atenet-egress through the gateway's Plural
//     credential provider (ate-secret://plural.sh/instances/<id>/<kind>) and never enter the sandbox;
//   * oidc and codex must live in the sandbox; the daemon fetches them from the gateway's SandboxCredentials
//     service through egress (actor-JWT auth), and the gateway may push refreshed Codex bundles with
//     Daemon.PushCredential.
package devbox.v1;

option go_package = "github.com/pluralsh/console/go/deployment-operator/pkg/devbox/api/v1;devboxv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  // SCM token (e.g. a repository-scoped GitHub App installation token), one per SCM host.
  CREDENTIAL_KIND_SCM = 1;
  // Instance-scoped console AI proxy token.
  CREDENTIAL_KIND_AI_PROXY = 2;
  // Instance-scoped console token for the workbench MCP.
  CREDENTIAL_KIND_CONSOLE = 3;
  // Workload identity federation JWT, one per cloud identity.
  CREDENTIAL_KIND_OIDC = 4;
  // The owner's Claude setup-token, injected at egress for api.anthropic.com.
  CREDENTIAL_KIND_CLAUDE_OAUTH = 5;
  // The owner's Codex auth.json bundle or Enterprise access token, delivered to the sandbox's tmpfs.
  CREDENTIAL_KIND_CODEX = 6;
}

// CredentialSelector asks for one credential.
message CredentialSelector {
  CredentialKind kind = 1;
  // SCM: the host, e.g. github.com. Empty returns one credential per SCM host of the box.
  string host = 2;
  // OIDC: the cloud identity name. Empty returns one token per configured identity.
  string identity = 3;
}

enum CodexCredentialMode {
  CODEX_CREDENTIAL_MODE_UNSPECIFIED = 0;
  // auth.json with a rotating refresh token.
  CODEX_CREDENTIAL_MODE_CHATGPT_AUTH = 1;
  // Static Enterprise access token, loaded with `codex login --with-access-token`.
  CODEX_CREDENTIAL_MODE_ACCESS_TOKEN = 2;
}

// InstanceCredential is a minted secret plus how to use it. Never log it.
message InstanceCredential {
  CredentialKind kind = 1;
  string host = 2;
  string identity = 3;
  // Bearer token or JWT (empty for Codex chatgpt bundles).
  string token = 4;
  // Header the credential provider replaces, and the value format, e.g. "Authorization" / "Bearer %s".
  string header_name = 5;
  string header_format = 6;
  google.protobuf.Timestamp expires_at = 7;
  // Refresh ahead of expiry after this time (about 10 minutes before expiry).
  google.protobuf.Timestamp refresh_after = 8;

  // Codex only.
  CodexCredentialMode codex_mode = 10;
  string credential_id = 11;
  // Compare-and-swap version for UpdateAgentCredential.
  int64 version = 12;
  // auth.json contents.
  bytes bundle_json = 13;
  // This instance holds the per-credential refresh lease and may let Codex refresh. Others get a fresh
  // `last_refresh` so they never refresh themselves.
  bool refresh_lease_holder = 14;
  google.protobuf.Timestamp lease_expires_at = 15;

  // Non-secret metadata (Codex plan, account ID, email; OIDC audience).
  google.protobuf.Struct metadata = 20;
}

// CloudIdentity is a DevboxRunner.spec.cloudIdentities entry, given to the daemon so it can write SDK config.
message CloudIdentity {
  string name = 1;
  bool is_default = 2;
  oneof cloud {
    AwsIdentity aws = 3;
    GcpIdentity gcp = 4;
    AzureIdentity azure = 5;
  }
}

message AwsIdentity {
  string role_arn = 1;
  int32 duration_seconds = 2;
  string session_policy = 3;
}

message GcpIdentity {
  // Full provider resource name; also the token audience.
  string workload_identity_provider = 1;
  // Optional service account to impersonate.
  string service_account = 2;
}

message AzureIdentity {
  string tenant_id = 1;
  string client_id = 2;
  string authority_host = 3;
}

// SandboxCredentials is served by devbox-gateway to devbox-daemon through atenet-egress. The caller's instance
// comes from the actor JWT that egress injects; requests never name an instance.
service SandboxCredentials {
  // GetSandboxCredential returns the current OIDC token or Codex credential (kinds OIDC and CODEX only).
  rpc GetSandboxCredential(GetSandboxCredentialRequest) returns (GetSandboxCredentialResponse);
  // UpdateCodexBundle writes back a bundle Codex refreshed; relayed to Ingest.UpdateAgentCredential.
  rpc UpdateCodexBundle(UpdateCodexBundleRequest) returns (UpdateCodexBundleResponse);
}

message GetSandboxCredentialRequest {
  CredentialSelector selector = 1;
}

message GetSandboxCredentialResponse {
  repeated InstanceCredential credentials = 1;
}

message UpdateCodexBundleRequest {
  string credential_id = 1;
  int64 expected_version = 2;
  bytes bundle_json = 3;
  google.protobuf.Timestamp refreshed_at = 4;
}

message UpdateCodexBundleResponse {
  bool applied = 1;
  // On a stale write, the newer bundle to install.
  InstanceCredential current = 2;
}
