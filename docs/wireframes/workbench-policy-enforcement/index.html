<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workbench Policy Enforcement — wireframes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fill-accent: #0E1015;
      --fill-zero: #12151B;
      --fill-zero-hover: #1B1F27;
      --fill-zero-selected: #171A21;
      --fill-one: #1B1F27;
      --fill-one-hover: #252932;
      --fill-one-selected: #21242C;
      --fill-two: #252932;
      --fill-primary: #4A51F2;
      --fill-primary-hover: #5D63F4;
      --border: #252932;
      --border-fill-one: #2A2E37;
      --border-input: #454954;
      --border-primary: #747AF6;
      --border-success: #3CECAF;
      --border-danger: #F2788D;
      --border-warning: #FFF59E;
      --text: #EEF0F1;
      --text-light: #C5C9D2;
      --text-xlight: #A1A5B0;
      --text-disabled: #454954;
      --icon-default: #C5C9D2;
      --icon-light: #A1A5B0;
      --icon-danger: #F2788D;
      --icon-success: #3CECAF;
      --icon-warning: #FFF59E;
      --purple-200: #9FA3F9;
      --blue-200: #99C9FF;
      --green-200: #99F5D5;
      --red-200: #F8A9B6;
      --yellow-200: #FFF59E;
      --sidebar: 64px;
      --sidenav: 220px;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fill-accent); color: var(--text); font-family: Inter, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; letter-spacing: 0.2px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--blue-200); text-decoration: none; }
    a:hover { color: #C2DFFF; }

    /* Reviewer chrome */
    .picker {
      position: sticky; top: 0; z-index: 50;
      background: #171A21; border-bottom: 1px solid var(--border);
      padding: 8px 12px; display: flex; gap: 8px; align-items: center; overflow-x: auto;
    }
    .picker-label { color: var(--text-xlight); font-size: 12px; white-space: nowrap; margin-right: 4px; }
    .picker button {
      background: var(--fill-one); border: 1px solid var(--border-fill-one); color: var(--text-light);
      border-radius: 4px; padding: 4px 8px; font-size: 12px; white-space: nowrap;
    }
    .picker button.active { background: var(--fill-primary); border-color: var(--fill-primary); color: #fff; }
    .note {
      margin: 0 12px 0 auto; color: var(--text-xlight); font-size: 12px; white-space: nowrap;
    }

    /* App chrome */
    .app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: calc(100vh - 41px); }
    .app-sidebar {
      background: var(--fill-accent); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; padding: 12px 8px; gap: 4px;
    }
    .nav-ico {
      width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center;
      color: var(--icon-light); background: transparent; border: 0;
    }
    .nav-ico:hover { background: var(--fill-zero-hover); color: var(--text); }
    .nav-ico.active { background: var(--fill-one-selected); color: var(--text); }
    .nav-ico svg { width: 18px; height: 18px; }
    .app-main { display: flex; flex-direction: column; min-width: 0; background: var(--fill-zero); }
    .topbar {
      background: var(--fill-accent); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px;
    }
    .crumbs { color: var(--text-xlight); font-size: 13px; }
    .crumbs b { color: var(--text); font-weight: 500; }
    .crumb-link { color: var(--text-xlight); cursor: pointer; }
    .crumb-link:hover { color: var(--text); }
    .project { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-light); font-size: 13px; }
    .spacer { flex: 1; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: #3D424D; display: grid; place-items: center; font-size: 11px; }
    .cmdk { color: var(--text-xlight); font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; }
    .btn-chat { background: var(--fill-one); border: 1px solid var(--border-fill-one); color: var(--text); border-radius: 3px; padding: 4px 10px; font-size: 13px; }

    /* Layouts */
    .with-sidenav {
      display: grid; grid-template-columns: var(--sidenav) 1fr; height: 100%; min-height: 0; padding: 16px 16px 16px 8px; gap: 24px;
    }
    .sidenav { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
    .sidenav-label { font-size: 11px; letter-spacing: 0.08em; color: var(--text-xlight); padding: 4px 12px 8px; }
    .sidenav button {
      text-align: left; background: transparent; border: 0; border-radius: 4px;
      padding: 8px 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px;
    }
    .sidenav button:hover { background: var(--fill-zero-hover); color: var(--text); }
    .sidenav button.active { background: var(--fill-one-selected); color: var(--text); font-weight: 600; }
    .nav-count { margin-left: auto; color: var(--text-xlight); font-size: 12px; font-weight: 500; }
    .page { min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; min-height: 40px; }
    .title { font-size: 20px; line-height: 24px; font-weight: 500; margin: 0; }
    .subtitle { color: var(--text-light); margin: 4px 0 0; max-width: 640px; }
    .page-tabs { display: flex; gap: 20px; }
    .page-tabs button { background: 0; border: 0; font-size: 20px; line-height: 24px; font-weight: 500; color: var(--text-disabled); padding: 0; }
    .page-tabs button.active { color: var(--text); }
    .caret { color: var(--icon-light); width: 16px; height: 16px; }

    .btn { border: 0; border-radius: 3px; padding: 8px 12px; font-weight: 600; background: var(--fill-primary); color: #fff; }
    .btn:hover { background: var(--fill-primary-hover); }
    .btn.secondary { background: var(--fill-two); color: var(--text); border: 1px solid var(--border-fill-one); }
    .btn.secondary:hover { background: var(--fill-one-hover); }
    .btn.small { padding: 4px 10px; font-size: 13px; }
    .btn.danger { background: transparent; color: var(--icon-danger); border: 1px solid var(--border-danger); }
    .btn.ghost { background: transparent; color: var(--text-light); }
    .btn[disabled] { opacity: .45; pointer-events: none; }

    .card { background: var(--fill-one); border: 1px solid var(--border-fill-one); border-radius: var(--radius); }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; color: var(--text-xlight); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border-fill-one); }
    .table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .table tr.click:hover td { background: var(--fill-one-hover); cursor: pointer; }
    .row-title { font-weight: 500; }
    .row-sub { color: var(--text-xlight); font-size: 12px; margin-top: 2px; }

    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 3px; padding: 0 8px; height: 20px; font-size: 12px; border: 1px solid var(--border-fill-one); background: var(--fill-two); color: var(--text-light); }
    .chip.ok { border-color: #1B4332; background: #13261E; color: var(--green-200); }
    .chip.bad { border-color: #5C2A35; background: #2A151A; color: var(--red-200); }
    .chip.info { border-color: #1B3352; background: #132033; color: var(--blue-200); }
    .chip.warn { border-color: #4A4420; background: #2A2714; color: var(--yellow-200); }

    .icon-btn { width: 28px; height: 28px; border: 0; background: transparent; color: var(--icon-light); border-radius: 4px; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--fill-zero-hover); color: var(--text); }
    .icon-btn.danger:hover { color: var(--icon-danger); }

    .empty { padding: 48px 24px; text-align: center; }
    .empty h3 { margin: 0 0 8px; font-weight: 500; }
    .empty p { margin: 0 0 16px; color: var(--text-xlight); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 13px; font-weight: 600; }
    .hint { color: var(--text-xlight); font-size: 12px; }
    .input, .select, .textarea {
      background: var(--fill-zero); border: 1px solid var(--border-input); border-radius: 3px;
      padding: 8px 10px; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--border-primary); }
    .textarea { min-height: 88px; resize: vertical; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--fill-zero); border: 1px solid var(--border-input); border-radius: 3px; min-height: 40px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--fill-two); border-radius: 3px; padding: 2px 8px; font-family: "JetBrains Mono", monospace; font-size: 12px; }
    .tag button { border: 0; background: 0; color: var(--text-xlight); padding: 0; }
    .tags input { border: 0; background: 0; outline: 0; flex: 1; min-width: 120px; padding: 4px; }

    .split { display: flex; gap: 16px; min-height: 0; }
    .step-nav { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
    .step-nav button { text-align: left; background: transparent; border: 0; border-radius: 4px; padding: 8px; color: var(--text); }
    .step-nav button.active { background: var(--fill-one-selected); }
    .form-card { flex: 1; max-width: 750px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .footer-actions { display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); margin-top: auto; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .tabs button { background: 0; border: 0; color: var(--text-xlight); padding: 8px 12px; border-bottom: 2px solid transparent; }
    .tabs button.active { color: var(--text); border-bottom-color: var(--fill-primary); font-weight: 600; }

    .editor {
      font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 18px;
      background: #0E1015; border: 1px solid var(--border); border-radius: 4px;
      padding: 12px; color: #C5C9D2; white-space: pre; overflow: auto; min-height: 280px;
    }
    .kw { color: #9FA3F9; } .str { color: #99F5D5; } .cmt { color: #5D626F; } .fn { color: #99C9FF; }

    .json {
      font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 18px;
      background: #0E1015; border: 1px solid var(--border); border-radius: 4px;
      padding: 12px; white-space: pre; overflow: auto; min-height: 360px; color: #C5C9D2;
    }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
    .panel-label { font-size: 12px; color: var(--text-xlight); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .workspace { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; min-height: 0; flex: 1; }
    .panel { background: var(--fill-one); border: 1px solid var(--border-fill-one); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .panel-kicker { font-size: 11px; letter-spacing: 0.08em; color: var(--text-xlight); font-weight: 600; }
    .panel-meta { color: var(--text-xlight); font-size: 12px; }
    .panel-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
    .editor.lined { min-height: 420px; }
    .ln { color: #5D626F; display: inline-block; width: 28px; user-select: none; }
    .sim-empty { border: 1px dashed var(--border-input); border-radius: 4px; padding: 28px 16px; text-align: center; color: var(--text-xlight); }
    .tab-count { color: var(--text-xlight); font-weight: 400; margin-left: 6px; font-size: 12px; }
    .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .recorded { display: flex; align-items: center; gap: 8px; color: var(--text-xlight); font-size: 13px; padding-top: 4px; }

    /* Workbench */
    .wb { display: flex; height: 100%; min-height: 0; }
    .wb-side { width: 250px; flex-shrink: 0; background: var(--fill-accent); border-right: 1px solid var(--border-fill-one); padding: 16px; overflow: auto; }
    .wb-body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px 20px; gap: 12px; }
    .wb-head { display: flex; align-items: center; gap: 12px; }
    .section { margin-bottom: 20px; }
    .section + .section { border-top: 1px solid var(--border-fill-one); padding-top: 16px; }
    .section h4 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--text-xlight); display: flex; justify-content: space-between; }
    .side-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--text-light); font-size: 13px; }
    .side-item .ico { width: 20px; height: 20px; display: grid; place-items: center; color: var(--icon-light); }
    .add-link { background: 0; border: 0; color: var(--text-xlight); font-size: 12px; padding: 0; }
    .add-link:hover { color: var(--text-light); }
    .prompt { background: var(--fill-one); border: 1px solid var(--border-fill-one); border-radius: 8px; min-height: 88px; padding: 12px; color: var(--text-xlight); }

    .subtabs { display: flex; gap: 4px; }
    .subtabs button { background: var(--fill-one); border: 1px solid var(--border-fill-one); color: var(--text-light); padding: 4px 10px; border-radius: 3px; }
    .subtabs button.active { background: var(--fill-zero-selected); color: var(--text); border-color: var(--border-input); }

    .menu {
      position: absolute; right: 20px; top: 92px; width: 220px; background: var(--fill-one);
      border: 1px solid var(--border-fill-one); border-radius: 6px; padding: 6px; box-shadow: 0 8px 24px #0008; z-index: 5;
    }
    .menu button { width: 100%; text-align: left; background: 0; border: 0; padding: 8px 10px; border-radius: 4px; display: flex; gap: 8px; align-items: center; color: var(--text-light); }
    .menu button:hover { background: var(--fill-zero-hover); color: var(--text); }
    .menu button.danger { color: var(--icon-danger); }
    .menu .sep { height: 1px; background: var(--border); margin: 4px 0; }

    .banner { padding: 10px 12px; border-radius: 4px; display: flex; gap: 10px; align-items: center; font-size: 13px; }
    .banner.ok { background: #13261E; border: 1px solid #1B4332; color: var(--green-200); }
    .banner.bad { background: #2A151A; border: 1px solid #5C2A35; color: var(--red-200); }
    .banner.info { background: #132033; border: 1px solid #1B3352; color: var(--blue-200); }

    .callout { font-size: 12px; color: var(--text-xlight); background: var(--fill-zero); border: 1px dashed var(--border-input); border-radius: 4px; padding: 8px 10px; }

    .mono { font-family: "JetBrains Mono", monospace; font-size: 12px; }
    .row-actions { display: flex; justify-content: flex-end; gap: 4px; }
    .center-col { max-width: 750px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .search { display: flex; align-items: center; gap: 8px; }
    .type-groups { display: flex; flex-direction: column; gap: 16px; }
    .type-group-label { font-size: 12px; color: var(--text-xlight); font-weight: 600; }
    .type-opt {
      display: block; width: 100%; text-align: left;
      background: var(--fill-zero); border: 1px solid var(--border-input);
      border-radius: 4px; padding: 10px 12px; margin-top: 6px;
    }
    .type-opt:hover { background: var(--fill-zero-hover); }
    .type-opt.active { border-color: var(--border-primary); background: var(--fill-zero-selected); }
    .type-opt .opt-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .type-opt .opt-title svg { width: 16px; height: 16px; color: var(--icon-light); }
    .type-opt .opt-sub { color: var(--text-xlight); font-size: 12px; font-weight: 400; margin: 4px 0 0 24px; }
    .modal-scrim {
      position: fixed; inset: 41px 0 0 0; background: #0009; z-index: 30;
      display: flex; justify-content: center; align-items: flex-start; padding: 40px 24px; overflow: auto;
    }
    .modal {
      width: min(960px, 100%); background: var(--fill-one); border: 1px solid var(--border-fill-one);
      border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .modal-kicker { font-size: 12px; color: var(--text-xlight); letter-spacing: 0.06em; font-weight: 600; }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .modal-title { margin: 4px 0 0; font-size: 20px; line-height: 24px; font-weight: 500; }
    .modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 8px; border-top: 1px solid var(--border); }
    .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .pick-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .pick-list { border: 1px solid var(--border-fill-one); border-radius: 6px; overflow: hidden; background: var(--fill-zero); max-height: 248px; overflow-y: auto; }
    .pick-row {
      display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0;
      border-bottom: 1px solid var(--border); background: transparent; color: inherit;
    }
    .pick-row:last-child { border-bottom: 0; }
    .pick-row:hover { background: var(--fill-zero-hover); }
    .pick-row.active { background: var(--fill-zero-selected); box-shadow: inset 0 0 0 1px var(--border-primary); }
    .pick-row .row-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .th { font-size: 11px; letter-spacing: 0.06em; color: var(--text-xlight); font-weight: 600; text-transform: uppercase; }
    .inferred {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 12px; background: var(--fill-zero); border: 1px solid var(--border-fill-one); border-radius: 6px;
    }
    .advanced-toggle {
      background: 0; border: 0; color: var(--text-light); padding: 0; display: inline-flex; align-items: center; gap: 6px;
    }
    .advanced-toggle:hover { color: var(--text); }
    .advanced-toggle .caret { transition: transform .15s ease; }
    .advanced-toggle.open .caret { transform: rotate(90deg); }
    .mutation {
      font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 16px;
      background: #0E1015; border: 1px solid var(--border); border-radius: 4px;
      padding: 10px 12px; color: #C5C9D2; white-space: pre; overflow: auto;
    }
    .modal.narrow { width: min(560px, 100%); }
    .combo { position: relative; }
    .combo-trigger {
      width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: var(--fill-zero); border: 1px solid var(--border-input); border-radius: 3px; padding: 8px 10px;
    }
    .combo-trigger:hover { background: var(--fill-zero-hover); }
    .combo.open .combo-trigger { border-color: var(--border-primary); }
    .combo-pop {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 8;
      background: var(--fill-one); border: 1px solid var(--border-fill-one); border-radius: 6px;
      box-shadow: 0 12px 32px #0008; overflow: hidden;
    }
    .combo-search { padding: 8px; border-bottom: 1px solid var(--border); }
    .combo-search input {
      width: 100%; background: var(--fill-zero); border: 1px solid var(--border-input);
      border-radius: 3px; padding: 6px 8px; outline: none;
    }
    .combo-search input:focus { border-color: var(--border-primary); }
    .combo-meta { padding: 6px 10px; font-size: 11px; color: var(--text-xlight); }
    .combo-list { max-height: 220px; overflow: auto; }
    .combo-empty { padding: 16px; text-align: center; color: var(--text-xlight); font-size: 13px; }
    .modal-scrim.over { z-index: 40; background: #000b; }
    .folder {
      display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: 0; flex: 1;
      border: 1px solid var(--border-fill-one); border-radius: 6px; overflow: hidden; background: var(--fill-one);
    }
    .folder-list {
      border-right: 1px solid var(--border-fill-one); background: var(--fill-accent);
      display: flex; flex-direction: column; min-height: 0; min-width: 0;
    }
    .folder-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); }
    .folder-filters button {
      background: var(--fill-one); border: 1px solid var(--border-fill-one); color: var(--text-light);
      border-radius: 3px; padding: 2px 8px; font-size: 12px;
    }
    .folder-filters button.active { background: var(--fill-zero-selected); color: var(--text); border-color: var(--border-input); }
    .folder-filters button.bad { color: var(--red-200); }
    .folder-filters button.ok { color: var(--green-200); }
    .folder-items { overflow: auto; flex: 1; }
    .folder-item {
      width: 100%; text-align: left; display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: inherit;
    }
    .folder-item:hover { background: var(--fill-zero-hover); }
    .folder-item.active { background: var(--fill-one-selected); box-shadow: inset 2px 0 0 var(--fill-primary); }
    .folder-score {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 11px; font-weight: 600;
      background: var(--fill-two); color: var(--text-light); border: 1px solid var(--border-fill-one);
    }
    .folder-score.bad { background: #2A151A; border-color: #5C2A35; color: var(--red-200); }

          <div class="callout">Keep existing <code>policyConstraints</code> queries and <code>/security/policies/:id</code> detail routes, but move them under <code>/security/gatekeeper</code>. Redirect old URLs.</div>`
      }),

      'wb-policies': () => chrome({
        area: 'workbench',
        crumb: `<span class="crumb-link" onclick="go('wb-launch')">workbenches</span> / <span class="crumb-link" onclick="go('wb-launch')">payments-sre</span> / <b>policies</b>`,
        body: `<div class="wb-body"><div class="center-col">
          <div>
            <div style="font-weight:600">payments-sre</div>
            <div class="row-sub">Investigate payment cluster incidents and open PRs</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:var(--text-light)">Attach policies to control tool execution on this workbench.</span>
            <div style="display:flex;gap:8px">
              <button class="btn secondary small" onclick="go('policies')">Manage policies ↗</button>
              <button class="btn small" onclick="go('wb-attach')">Add policy</button>
            </div>
          </div>
          <div class="card" style="overflow:hidden">
            <table class="table">
              <thead><tr><th></th><th>policy.name</th><th>policy.type</th><th>matches.regexes</th><th>updatedAt</th><th></th></tr></thead>
              <tbody>
                <tr>
                  <td style="width:46px"><div class="icon-btn" style="background:var(--fill-two);border-radius:50%">${I.shield}</div></td>
                  <td>
                    <div class="row-title mono">tool-admission.rego</div>
                    <div class="row-sub">WorkbenchPolicy id wbpol_01</div>
                  </td>
                  <td><span class="chip info">WORKBENCH</span></td>
                  <td class="mono">kube\\.(exec|delete|shell)</td>
                  <td class="row-sub">2h ago</td>
                  <td class="row-actions">
                    <button class="icon-btn" onclick="go('wb-edit')">${I.pencil}</button>
                    <button class="icon-btn danger">${I.trash}</button>
                  </td>
                </tr>
                <tr>
                  <td><div class="icon-btn" style="background:var(--fill-two);border-radius:50%">${I.shield}</div></td>
                  <td>
                    <div class="row-title mono">prod-write-guard.rego</div>
                    <div class="row-sub">WorkbenchPolicy id wbpol_02</div>
                  </td>
                  <td><span class="chip info">WORKBENCH</span></td>
                  <td class="row-sub">empty → all tools</td>
                  <td class="row-sub">yesterday</td>
                  <td class="row-actions">
                    <button class="icon-btn" onclick="go('wb-edit')">${I.pencil}</button>
                    <button class="icon-btn danger">${I.trash}</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="callout"><code>WorkbenchPolicy { id policy matches workbench insertedAt updatedAt }</code>. Name/type come from nested <code>policy</code>. <code>WorkbenchPolicyMatches</code> only has <code>regexes</code>. Delete is <code>deleteWorkbenchPolicy(id)</code>.</div>
        </div></div>`
      }),

      'wb-policies-empty': () => chrome({
        area: 'workbench',
        crumb: `<span class="crumb-link" onclick="go('wb-launch')">workbenches</span> / <span class="crumb-link" onclick="go('wb-launch')">payments-sre</span> / <b>policies</b>`,
        body: `<div class="wb-body"><div class="center-col">
          <div>
            <div style="font-weight:600">payments-sre</div>
            <div class="row-sub">Investigate payment cluster incidents and open PRs</div>
          </div>
          <div class="card empty">
            <h3>No policies attached</h3>
            <p>No policy connected. Select an existing policy or create one in Security.</p>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="btn secondary small" onclick="go('policies')">Manage policies ↗</button>
              <button class="btn small" onclick="go('wb-attach')">Select existing policy</button>
            </div>
          </div>
        </div></div>`
      }),

      'wb-attach': () => chrome({
        area: 'workbench',
        crumb: `<span class="crumb-link" onclick="go('wb-launch')">workbenches</span> / <span class="crumb-link" onclick="go('wb-launch')">payments-sre</span> / <span class="crumb-link" onclick="go('wb-policies')">policies</span> / <b>attach</b>`,
        body: `<div class="wb-body"><div class="center-col" style="max-width:968px">
          <div>
            <div style="font-weight:600">payments-sre</div>
            <div class="row-sub">Investigate payment cluster incidents and open PRs</div>
          </div>
          <div class="split">
            <div class="step-nav">
              <button class="active">Configuration</button>
            </div>
            <div class="card form-card">
              <div class="field">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <span class="label">Select policy *</span>
                  <a href="#" onclick="event.preventDefault();go('policy-create')">Create policy in security</a>
                </div>
                <select class="select">
                  <option>tool-admission.rego</option>
                  <option>prod-write-guard.rego</option>
                </select>
                <span class="hint">Scoped to <code>type: WORKBENCH</code>. Stack and auto-attach policies do not appear here.</span>
              </div>
              <div class="field">
                <span class="label">matches.regexes</span>
                <div class="tags">
                  <span class="tag">kube\\.(exec|delete|shell) <button>×</button></span>
                  <input placeholder="Add regex and press enter" />
                </div>
                <span class="hint">Only field on <code>WorkbenchPolicyMatches</code>. Empty list → policy applies to every tool on this workbench.</span>
              </div>
              <div class="callout"><code>createWorkbenchPolicy(workbenchId, { policyId, matches: { regexes } })</code>. Nested <code>policy</code> is selected, not authored here. Multiple attachments can match the same tool; any <code>output.deny</code> rejects.</div>
              <div class="footer-actions">
                <button class="btn secondary" onclick="go('wb-policies')">Back to all policies</button>
                <button class="btn" onclick="go('wb-policies')">Save</button>
              </div>
            </div>
          </div>
        </div></div>`
      }),

      'wb-edit': () => chrome({
        area: 'workbench',
        crumb: `<span class="crumb-link" onclick="go('wb-launch')">workbenches</span> / <span class="crumb-link" onclick="go('wb-launch')">payments-sre</span> / <span class="crumb-link" onclick="go('wb-policies')">policies</span> / <b>edit</b>`,
        body: `<div class="wb-body"><div class="center-col" style="max-width:968px">
          <div>
            <div style="font-weight:600">payments-sre</div>
            <div class="row-sub">Investigate payment cluster incidents and open PRs</div>
          </div>
          <div class="split">
            <div class="step-nav">
              <button class="active">Configuration</button>
            </div>
            <div class="card form-card">
              <div class="field">
                <span class="label">policy</span>
                <input class="input mono" value="tool-admission.rego" disabled />
                <span class="hint">Not in <code>updateWorkbenchPolicy</code>. To switch policies, delete this row and attach another.</span>
              </div>
              <div class="field">
                <span class="label">matches.regexes</span>
                <div class="tags">
                  <span class="tag">kube\\.(exec|delete|shell) <button>×</button></span>
                  <input placeholder="Add regex and press enter" />
                </div>
                <span class="hint">Only updatable field: <code>updateWorkbenchPolicy(id, { matches: { regexes } })</code>.</span>
              </div>
              <div class="footer-actions">
                <button class="btn secondary" onclick="go('wb-policies')">Back to all policies</button>
                <button class="btn" onclick="go('wb-policies')">Save</button>
              </div>
            </div>
          </div>
        </div></div>`
      }),

      'wb-launch': () => chrome({
        area: 'workbench',
        crumb: `<span class="crumb-link">workbenches</span> / <b>payments-sre</b>`,
        body: `<div class="wb" style="position:relative">
          <aside class="wb-side">
            <div class="section">
              <h4>Tools <button class="add-link">${I.plus}</button></h4>
              <div class="side-item"><span class="ico">${I.k8s}</span> Kubernetes</div>
              <div class="side-item"><span class="ico">${I.cd}</span> GitHub</div>
            </div>
            <div class="section">
              <h4>Webhooks <button class="add-link">${I.plus}</button></h4>
              <div class="side-item"><span class="ico">${I.hook}</span> pagerduty-incidents</div>
            </div>
            <div class="section">
              <h4>Chatbots <button class="add-link">${I.plus}</button></h4>
              <div class="side-item"><span class="ico">${I.bot}</span> #payments-sre</div>
            </div>
            <div class="section">
              <h4>Policies <button class="add-link" onclick="go('wb-attach')">${I.plus}</button></h4>
              <div class="side-item" onclick="go('wb-edit')" style="cursor:pointer"><span class="ico">${I.shield}</span> tool-admission.rego</div>
              <div class="side-item" onclick="go('wb-edit')" style="cursor:pointer"><span class="ico">${I.shield}</span> prod-write-guard.rego</div>
            </div>
            <div class="section">
              <h4>Cron schedules <button class="add-link">${I.plus}</button></h4>
              <div class="side-item"><span class="ico">${I.clock}</span> 0 9 * * 1-5</div>
            </div>
          </aside>
          <div class="wb-body">
            <div class="wb-head">
              <div>
                <div class="title">payments-sre</div>
              </div>
              <div class="spacer"></div>
              <div class="subtabs">
                <button class="active">Launch</button>
                <button>Jobs</button>
                <button>Issues</button>
                <button>Alerts</button>
                <button>Evals</button>
              </div>
              <button class="btn small">Edit workbench</button>
              <button class="icon-btn" onclick="state.menu=!state.menu;render()">${I.more}</button>
            </div>
            <div class="row-sub">Investigate payment cluster incidents and open PRs</div>
            <div class="prompt">Ask this workbench to investigate an incident…</div>
            ${state.menu ? `<div class="menu">
              <button>${I.gear} Edit workbench</button>
              <button>${I.tools} Tools</button>
              <button>${I.clock} Cron schedules</button>
              <button>${I.hook} Webhook triggers</button>
              <button>${I.bot} Chatbots</button>
              <button onclick="go('wb-policies')">${I.shield} Policies</button>
              <button>Saved prompts</button>
              <button>Eval settings</button>
              <div class="sep"></div>
              <button class="danger">${I.trash} Delete workbench</button>
            </div>` : ''}
            <div class="callout">Add Policies to the ⋯ menu (<code>WorkbenchMoreMenuKey.Policies</code>) and a side-panel section after Chatbots, matching Webhooks/Chatbots rows (click → edit attach).</div>
          </div>
        </div>`
      }),
    }

    function render() {
      document.getElementById('app').innerHTML = (screens[state.screen] || screens.policies)()
      document.querySelectorAll('.picker button').forEach((b) => {
        const screenMatch = b.dataset.go === state.screen
        const kindMatch = !b.dataset.kind || b.dataset.kind === state.policyKind
        const policyMatch = !b.dataset.policy || b.dataset.policy === state.attachPolicy
        const nestedMatch = b.dataset.bindcreate ? !!state.bindCreate : (b.dataset.go !== 'attachment-create' || !state.bindCreate)
        b.classList.toggle('active', screenMatch && kindMatch && policyMatch && nestedMatch)
      })
      const search = document.querySelector('[data-combo-search]')
      if (search && state.attachOpen && !state.bindCreate) {
        search.focus()
        const n = search.value.length
        search.setSelectionRange(n, n)
      }
    }

    document.querySelector('.picker').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-go]')
      if (!btn) return
      if (btn.dataset.kind) state.policyKind = btn.dataset.kind
      if (btn.dataset.policy) state.attachPolicy = btn.dataset.policy
      if (btn.dataset.bindcreate) {
        go('attachment-create')
        openBindCreate()
        return
      }
      state.bindCreate = false
      go(btn.dataset.go)
    })
    window.go = go
    window.openBind = openBind
    window.backFromBind = backFromBind
    window.openRule = openRule
    window.openEval = openEval
    window.selectEval = selectEval
    window.setEvalFilter = setEvalFilter
    window.pickAttach = pickAttach
    window.pickBind = pickBind
    window.toggleCombo = toggleCombo
    window.openBindCreate = openBindCreate
    window.cancelBindCreate = cancelBindCreate
    window.saveBindCreate = saveBindCreate
    const params = new URLSearchParams(location.search)
    if (params.get('kind') === 'autoattach' || params.get('kind') === 'enforcement') state.policyKind = params.get('kind')
    if (location.hash.slice(1) && screens[location.hash.slice(1)]) state.screen = location.hash.slice(1)
    render()
  </script>
</body>
</html>
