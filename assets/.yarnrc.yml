afterInstall: cd ../ && npx husky assets/.husky

approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmMinimalAgeGate: 60

# packageExtensions patches manifests of upstream packages so that their
# nested peer dependencies are visible to Yarn. Ranges below mirror what
# the requesting package declares so we don't silently accept incompatible
# major-version bumps. Re-audit on dependency upgrades; if a rule becomes
# redundant Yarn will warn with YN0068.
packageExtensions:
  # Algolia + DocSearch: nested @algolia/autocomplete-shared declares peers
  # for algoliasearch / @algolia/client-search, but the parents in the chain
  # don't, so Yarn can't see the root-installed deps satisfy them.
  "@algolia/autocomplete-core@*":
    peerDependencies:
      "@algolia/client-search": ">= 4.9.1 < 6"
      algoliasearch: ">= 4.9.1 < 6"
      search-insights: ">= 1 < 3"
  "@algolia/autocomplete-plugin-algolia-insights@*":
    peerDependencies:
      "@algolia/client-search": ">= 4.9.1 < 6"
      algoliasearch: ">= 4.9.1 < 6"
  # Apollo sandbox: graphql-ws + subscriptions-transport-ws both peer-depend
  # on graphql, and @apollo/sandbox doesn't forward the requirement.
  "@apollo/sandbox@*":
    peerDependencies:
      graphql: ^15.7.2 || ^16.0.0
  "@docsearch/react@*":
    peerDependencies:
      "@algolia/client-search": ">= 4.9.1 < 6"
      algoliasearch: ">= 4.9.1 < 6"

  # Nivo: every chart package's nested deps (@react-spring/web,
  # react-virtualized-auto-sizer) need react-dom but Nivo only forwards
  # react. Range mirrors Nivo's own react peer.
  "@nivo/annotations@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/arcs@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/axes@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/colors@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/core@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/geo@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/legends@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/line@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/pie@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/polar-axes@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/radial-bar@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/text@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/tooltip@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/treemap@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0
  "@nivo/voronoi@*":
    peerDependencies:
      react-dom: ^16.14 || ^17.0 || ^18.0 || ^19.0

  # Storybook 9.1.x: nested @mdx-js/react / @typescript-eslint/utils /
  # @testing-library/user-event need types and tooling deps the storybook
  # parents don't forward. Fixed upstream in 10.4 (storybookjs/storybook#34641).
  "@storybook/addon-docs@*":
    peerDependencies:
      "@types/react": ^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0
  eslint-plugin-storybook@*:
    peerDependencies:
      typescript: ">=4.8.4 <6.1.0"
  storybook@*:
    peerDependencies:
      "@testing-library/dom": ">=7.21.4"

  # Babel plugin: @babel/plugin-syntax-jsx wants @babel/core; the styled-
  # components plugin doesn't forward it.
  babel-plugin-styled-components@*:
    peerDependencies:
      "@babel/core": ^7.0.0-0

  # vite-plugin-dts 5 wraps unplugin-dts internally; unplugin-dts declares
  # typescript as a required peer but vite-plugin-dts doesn't re-forward it.
  vite-plugin-dts@*:
    peerDependencies:
      typescript: ">=4"

# interactive-tools is built into Yarn 4; after-install replaces the
# Yarn 3 postinstall plugin for running husky after every install.
plugins:
  - checksum: 44a06a583a46ab1e2de2a04c115868bea51f01a314f261b628fbf6d92b2be63c0d155be3d3094d440daf58ff3f263aba4c9384a1c60c5d26cc0db086ad990459
    path: .yarn/plugins/@yarnpkg/plugin-after-install.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-after-install/v0.7.0/bundles/@yarnpkg/plugin-after-install.js"

yarnPath: .yarn/releases/yarn-4.17.1.cjs
