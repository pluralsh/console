- version: 1.0.0
  kube: ['1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27',
    '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm values / chart behavior changes to review\n\n- **`miniReplicas`\
      \ removed from the RayCluster sample/template**: release notes mention removing\
      \ `miniReplicas` in `raycluster-cluster.yaml`. If you previously set `miniReplicas`\
      \ in values or relied on that sample, remove/replace it.\n- **Custom labels\
      \ propagation fix**: if you had workarounds to get labels into rendered manifests,\
      \ re-check and simplify values; behavior is fixed in v1.0.0.\n- **Worker-group-specific\
      \ images**: chart now supports setting different container images per worker\
      \ group; if you were using a single global image but need per-group overrides,\
      \ adopt the new fields.\n- **Init containers support**: chart allows manually\
      \ defining initContainers; if you previously patched manifests post-render,\
      \ you can move that logic into values.\n- **Template reference fix**: chart\
      \ rendering changed slightly (bugfix); validate with `helm template`/diff before\
      \ applying.\n\n> Note: the provided notes don\u2019t include a full Helm `values.yaml`\
      \ diff; treat the above as items to verify in your own values files during the\
      \ upgrade."
    chart_updates: ['KubeRay **CRDs promoted from `v1alpha1` to `v1`** (GA). This
        is the main upgrade driver: CRDs and any custom resources must be compatible
        with the new API version.', 'RayCluster: **replicas becomes optional** for
        `WorkerGroupSpec` (may affect validation/defaulting expectations).', 'RayCluster:
        **Ray container must be the first application container** (pod spec ordering
        matters; sidecars still allowed).', 'Autoscaler behavior tightened: **only
        the autoscaler is allowed to decide pod deletions**; operator stops certain
        event-listening behavior and refines pod deletion logic.', 'GCS fault tolerance
        improvements: better cleanup UX, sidecar handling, default probe values, fixes
        for Redis address parsing and HA issues.', 'RayService: option to make **zero-downtime
        upgrades optional**; bugfixes to avoid unnecessary upgrades and improve recovery
        behavior.', 'RayJob UX/behavior improvements: defaults for submitter resources,
        better status reconciliation, readiness checks, log streaming enabled via
        `PYTHONUNBUFFERED`, runtime env field and other API enhancements.', 'Observability:
        added scraping of autoscaler/dashboard metrics; more logging for networking/troubleshooting.',
      'Docs relocation: most documentation moved to the Ray website; expect broken
        in-repo links and update internal runbooks.', 'API server: expanded job APIs,
        Python client, v1 URL updates, probes, OpenShift support, HA example.']
    features: ['GA release: CRDs and APIs move to stable `v1` (from `v1alpha1`).',
      'Improved GCS fault tolerance, including Redis cleanup on RayCluster deletion
        and better default health probes.', 'RayService enhancements: optional zero-downtime
        upgrades and improved HA examples/behavior.', 'RayJob improvements: better
        status reconciliation, default submitter CPU/memory, log streaming, runtime
        env support, and more robust job submission flow.', 'Helm improvements: per-worker-group
        images and ability to define initContainers via values, plus label/template
        fixes.', Added/expanded KubeRay API server capabilities including Python client
        and extended job APIs.]
    breaking_changes: ["**CRD API version bump `v1alpha1` \u2192 `v1`**: existing\
        \ RayCluster/RayJob/RayService manifests and any automation referencing the\
        \ old API version must be updated and resources may need migration/re-apply\
        \ after CRD upgrade.", 'RayCluster pod spec constraint: **Ray container must
        be the first application container**; clusters using a sidecar-first ordering
        will fail validation or behave incorrectly until reordered.', 'Autoscaler/operator
        semantics change around pod deletions: **only autoscaler can delete pods**;
        any custom tooling or expectations around operator-driven deletions/scale-down
        may change during upgrades.']
  chart_version: 1.0.0
  images: ['kuberay/operator:v1.0.0']
- version: 0.6.0
  kube: ['1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27',
    '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: '- **New Helm value:** `crNamespacedRbacEnable` (added in 0.6.0)
      to enable/disable creation of `Role`/`RoleBinding` used for RayCluster preparation
      (namespaced RBAC).

      - **RBAC behavior fix:** when `singleNamespaceInstall=true` and `rbacEnable=true`,
      0.6.0 fixes an issue where KubeRay attempted to create a `ClusterRoleBinding`.

      - **Worker replica edge case:** Helm now supports **zero worker replicas** (previously
      could fail).


      **Action for upgrade:** review your `values.yaml` for RBAC-related settings
      (`singleNamespaceInstall`, `rbacEnable`) and decide whether you want namespaced
      RBAC for RayCluster prep via `crNamespacedRbacEnable`.'
    chart_updates: [Introduced optional creation of namespaced RBAC resources (Role/RoleBinding)
        for RayCluster preparation via `crNamespacedRbacEnable`., Fixed Helm/RBAC
        logic to avoid creating ClusterRoleBinding in single-namespace installs.,
      Fixed Helm templating/logic to allow worker groups with 0 replicas.]
    features: ['RayService: added support for multi-app Serve config provided as a
        YAML-string and status reporting for multi-app deployments.', 'RayJob: refactored
        submission flow to use a Kubernetes Job as the submitter mechanism instead
        of relying on dashboard status polling.', 'KubeRay API server: added support
        for OpenShift Routes and service account integration.', 'Autoscaler: improved
        safety/stability by ensuring only the autoscaler makes scale-down pod deletion
        decisions.']
    breaking_changes: ['RBAC/installation behavior may change for single-namespace
        installs: 0.6.0 corrects ClusterRoleBinding creation; clusters that accidentally
        relied on that cluster-scoped binding may need explicit RBAC adjustments.',
      RayJob submission mechanism changed (now uses a K8s Job); any workflows that
        depended on the previous dashboard-client based behavior/log locations may
        need updates.]
  chart_version: 0.6.0
  images: ['kuberay/operator:v0.6.0']
- version: 0.5.2
  kube: ['1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27',
    '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: '- **Service spec customization expanded:** KubeRay now allows specifying
      the *entire* `headService` and `serveService` YAML spec (not just selected fields
      like `labels`/`annotations`). Review any existing values that previously relied
      on the old limited knobs and migrate to the new full-service-spec fields if
      needed. (PRs [#1040](https://github.com/ray-project/kuberay/pull/1040), [#1117](https://github.com/ray-project/kuberay/pull/1117))

      - **Worker init container injection is now configurable:** A new flag lets you
      enable/disable worker init-container injection. If you were depending on implicit
      behavior from older versions or have custom init containers, verify the default
      and explicitly set the flag to match your expectations. (PR [#1069](https://github.com/ray-project/kuberay/pull/1069))

      - **Helm ray-cluster bugfix:** Fix parsing `envFrom` in `additionalWorkerGroups`.
      If your `values.yaml` uses `additionalWorkerGroups.*.envFrom`, re-test templating
      and rendered manifests. (PR [#1039](https://github.com/ray-project/kuberay/pull/1039))

      '
    chart_updates: ['Operator can watch Custom Resources in multiple namespaces using
        namespaced RBAC resources; this typically implies additional/changed RBAC
        manifests and possibly new configuration for the watch scope. (PR [#1106](https://github.com/ray-project/kuberay/pull/1106))',
      'RayService and autoscaler reconciliation logic received multiple stability
        fixes that may change reconciliation frequency and service generation behavior
        (less churn). (PRs [#1056](https://github.com/ray-project/kuberay/pull/1056),
        [#1065](https://github.com/ray-project/kuberay/pull/1065), [#1074](https://github.com/ray-project/kuberay/pull/1074))',
      'Autoscaler behavior fixes: worker removal and RayService/autoscaler interaction
        improved; expect different scaling/downscale behavior compared to 0.4.x. (PRs
        [#1037](https://github.com/ray-project/kuberay/pull/1037), [#1139](https://github.com/ray-project/kuberay/pull/1139))']
    features: [Full customization of the Head and Serve Kubernetes Services (`headService`
        and `serveService`) instead of only labels/annotations., Operator can watch
        Ray CRs across multiple namespaces with namespaced RBAC resources., RayJob
        gains a `suspend` capability (feature introduced in 0.5.x line)., Configurable
        enable/disable for worker init-container injection., 'Improved RayService
        stability: status updates and dashboard submission behavior are less noisy
        and more reliable.']
    breaking_changes: ['Potential RBAC/authorization change: a fix labeled **[breaking
