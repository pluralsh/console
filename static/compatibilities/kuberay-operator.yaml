  summary:
    helm_changes: ''
    chart_updates: ['KubeRay operator bugfixes in v1.1.1: fixes crash when RayCluster
        sets `resources.limits` without `resources.requests`, and prevents unintended
        worker Pod deletions when using an older v1.0.0 CRD with a v1.1.x operator
        image.', v1.2.2 adds (alpha) kubectl plugin (`kubectl ray get/session/log/job
        submit`) shipped as separate assets; not part of the operator chart unless
        you choose to distribute it., 'v1.2.2 adds (alpha) Kubernetes Events emitted
        by controllers to surface reconciliation failures and lifecycle milestones
        (e.g., failed pod/serviceaccount creation, RayJob submitter/cluster creation/deletion,
        GCS FT Redis cleanup job). Expect new Event objects in namespaces where Ray
        resources run.', v1.2.2 adds (alpha) Apache YuniKorn gang scheduling integration
        and scheduler-related behavior changes (batch scheduler option and defaults).,
      'Behavioral tweaks: RayCluster headless worker service publishes not-ready addresses;
        exec probe timeouts for head pods are longer, which can affect readiness/liveness
        timing expectations.', 'Deprecation: RayCluster `.status.state` is deprecated
        in favor of other status signals/events.']
    features: ['Alpha kubectl plugin for interacting with Ray resources (`kubectl
        ray get`, `session`, `log`, `job submit`).', 'Alpha Kubernetes Events emission
        for key operator actions and failures, improving observability during reconciles.',
      Alpha Apache YuniKorn gang scheduling support for Ray workloads., RayJob enhancements
        including UserMode SubmissionMode and better failure feedback via logs/events.]
    breaking_changes: ['Scheduler configuration changes: introduction of `batch-scheduler`
