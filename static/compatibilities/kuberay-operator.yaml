  summary:
    helm_changes: "- **Breaking:** In the `kuberay-operator` Helm chart, `metrics.serviceMonitor.selector`\
      \ was **renamed** to `metrics.serviceMonitor.additionalLabels`, and the chart\
      \ will **no longer emit empty labels**. If you set the old field in your values,\
      \ update it before upgrading.\n- Several features are controlled via **operator\
      \ feature gates** (CLI args), so ensure your Helm values/operator args reflect\
      \ what you want enabled/disabled:\n  - `RayClusterHistoryServer` (alpha, default\
      \ **off**)\n  - `RayClusterMTLS` (alpha, default **off**)\n  - `RayClusterNetworkPolicy`\
      \ (alpha, default **off**)\n  - `GCSFaultToleranceEmbeddedStorage` (alpha, default\
      \ **off**)\n  - `RayServiceIncrementalUpgrade` (now **beta and enabled by default**)\n"
    chart_updates: ['History Server images are now published to `quay.io/kuberay`
        (e.g., `historyserver:v1.7.0`, `collector:v1.7.0`).', 'Operator memory-usage
        improvements (pod informer cache selectors, more efficient pod resource calculation)
        may change runtime characteristics/footprint but should be transparent to
        chart consumers.', 'Grafana dashboards updated for Ray 2.56 (if you deploy
        dashboards via chart/configmaps, expect updated content).']
    features: ['Ray History Server graduates to **beta** with major performance/scalability
        improvements, token auth support, and better UI/API coverage (cluster selection,
        task logs, Serve/placement groups/Ray Data endpoints polled by default).',
      Operator can **auto-inject** the History Server collector sidecar into RayCluster
        pods when `RayClusterHistoryServer` feature gate is enabled and `spec.historyServerOptions`
        is set., 'RayService **Incremental Upgrade** is now **beta and enabled by
        default**, adding safer zero-downtime upgrades with rollback support and improved
        reliability.', Alpha **mTLS via cert-manager** for pod-to-pod TLS in RayCluster
        (feature-gated)., Alpha **NetworkPolicy** support for RayCluster via new `spec.networkPolicy`
        (feature-gated)., Alpha **GCS fault tolerance with embedded RocksDB storage**
        to avoid external Redis (feature-gated)., 'Other: built-in Ingress options
        on `headGroupSpec.ingressOptions`, RayCronJob `spec.timeZone`, WorkerGroup
        `priority`, operator `defaultPodAnnotations/defaultPodLabels`, and `kubectl
        ray logs --gke-link`.']
    breaking_changes: ["Helm values breaking rename: `metrics.serviceMonitor.selector`\
        \ \u2192 `metrics.serviceMonitor.additionalLabels`; empty labels no longer\
        \ emitted.", "History Server config changes from v1.6 alpha to v1.7 beta:\
        \ S3 credentials now use standard AWS env vars, a runtime-class flag replaced\
        \ by `--storage-backend`, and the on-storage event layout changed\u2014redeploy\
        \ collector and server together and follow updated setup guide."]
  chart_version: 1.7.0
  images: ['quay.io/kuberay/operator:v1.7.0']
