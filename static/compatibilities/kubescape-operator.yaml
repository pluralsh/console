- version: 1.40.3
  kube: ['1.37', '1.36', '1.35']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm values / deployment behavior changes to review\n\n- **Kubernetes\
      \ version requirement**: chart now **requires Kubernetes >= 1.28** via a `kubeVersion`\
      \ guard.\n- **OpenTelemetry**:\n  - OTEL is now **scoped to node-agent** via\
      \ an `otelUrl` setting.\n  - The chart **drops the bundled `otel-collector`**\
      \ (if you relied on the chart to deploy a collector, you must run your own collector\
      \ and point node-agent at it).\n- **Prometheus monitoring**: **prometheus-exporter\
      \ `ServiceMonitor` is decoupled** from the main kubescape `ServiceMonitor` (verify\
      \ your monitoring setup still discovers/scrapes what you expect).\n- **New/updated\
      \ config knobs (likely values.yaml additions)**:\n  - `kubevuln`: `proxyRegistryMap`\
      \ (cluster config), `cveMatchingMode`, `trustedVendors`.\n  - `node-agent`:\
      \ `alertDeduplication.bypass` exposed.\n  - **Capabilities**: `capabilities.remediation`\
      \ introduced as **opt-in**, with **gated mutating RBAC** (enabling it changes\
      \ RBAC and allows remediation actions).\n- **Air-gapped / offline**: fixes to\
      \ **offline kubescape config mount** and **keep-local scan defaults**; re-validate\
      \ any custom offline mounts/paths.\n- **Autoscaler/node targeting**: node-agent\
      \ targeting updated to include **label-less nodes** (affinity `DoesNotExist`);\
      \ also mount guards aligned for the operator node-agent autoscaler.\n"
    chart_updates: [Enables/ships **CEL admission rules** support in the operator
        and adds **CEL validation** to `SecurityException` CRDs (plus a CEL rule tweak
        for GitOps reconcilers using `oldSelf` semantics)., 'Synchronizer now syncs
        additional resource types, including **ServiceAccounts**, **ContainerProfiles**,
        and registers **AISandboxHeartbeats httpEndpoint** resource.', 'Node-agent
        GKE Autopilot allowlist: default bumped to **1.40-v2**, plus drift-gating
        tooling and optional **AllowlistSynchronizer** install when enabled.', 'Storage:
        pod now restarts on storage config changes (to apply config reliably).', 'Label
        hygiene: sanitizes `''+''` in `app.kubernetes.io/version` label to comply
        with label constraints.']
    features: [Operator can run **CRD-driven CEL admission rules** (including async
        validation) and chart enables this capability., '`SecurityException` CRDs
        gain **CEL validation**, improving early rejection of invalid exceptions;
        operator also watches exceptions and can rescan on change/expiry.', '**Opt-in
        remediation capability** (`capabilities.remediation`) with the required mutating
        RBAC gates.', 'Kubevuln gains **registry/proxy mapping and matching controls**
        (`proxyRegistryMap`, `cveMatchingMode`, `trustedVendors`) to tune vuln matching
        in enterprise registries.', Node-agent OTEL improvements and config exposure
        (notably `alertDeduplication.bypass`) plus better scheduling behavior on nodes
        missing grouping labels., 'Synchronizer expands what it syncs (ServiceAccounts,
        ContainerProfiles) and adds optional **Kafka backend** support (component-level).']
    breaking_changes: [Chart enforces **Kubernetes >= 1.28**; installs/upgrades will
        fail on older clusters until the cluster is upgraded., 'Chart **no longer
        bundles an OpenTelemetry collector**; if you depended on it, you must deploy/operate
        your own OTEL collector and configure node-agent to use it via `otelUrl`.']
  chart_version: 1.40.3
