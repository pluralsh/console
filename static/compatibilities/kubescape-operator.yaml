- version: 1.40.4
  kube: ['1.37', '1.36', '1.35']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "### Helm values / configuration changes to review\n\n- **`kubescape.submit`\
      \ removed from docs**: the README no longer references `kubescape.submit` (it\
      \ was dead). If you still have this value in your `values.yaml`, it is likely\
      \ ignored and can be removed.\n\n- **New: expose `defaultFrameworks`**\n  -\
      \ The chart now exposes a `defaultFrameworks` value for **kubescape-operator\
      \ posture scans**.\n  - Operator now **honors install-time `defaultFrameworks`**\
      \ for posture scans.\n  - Action: if you want to control which frameworks are\
      \ scanned by default, set `defaultFrameworks` explicitly; otherwise behavior\
      \ should remain the chart default.\n\n- **New: opt-in RBAC for runtime posture**\n\
      \  - Chart adds **optional RBAC** to support \u201Cagent runtime posture\u201D\
      .\n  - Action: if you enable the runtime posture feature, ensure you also enable/accept\
      \ the new RBAC toggle(s) and verify they align with your cluster\u2019s RBAC\
      \ policies.\n\n- **New: storage APIServer host networking option**\n  - Storage\
      \ can now be configured to run its APIServer **on the host network** (opt-in).\n\
      \  - Action: only enable if required; validate network policy/firewalling and\
      \ port conflicts.\n\n- **New: disable exec + open tracing options**\n  - Adds\
      \ chart options to disable **exec tracing** and **open tracing**.\n  - Action:\
      \ if you have security/compliance concerns, consider disabling; otherwise defaults\
      \ likely keep prior behavior.\n\n- **Autoupdater: pod metadata overrides**\n\
      \  - Autoupdater supports overriding pod metadata (labels/annotations).\n  -\
      \ Action: if you rely on standardized labels/annotations for policy/monitoring,\
      \ consider using these overrides.\n\n- **Node-agent config refactor**\n  - \u201C\
      Extra\u201D node-agent configuration moved under an `extra` section.\n  - Action:\
      \ if you currently set node-agent \u201Cextra\u201D config keys, confirm the\
      \ new path and adjust `values.yaml` accordingly.\n\n- **RBAC tightening (may\
      \ affect custom workflows)**\n  - **Node-agent**: dropped RBAC for `pods/delete`.\n\
      \  - **Workload container securityContexts** now drop **all Linux capabilities**.\n\
      \  - Action: if you had workloads/sidecars depending on additional capabilities\
      \ or node-agent deleting pods, confirm your flows still work.\n"
    chart_updates: ['Updated component images/versions: operator bumped to v0.2.162
        (Bottlerocket detection support); storage image bumped to v0.0.298 (chart
        note) and upstream storage includes additional fixes/features in this release
        train.', 'Node-agent behavior update: auto-set `super_t` on Bottlerocket node
        groups; Prometheus OTEL exporter enabled; malware detection changed (ClamAV
        removed, moved to hash sensor).', 'Security hardening in templates: drop all
        Linux capabilities in workload container securityContexts; pin `runAsGroup`
        wherever `runAsUser` is pinned.', "Reliability/compat fixes: mount CA certs\
        \ into sbom-scanner sidecar; mount `config.json` as a file (avoid masking\
        \ policy dir); don\u2019t mask baked policy library when downloads are off.",
      'CRD/template polish: omit empty annotations key on seccompprofiles CRD when
        empty; align SecurityException vulnerability schema with kubevuln types.']
    features: [Configurable `defaultFrameworks` for operator posture scans; operator
        honors the install-time setting for default frameworks., Opt-in RBAC support
        for agent runtime posture (feature gated)., Storage APIServer can be run on
        the host network (opt-in)., Autoupdater supports pod metadata overrides (labels/annotations).,
      'Bottlerocket node groups: node-agent can auto-detect and auto-set `super_t`
        to work correctly on Bottlerocket.', Options added to disable exec tracing
        and open tracing.]
    breaking_changes: ['Node-agent malware detection change: **ClamAV removed** and
        malware detection moved to the **hash sensor**. If you depended on ClamAV-specific
        behavior/artifacts, validate the new detection path.', 'Node-agent RBAC reduced:
        **pods/delete permission removed**. If you had automation relying on node-agent
        deleting pods, it will no longer be allowed by default.', "Node-agent values\
        \ structure change: some \u201Cextra node-agent configuration\u201D moved\
        \ under an `extra` section; existing `values.yaml` may need path updates.",
      'SecurityContext hardening: workloads now **drop all Linux capabilities** by
        default and `runAsGroup` is pinned alongside `runAsUser`; if any container
        required extra capabilities or different group IDs, you must override explicitly.']
