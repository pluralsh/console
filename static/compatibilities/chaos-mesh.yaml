      \ template were wrong and were fixed (#4543). If you had local chart patches/workarounds,\
      \ re-check and drop them if no longer needed.\n"
    chart_updates: ['Helm chart enhancement: support deploying extra Kubernetes objects
        via chart templates (#4649).', 'Chart behavior change: `enableCtrlServer`
        default set to `false` (#4702).', 'Chart fix in v2.8.4: extra objects template
        `include` now uses the correct render function (#4780).', 'Prometheus template:
        corrected wrong helm values references (#4543).']
    features: ["Helm chart can deploy additional, user-supplied Kubernetes manifests\
