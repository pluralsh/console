- version: 2.8.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "- **New:** Helm chart can now deploy **extra Kubernetes objects**\
      \ (e.g., additional ConfigMaps/Secrets/Policies) as part of the release. Review\
      \ the new values for \u201Cextra objects\u201D support introduced in #4649 and\
      \ decide if you want to use it.\n- **Changed default:** `enableCtrlServer` is\
      \ now **`false` by default** in the Helm chart (#4702). If you relied on the\
      \ controller server being enabled (or any features that depend on it), you must\
      \ explicitly set the value back to `true` during/after the upgrade.\n- **Template/values\
      \ fixes:** Prometheus template had wrong helm-value references (#4543). If you\
      \ have custom Prometheus/ServiceMonitor values, re-check that they still render\
      \ as expected after upgrading.\n- **Dashboard service rendering:** Chart now\
      \ supports **label templates** when rendering the `chaos-dashboard` Service\
      \ (#4708). If you customized service labels, re-validate your values against\
      \ the new behavior.\n- **Schema/docs:** Usage around `helm-values-schema-json`\
      \ was updated (#4719). If you validate values via schema in CI, regenerate/refresh\
      \ any pinned schema expectations."
    chart_updates: ['Helm chart: support deploying extra Kubernetes objects (#4649).',
      'Helm chart: `enableCtrlServer` default changed to `false` (#4702).', 'Helm
        chart: fix wrong helm values references in Prometheus template (#4543).',
      'Helm chart: use label templates for chaos-dashboard Service rendering (#4708).',
      'Docs/tooling: update guidance around helm-values-schema-json (#4719).']
    features: ['Helm chart can deploy extra Kubernetes objects as part of the release,
        reducing the need for separate manifests.', 'Workflows add labels to `workflow.spec.templates.task`,
        improving organization/selection in tooling and UIs.']
    breaking_changes: ['`enableCtrlServer` now defaults to `false` in the Helm chart;
        clusters depending on the controller server must explicitly enable it after
        upgrading.', '`chaosctl` was removed; any operational scripts or runbooks
        using chaosctl must be migrated to other supported interfaces (e.g., kubectl/apply
        CRs, Dashboard/API).']
