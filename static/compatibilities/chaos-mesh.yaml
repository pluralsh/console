      \ a namespace that contains numbers only is restricted/blocked; ensure your\
      \ target namespace is valid (alphanumeric with letters).\n- **Chaos Dashboard\
      \ enabled by default**. If you previously disabled it or don\u2019t want it\
      \ exposed, explicitly set the dashboard to disabled and review Service/Ingress\
      \ settings."
