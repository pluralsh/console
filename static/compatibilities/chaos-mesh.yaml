  summary:
    helm_changes: "- **New capability:** Helm chart can now deploy **extra Kubernetes\
      \ objects** (see #4649). If you use this, ensure your values reference the chart\u2019\
      s render helper correctly; **v2.8.4 fixes** an `include`/render-function issue\
