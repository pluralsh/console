- version: 2.7.0
  kube: ['1.28', '1.27', '1.26']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "- **CRDs must be updated as part of the upgrade** (explicitly called\
      \ out in the v2.7.0 notes).\n- **New/changed Helm values (potential action items):**\n\
      \  - `gcp.auth` **value structure changed** to an object that includes `existingSecret`\
      \ (was a different/flat structure previously). Review any existing GCP auth\
      \ configuration and update values accordingly. *(PR #4303)*\n  - **ServiceAccount\
      \ creation can now be conditional** for `chaos-controller-manager` and you can\
      \ add **annotations** on ServiceAccounts for both `chaos-controller-manager`\
      \ and `chaos-daemon`. If you rely on custom SAs/IRSA/workload identity, review\
      \ these toggles/annotations. *(PRs #4390, #4106)*\n  - **chaos-daemon `securityContext`\
      \ is now configurable** via Helm values. If you previously patched manifests,\
      \ move those settings into values. *(PR #4390)*\n  - **Dashboard can be deployed\
      \ under a subpath**; Helm also allows **templating** `dashboard.rootUrl`. If\
      \ you have ingress/path routing, set these to match. *(PRs #4093, #4370)*\n\
      \  - **Dashboard Service:** support `loadBalancerSourceRanges`. If using a `LoadBalancer`\
      \ service, you can now restrict source CIDRs via values. *(PR #4172)*\n  - **Dashboard\
      \ sidecars** supported via Helm values. *(PR #4164)*\n  - **Chaos DNS server:**\
      \ configurable pod affinities via values. *(PR #4260)*\n  - **Chaos Daemon metrics\
      \ scraping can be toggled** (useful if you don\u2019t run Prometheus or want\
      \ to reduce noise). *(PR #4488)*\n  - `values.schema.json` added/generated for\
      \ values validation; use `helm lint`/schema validation in CI to catch invalid\
      \ values early. *(PRs #4205, #4435)*\n- **Behavioral default fix to be aware\
      \ of:** when HA is not enabled, `replicas` is automatically set to `1` (could\
      \ affect anyone who previously set a different replica count without HA). *(PR\
      \ #4079)*"
    chart_updates: ['Helm chart enhancements: conditional ServiceAccount creation,
        SA annotations, chaos-daemon pod securityContext support. (#4390, #4106)',
      'Helm chart: chaos-dashboard subpath support, templated `rootUrl`, sidecar containers,
        and `loadBalancerSourceRanges` for the dashboard Service. (#4093, #4370, #4164,
        #4172)', 'Helm chart: GCP auth values refactor to support `existingSecret`.
        (#4303)', 'Helm chart: configurable chaos-dns-server pod affinities. (#4260)',
      'Helm chart: option to toggle Chaos Daemon metric scraping. (#4488)', 'Chart
        now includes/generated `values.schema.json` for values validation. (#4205,
        #4435)']
    features: [Chaos Dashboard can now be hosted under a subpath (useful for ingress
        path-based routing) and `rootUrl` can be templated via Helm., 'NetworkChaos
        now supports additional rate units and netem/rate support, expanding traffic
        shaping options.', Multi-cluster/remote status watching improvements allow
        syncing remote chaos experiment status to a local cluster., 'You can read
        the dashboard database connection string from a Kubernetes Secret, improving
        credential management.', 'More Helm flexibility: dashboard sidecars, restricted
        LB source ranges, configurable DNS server affinities, and optional Chaos Daemon
        metrics scraping.']
    breaking_changes: ['Helm values change: `gcp.auth` is now an object with an `existingSecret`
        key; existing values files using the old structure will need to be updated.
        (#4303)']
  chart_version: 2.7.0
  images: ['ghcr.io/chaos-mesh/chaos-coredns:v0.2.6', 'ghcr.io/chaos-mesh/chaos-daemon:v2.7.0',
    'ghcr.io/chaos-mesh/chaos-dashboard:v2.7.0', 'ghcr.io/chaos-mesh/chaos-mesh:v2.7.0']
- version: 2.6.0
  kube: ['1.28', '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "- **New default component**: Chaos Mesh now deploys the **Chaos\
      \ DNS Server by default**. If you don\u2019t need DNS fault injection, explicitly\
      \ set:\n  ```yaml\n  dnsServer:\n    create: false\n  ```\n- **Webhook port\
      \ default changed**: Helm chart defaults the webhook port to **10250**. Verify\
      \ this doesn\u2019t conflict with cluster policies/firewalls and that any NetworkPolicies/allowlists/reference\
      \ docs are updated accordingly.\n- **Chaos Daemon capabilities configurable\
      \ via values**: Capabilities for `chaos-daemon` can now be set via Helm values\
      \ (instead of being fixed). Review your current security posture (PodSecurity/PSA,\
      \ OPA/Gatekeeper, SCC) and ensure required capabilities are granted/allowed.\n"
    chart_updates: ['Chaos DNS Server is included and enabled by default (opt-out
        via `dnsServer.create: false`).', Helm chart default webhook port changed
        to 10250., Chart supports setting `chaos-daemon` Linux capabilities via Helm
        values. (Review/align with your security policies.)]
    features: [Offline Helm chart installation support for multi-cluster deployments.,
      Chaos DNS Server now deploys by default to enable DNS-fault simulation out of
        the box (can be disabled via values).]
    breaking_changes: [CoreDNS listen port changed from 53 to 5353; any workloads/tests
        assuming port 53 for the embedded DNS component must be updated., 'Helm default
        webhook port changed to 10250; may require updating firewall rules, NetworkPolicies,
        or documentation if you referenced the old port.', 'Removal of the unused
        `inject-v1-pod` webhook and `crd-v1beta1.yaml`; if you had automation referencing
        these artifacts, update it.']
  chart_version: 2.6.0
  images: ['ghcr.io/chaos-mesh/chaos-coredns:v0.2.6', 'ghcr.io/chaos-mesh/chaos-daemon:v2.6.0',
