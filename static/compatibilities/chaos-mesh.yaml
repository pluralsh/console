- version: 2.3.0
  kube: ['1.22', '1.21', '1.20', '1.19', '1.18', '1.17', '1.16', '1.15']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: '- Helm charts: support latest API version of **dashboard ingress**
      (verify `apiVersion`/schema for your Ingress objects and values) (#3066)

      - Helm charts: add `chaosDaemon.updateStrategy` to configure the `DaemonSetUpdateStrategy`
      for **chaos-daemon** (#3108)

      - Helm charts: **relax** `allowedHostPaths` in the chaos-daemon **PodSecurityPolicy**
      (if you still use PSPs) (#3350)

      - Helm charts: rename `validate-auth` to `chaos-mesh-validation-auth` (#3193)

      - Certificates: add `spec.privateKey.rotationPolicy` to comply with **cert-manager
      1.8** requirements (#3325)

      - Helm charts metadata/packaging changes: Artifact Hub annotations (#3355);
      chart uses `0.0.0` as chart version and appVersion in some context (#3311)

      - Installer/scripts: `install.sh` updated for Kubernetes >= 1.24 (#3177)'
    chart_updates: ['Dashboard/Ingress templates updated to the latest Ingress API
        version (expect template changes around `networking.k8s.io/v1`, `pathType`,
        and backend service fields).', chaos-daemon DaemonSet template now supports
        configurable update strategy via `chaosDaemon.updateStrategy`., PSP template
        for chaos-daemon adjusted to permit more host paths (relevant only on clusters
        where PSP is enabled)., 'Helm component/resource naming updated: validation
        auth component renamed from `validate-auth` to `chaos-mesh-validation-auth`.',
      Certificate manifests/CRs updated to include `spec.privateKey.rotationPolicy`
        for cert-manager compatibility., Chart metadata updated with Artifact Hub
        annotations; some version fields may appear as `0.0.0` depending on packaging
        workflow.]
    features: ['BlockChaos is now implemented in chaos-daemon, enabling block I/O
        fault injection support end-to-end.', 'TimeChaos adds AArch64/arm64 support,
        improving compatibility for ARM-based nodes.']
    breaking_changes: ['If you have existing Helm values or external references to
        the `validate-auth` component, they must be updated to the new name `chaos-mesh-validation-auth`
        (otherwise upgrades may fail or leave orphaned resources).', Ingress manifests/values
        may need adjustment due to the move to the latest Ingress API version (fields
        like backend/service and `pathType` are stricter in `networking.k8s.io/v1`).,
      'On clusters using cert-manager >= 1.8, certificate resources may require/expect
        `spec.privateKey.rotationPolicy`; older custom manifests without it could
        be rejected depending on policy/webhooks.']
  chart_version: 2.3.0
