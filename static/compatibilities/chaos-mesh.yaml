        \ for companion resources.", 'Workflows: labels can now be added to `workflow.spec.templates.task`,
        improving filtering/selection and metadata consistency.']
    breaking_changes: [Helm chart default for `enableCtrlServer` changed to `false`;
        installs/upgrades that previously depended on the controller server being
        enabled must now set it explicitly to preserve behavior., "Operational/tooling\
        \ change: `chaosctl` was removed; if your workflows/scripts used it, you\u2019\
