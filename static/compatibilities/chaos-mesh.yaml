- version: 2.0.0
  kube: ['1.22', '1.21', '1.20', '1.19', '1.18', '1.17', '1.16', '1.15']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: '- **chaos-daemon runs privileged by default (v1.2.0)**: confirm
      your security policy/PSP/OPA allows privileged pods; if not, set the chart value
      that disables privileged mode.

      - **Registry configuration added (v1.2.0)**: if you use a private registry/mirror,
      populate the new registry-related values.

      - **Dashboard enabled by default (v1.2.0)**: decide whether you want the dashboard
      exposed; if not, explicitly disable it in values.

