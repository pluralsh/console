      env vars via values, re-check names after upgrade because a rename/fix may break
      overrides.

      - **Helm upgrade behavior fix (v2.0.0)**: previous versions could recreate the
      Chaos Dashboard on `helm upgrade`; after upgrading, confirm your dashboard Service/Ingress/credentials
      remain as expected, but expect behavior to be corrected going forward.'
    chart_updates: ['v1.2.0 chart defaults changed: chaos-daemon privileged by default;
