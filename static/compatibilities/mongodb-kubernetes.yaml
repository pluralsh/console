- version: 1.2.0
  kube: ['1.31', '1.30', '1.29']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ["MongoDBSearch (Community Private Preview): Operator can deploy MongoDB\
        \ Search for MongoDBCommunity, including a new CRD watched by default. Requires\
        \ MongoDB Community >= 8.0 and TLS disabled for mongot\u2194mongod communication\
        \ (private preview limitation).", 'OpenID Connect (OIDC) authentication: Configure
        via spec.security.authentication.modes=OIDC and spec.security.authentication.oidcProviderConfigs;
        requires MongoDB Enterprise Server and MongoDB >= 7.0.11 or 8.0.0.', 'New
        ClusterMongoDBRole CRD: Define reusable, cluster-scoped role templates and
        reference them from MongoDB/MongoDBMultiCluster via spec.security.roleRefs
        (mutually exclusive with spec.security.roles). Adds new watched resource by
        default and requires additional RBAC (ClusterRole/ClusterRoleBinding).']
    breaking_changes: ['RBAC requirements change when upgrading to 1.2.0: because
        the operator now watches ClusterMongoDBRole by default, installations not
        using the Helm chart or kubectl plugin must add a new ClusterRole and ClusterRoleBinding
        or the operator may fail/lose permissions.']
