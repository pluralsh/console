  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup into a micro-service architecture, enabling better
        concurrency control, cancel/resume, and improved resiliency across node-agent
        restarts.', fs-backup now supports Windows clusters/workloads by running data
        mover pods on Windows nodes., 'Beta support for Kubernetes VolumeGroupSnapshots
        for CSI snapshot backup and CSI snapshot data movement, enabling crash-consistent
        point-in-time snapshots across multiple volumes.', 'PriorityClass support
        across Velero components (server, node-agent, data movers, repo maintenance
        jobs) to control scheduling importance.', 'Scalability/resiliency improvements
        for data movers, including PrepareQueueLength to throttle pending pod creation
        and better handling of node-agent restarts/cancelation.', Resource policies
        gain includeExcludePolicy so include/exclude filters can be reused across
        backups via a ConfigMap., 'Operational improvements: BSL availability metric,
        BSL status checks for backup/restore, imagePullSecrets inheritance for data
        mover/maintenance jobs, parameterized kubelet mount path, optional hostPath
        mount disablement, and improved PVC restore selected-node handling. ']
    breaking_changes: [Restic is removed as a valid uploader type in v1.17; you can
        no longer install/configure Velero with --uploader-type=restic (restores from
        existing Restic backups remain supported until v1.19)., Repository maintenance
        job configuration flags were removed from the Velero server CLI (keep/latest
        and CPU/memory request/limit flags); these settings now live in a repository
        maintenance job ConfigMap., 'Behavior change: during PVC restore, Velero now
        always removes the selected-node annotation when no node mapping exists (previously
        it could be preserved if the node existed).']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can run in hybrid Linux/Windows clusters,
        schedule node-agent/data mover/maintenance jobs appropriately, and back up/restore
        Windows workloads (with stated limitations).', 'Parallel Item Block backup:
        item blocks (and associated hooks) can now be processed concurrently; configurable
        via `--item-block-worker-count` (default 1).', 'Data mover restore scalability:
        new node-agent config `ignoreDelayBinding` allows spreading restores across
        nodes for WaitForFirstConsumer volumes to improve parallelism and balance.',
      'Improved observability for data mover: logs now include intermediate object
        statuses on failures and errors during cleanup deletion.', 'CSI snapshot usability
        improvement: retained `VolumeSnapshotContent` is no longer included in backups,
        reducing unnecessary CSI objects synced/restored.', 'Backup repository maintenance
        resiliency/observability: `RecentMaintenance` history added to BackupRepository;
        maintenance jobs recaptured after server restart; maintenance/init avoided
        for read-only BSLs; configurable Kopia full maintenance interval (normal/fast/eager
        GC).', 'Volume Policy enhancement: can filter volumes by PVC labels.', 'Per-object
        resource status restore: opt in/out per object via `velero.io/restore-status`
        annotation.', 'Velero restore helper merged into Velero image: `velero`, `velero-helper`,
        and `velero-restore-helper` now ship in one image, simplifying image management.']
    breaking_changes: ['No explicit breaking changes were called out in the provided
        v1.16.0 notes; validate Windows limitations and new parallelism behavior in
        staging, and review any custom tooling that referenced a separate restore-helper
        image/binary.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI snapshot data movement now runs in dedicated
        per-backup/per-restore pods instead of node-agent, improving security (no
        hostPath), isolation, resilience, and allowing granular CPU/memory control.',
      'Introduces Item Block concepts and the ItemBlockAction (IBA) plugin framework
        to categorize correlated resources (e.g., Pods/PVCs) for future multi-threaded
        backups; v1.15 supports the model/plugins but still processes single-threaded.',
      Adds node selection for repository maintenance jobs via a new repository-maintenance
        configMap so maintenance can be scheduled onto specific/idle nodes., 'Adds
        backupPVC configuration via a new configMap, including read-only mounting
        for faster exposure (storage-dependent, e.g., Ceph) and ability to choose
        a different storageClass for backupPVCs.', Adds backup repository cache size
        limiting via a new backup-repository configMap to avoid pod eviction due to
        ephemeral storage pressure., 'Performance/stability fixes: resolves a server
        memory leak after plugin calls; passes client QPS/burst settings to plugins
        automatically; includes upstream Kopia improvements to reduce memory use during
        maintenance with many files.']
    breaking_changes: ['Restic-based filesystem backup/restore is now deprecated:
        existing restic uploads still work in 1.15 but emit warnings when installing
        with --uploader-type=restic or using the restic path for fs-backup; plan migration
        away from restic.', Node-agent configMap name is no longer implicitly fixed;
        if you customize it you must set the node-agent server parameter node-agent-configmap
        accordingly., Repository maintenance job resource/retention settings are moving
        from Velero server flags to a repository-maintenance configMap; flags remain
        for backward compatibility but configMap values take precedence when both
        are set., "\u201CChanging PVC selected-node\u201D feature is deprecated in\
        \ 1.15 and is not recommended; expect removal in a future release."]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Kopia/restic repository maintenance now runs in a separate Kubernetes
        Job to prevent Velero server OOMs; resource requests for the maintenance job
        can be specified during install/upgrade., "VolumePolicies are expanded beyond\
        \ \u201Cskip\u201D to support per-volume backup actions (`fs-backup` or `snapshot`),\
        \ enabling finer-grained control without changing workloads.", Data mover
        pods (used for data movement backups/restores) can be constrained to specific
        nodes via a ConfigMap-based node selection mechanism., 'Restore operations
        now persist VolumeInfo metadata for restored volumes, and `velero restore
        describe` surfaces this information.', 'A new Restore phase, `Finalizing`,
        was added to ensure PV label patching and post-restore hooks happen after
        volume data movement/snapshot restore completes.', 'Azure authentication adds
        support for service principals using certificate-based auth (in addition to
        secret-based), improving security posture.']
    breaking_changes: ['CSI plugin code is now merged into the main Velero repo and
        installed by default as an internal plugin; do not install the CSI plugin
        separately via `--plugins` (or equivalent Helm/plugin configuration), and
        remove any explicit CSI plugin installation you currently have.', 'Default
        resource requests/limits for the node-agent are removed, making node-agent
        pods `BestEffort` QoS unless you explicitly set resources; this can change
        scheduling and stability under node pressure.', 'Namespace filtering behavior
        changes: if `includedNamespaces`/`excludedNamespaces` are unset but `labelSelector`/`orLabelSelectors`
        are set on a Backup, Velero now only includes namespaces that contain matching
        resources (previously all namespaces were included). This may unexpectedly
        exclude namespaces from backups.', 'Restores may now end in `PartiallyFailed`
        where they previously showed `Complete` if PV patching in the new `Finalizing`
        phase is blocked (e.g., PV stuck Pending).']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
