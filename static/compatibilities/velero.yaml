    features: ['Modernized fs-backup to a micro-service architecture, improving robustness
        (survives node-agent restarts), adding concurrency control, cancel/resume,
        and stabilizing node-agent resource usage.', 'fs-backup now supports Windows
        clusters by running data mover pods on Windows nodes, enabling full Windows
        workload backup/restore scenarios.', 'Adds (beta) support for Kubernetes VolumeGroupSnapshot
        for CSI snapshot backup and CSI snapshot data movement to achieve point-in-time,
        write-order-consistent snapshots across multiple volumes.', 'Adds PriorityClass
        support across Velero components (server, node-agent, data mover pods, and
        repository maintenance jobs) for better scheduling control.', 'Improves data
        mover scalability/resiliency: introduces node-agent PrepareQueueLength to
        throttle data mover pod creation, better restart/orphan handling, and enhanced
        node-selection (including per-storage-class) for CSI snapshot data movement
        restores.', Resource policies gain reusable include/exclude filters via includeExcludePolicy
        in addition to existing volumePolicy.]
    breaking_changes: [Restic uploader path is removed for new backups; `--uploader-type=restic`
        is no longer a valid install option (restores from existing restic-path backups
        remain supported until v1.19)., Repository maintenance job configuration flags
        were removed from the Velero server command line; these settings must now
        come from the repository maintenance job ConfigMap.]
