  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, enabling concurrency
        control, cancel/resume across restarts, and more stable node-agent resource
        usage.', fs-backup now supports Windows workloads by running data mover pods
        on Windows nodes (complementing prior CSI snapshot data movement for Windows).,
      'Added beta support for Kubernetes VolumeGroupSnapshots for point-in-time, write-order-consistent
        snapshots across multiple volumes.', 'PriorityClass can now be configured
        for server, node-agent, data mover pods, and backup repository maintenance
        jobs independently.', 'Improved scalability/resiliency of data movers: queueing
        via node-agent PrepareQueueLength, better restart/orphan handling, and enhanced
        node-selection (including per-storage-class) for CSI snapshot data movement
        restores.', Resource policies now support reusable include/exclude filters
        via includeExcludePolicy in addition to volumePolicy.]
    breaking_changes: ['Restic uploader path removed: --uploader-type=restic is no
        longer valid for installation/backup creation (restores from existing restic
        backups supported only until v1.19).', Repository maintenance job settings
        were removed from velero server flags and must be configured via the repository
        maintenance job ConfigMap instead., 'PVC restore behavior change: selected-node
        annotation is now always removed when no node mapping exists (previously preserved
        if the node existed).', 'The request is for an upgrade from 1.17.0 to 1.17.0
        (no version change); if you truly are staying on the same version, there is
        nothing to upgrade aside from redeploying with the same image/chart.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support (hybrid Linux/Windows deployments), including
        node-agent/data mover/maintenance jobs and full data mover backup+restore
        lifecycle for Windows workloads.', 'Parallel ItemBlock backups: backup engine
        can process grouped resource blocks concurrently; configurable via `--item-block-worker-count`
        (default 1).', 'Data mover restore scalability improvement for `WaitForFirstConsumer`
        volumes: new node-agent flag `ignoreDelayBinding` allows restores to spread
        across nodes instead of being pinned to the attach node.', 'Improved observability
        for data mover backup/restore and cleanup: more intermediate-object status/error
        logging in node-agent logs (enabled by default).', 'CSI snapshot usability:
        unnecessary retained `VolumeSnapshotContent` objects are no longer included
        in backups/restores, reducing clutter and cross-cluster sync noise.', 'BackupRepository
        maintenance improvements: `RecentMaintenance` history in BackupRepository
        CR, maintenance job recapture after server restarts, skip init/maintenance
        for readOnly BSLs, and configurable kopia full-maintenance intervals (`normalGC`/`fastGC`/`eagerGC`)
        via `fullMaintenanceInterval`.', Volume Policy can now filter volumes by PVC
        labels., Per-object control of resource status restore via `velero.io/restore-status`
        annotation., 'Velero images consolidated: `velero`, `velero-helper`, and `velero-restore-helper`
        binaries are all included in the main Velero image.']
    breaking_changes: []
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI Snapshot Data Movement transfer work
        moves from node-agent to dedicated per-backup/restore pods, improving security
        (no hostPath), isolation, and resource control.', Item Block + ItemBlockAction
        plugin type introduced to group correlated resources (built-in for Pods/PVCs)
        to enable future concurrent backup processing; v1.15 lays groundwork but still
        single-threaded., 'Repository maintenance jobs can be scheduled onto selected
        nodes via a new configMap, letting you steer heavy maintenance away from critical
        nodes.', 'BackupPVC configuration (via new configMap) can mount backupPVCs
        read-only to speed expose operations on some storage backends (e.g., Ceph),
        with SELinux caveats.', 'BackupPVC storage class is now configurable (same
        configMap), allowing different replication/performance characteristics for
        backupPVCs than workload PVCs.', Backup repository cache size limit per repository
        is configurable via a new configMap to avoid pod eviction due to ephemeral
        storage pressure., 'Performance improvements: fixes plugin-call memory leak,
        passes client QPS/burst settings to plugins, and includes Kopia upstream improvements
        for high-file-count repository maintenance memory usage.']
    breaking_changes: [Restic uploader path for filesystem backups is now deprecated
        (warnings emitted when using --uploader-type=restic or Restic-based fs backups/restores);
        plan migration to Kopia., node-agent configMap name is no longer fixed; if
        you customize it you must set the node-agent server arg node-agent-configmap
        accordingly., Repository maintenance job settings are moving from Velero server
        flags into the new repository-maintenance configMap; configMap values take
        precedence when both are set (legacy flags still accepted)., The 'Changing
        PVC selected-node' feature is deprecated and should no longer be relied upon;
        it will be removed in a future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: [Velero CSI plugin is now built-in (internal plugin) and installed
        by default; do not install the separate CSI plugin via `--plugins`/chart extra
        plugins anymore., Repository maintenance for kopia/restic backup repositories
        is moved out of the Velero server pod into separate Kubernetes Jobs; resources
        for those jobs can be configured., Default resource requests/limits for the
        node-agent are removed so node-agent pods run as BestEffort QoS unless you
        set your own requests/limits.]
    features: [Kopia/restic repository maintenance now runs as Kubernetes Jobs to
        avoid Velero server pod OOMs; you can set job resource requests/limits., 'VolumePolicies
        now support actions beyond skip: you can force per-volume `fs-backup` vs `snapshot`
        to get fine-grained control without modifying workloads.', Data mover pods
        can be scheduled onto a subset of nodes via a ConfigMap-based node selection
        mechanism., 'Restore VolumeInfo metadata is now persisted and shown in `velero
        restore describe`, improving visibility into how volumes were restored.',
      Restores add a new `Finalizing` phase so PV patching/label restore and post-restore
        hooks happen after data movement completes., 'Azure authentication adds support
        for service principal certificate-based auth (phishing-resistant), alongside
        secret-based auth.']
    breaking_changes: [CSI plugin is merged into the core Velero repo in v1.14 and
        is installed by default; remove any explicit CSI plugin installation to avoid
        duplicates/conflicts., Node-agent default CPU/memory requests/limits are removed;
        clusters that relied on guaranteed/burstable QoS must set explicit resources
        to prevent eviction/throttling issues., 'Backup namespace filtering behavior
        changed: if `includedNamespaces`/`excludedNamespaces` are unset but a label
        selector is used, only namespaces containing matched resources are backed
        up (previously all namespaces were included).', 'Restore workflow change:
        PV patching in the new `Finalizing` state can cause restores to end `PartiallyFailed`
        when PVs are stuck Pending; previously they might have reported `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['CSI Snapshot Data Movement: can move CSI snapshot contents out of
        the source cluster/storage into durable backup storage and restore later (including
        cross-environment/cloud scenarios).', 'Resource Modifiers (JSON Substitutions):
        define match filters and JSON patch operations to mutate resources during
        restore without writing a custom RestoreItemAction plugin.', 'Multiple VolumeSnapshotClasses
        support in the Velero CSI plugin: allows choosing a specific VolumeSnapshotClass
        per backup instead of relying on a single labeled class.', 'Restore finalizer
        cleanup: `velero restore delete` now also cleans up restore-associated data
        in the backup storage location.', 'Runtime/deps refresh: Golang bumped to
        1.20.7 and Kopia bumped to 0.13.x along with other dependency updates.']
    breaking_changes: ['Default `uploader-type` changes from `restic` to `kopia`,
        which can change filesystem-backup behavior and repository expectations if
        you relied on restic defaults.', 'CSI snapshot timing/timeout behavior changed:
        snapshot handle creation uses `backup.spec.csiSnapshotTimeout` (was a fixed
        10m) and ReadyToUse waiting uses operation timeouts (default 4h).', Helm chart
        v4.0.0+ supports multiple BackupStorageLocations (BSL) and VolumeSnapshotLocations
        (VSL) and changes their values schema from map to slice; this is not backward
        compatible and should be migrated before upgrading., Finalizers added to Velero
        CRs (restore/dataupload/datadownload) can cause `kubectl delete namespace
        velero` to hang; use `velero uninstall` or remove/handle finalizers before
        namespace deletion.]
  chart_version: 5.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.12.3']
