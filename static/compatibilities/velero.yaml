  summary:
    helm_changes: ''
    chart_updates: []
    features: [Windows cluster support (run Velero components on Windows nodes; backup/restore
        Windows workloads with data mover)., Parallel ItemBlock backup via a new server
        flag `--item-block-worker-count` to increase backup throughput (default 1).,
      Data mover restore can be distributed across nodes for WaitForFirstConsumer
        volumes using node-agent config flag `ignoreDelayBinding`., Improved observability
        for data mover backup/restore with more intermediate-status and cleanup error
        logging in node-agent logs., 'CSI snapshot usability: no longer retains/restores
        unnecessary VolumeSnapshotContent objects in backups.', 'Backup repository
        maintenance improvements: maintenance history in BackupRepository status (`RecentMaintenance`),
        job recapture after server restart, skip maintenance/init for readOnly BSLs,
        and configurable `fullMaintenanceInterval` modes (normalGC/fastGC/eagerGC).',
      'VolumePolicy enhancement: filter volumes by PVC labels (and additional CSI
        volumeAttributes properties).', Per-object resource status restore control
        via `velero.io/restore-status` annotation., Velero restore helper binaries
        are now bundled into the main Velero image (single image contains velero/velero-helper/velero-restore-helper).]
    breaking_changes: ['No explicit breaking changes called out in the v1.16.0 notes
        provided; however, new parallelism and Windows scheduling behavior may change
        performance/resource usage and should be validated in staging.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
