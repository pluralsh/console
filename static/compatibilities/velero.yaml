- version: 1.17.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['fs-backup reworked to a micro-service architecture, adding concurrency
        control plus cancel/resume and making backups/restores more robust across
        node-agent restarts with steadier resource usage.', 'fs-backup now supports
        Windows clusters by running data mover pods on Windows nodes; combined with
        1.16 CSI snapshot data movement, this completes Windows workload backup/restore
        scenarios.', 'Beta support for Kubernetes VolumeGroupSnapshot for both CSI
        snapshot backups and CSI snapshot data movement to provide crash-consistent,
        write-order-consistent point-in-time snapshots across multiple volumes.',
      'PriorityClass support across Velero components (server, node-agent, data movers,
        maintenance jobs) so you can control scheduling/eviction priority per module.',
      'Data mover scalability/resiliency improvements: a node-agent PrepareQueueLength
        to throttle creation of data mover pods, improved restart/orphan handling,
        and restore-side node selection including per-storage-class node selection.',
      'Resource policy enhancements: new reusable includeExcludePolicy filters in
        the resource policy ConfigMap in addition to volumePolicy.']
    breaking_changes: ['Restic uploader path removed: `--uploader-type=restic` is
        no longer valid for new backups; restores from existing restic-path backups
        remain supported until v1.19.', 'Repository maintenance job configuration
        flags removed from the Velero server (`--keep-latest-maintenance-jobs`, maintenance
        job CPU/mem request/limit flags); configuration moves to a maintenance job
        ConfigMap (CLI fallback exists for keepLatestMaintenanceJobs).', 'PVC restore
        behavior change: Velero now always removes the `selected-node` annotation
        during PVC restore when no node mapping exists; previously it could be preserved
        if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can now run in Windows/hybrid clusters
        (all-in-one multi-arch image) and back up/restore Windows workloads with node-agent,
        data mover pods, and maintenance jobs schedulable on Windows nodes (fs-backup
        still Linux-only).', 'Parallel Item Block backup: ItemBlocks can now be processed
        concurrently using a server-side worker pool; hooks within ItemBlocks also
        run in parallel. Configure with `--item-block-worker-count` (default 1).',
      "Data mover restore scalability for WaitForFirstConsumer volumes: add `ignoreDelayBinding`\
        \ in node-agent config to spread restores across nodes instead of being constrained\
        \ to the volume\u2019s attached node.", 'Improved data mover observability:
        logs now include intermediate object statuses on failures and errors during
        cleanup of intermediate objects, enabled by default in node-agent logs.',
      'CSI snapshot usability improvement: stop retaining/restoring unnecessary VolumeSnapshotContent
        objects, reducing cross-cluster sync noise and restore clutter.', 'Backup
        repository maintenance improvements: adds `RecentMaintenance` history in BackupRepository
        status; recaptures running maintenance jobs after server restart; skips maintenance
        and repo init for readOnly BSLs; configurable `fullMaintenanceInterval` (normal/fast/eager
        GC).', 'Volume Policy enhancement: filter volumes by PVC labels (and additional
        CSI volume attribute filtering was added).', 'Per-object resource status restore
        control: annotate individual objects with `velero.io/restore-status` to opt
        in/out of status restore.', 'Velero restore helper binaries merged into the
        main Velero image (single image now contains velero, velero-helper, velero-restore-helper).']
    breaking_changes: ['Potential behavioral change: backup hooks may now execute
        in parallel with ItemBlock processing when `--item-block-worker-count` > 1,
        which can expose ordering/race assumptions in workloads or hook scripts.',
      'New node scheduling behavior in mixed OS clusters: node-agent/data mover/maintenance
        jobs can schedule onto Windows nodes; clusters with strict nodeSelectors/tolerations/PSA
        policies may need adjustments to avoid unexpected placement or failures.',
      'Repository maintenance behavior changes for readOnly BackupStorageLocations:
        maintenance and repo initialization are now skipped; if you previously relied
        on maintenance attempting to run against readOnly locations, that will no
        longer occur.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI Snapshot Data Movement now runs in dedicated
        backup/restore pods instead of node-agent hostPath access, improving security,
        resource control, and resilience.', Item Block concepts and new ItemBlockAction
        (IBA) plugin type to group related resources (built-ins for Pods/PVCs) in
        preparation for future multi-threaded backups., Repository maintenance job
        node selection via a new configMap so maintenance can be scheduled onto specific/idle
        nodes., 'Backup PVC configuration via configMap: support read-only mounting
        for faster expose on some storages (e.g., Ceph) and selecting a separate StorageClass
        for backupPVCs.', Backup repository cache sizing via configMap (cacheLimit)
        to avoid running out of ephemeral storage during repo operations., 'Performance
        improvements: fix memory leak after plugin calls; propagate client-qps/burst
        settings to plugins; incorporate upstream Kopia improvements to reduce high-memory
        maintenance scenarios.']
    breaking_changes: ['Restic is deprecated for fs-backup starting in 1.15: operations
        still succeed but emit warnings when restic uploader type is used or restic
        path is used for fs-backup.', Node-agent configMap name is no longer fixed;
        if you customize it you must set the server parameter `--node-agent-configmap`
        to match., Repository maintenance job settings are moving from Velero server
        flags to a repository maintenance job configuration configMap; configMap values
        take precedence over flags (flags remain for backward compatibility)., The
        'Changing PVC selected-node' feature is deprecated and should not be relied
        on; it will be removed in a future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Repository maintenance for kopia/restic filesystem backup repositories
        now runs as a separate Kubernetes Job to prevent Velero server pod OOM; resources
        can be set for that job., 'VolumePolicies now support explicit per-volume
        actions (e.g., `fs-backup` vs `snapshot`) enabling opt-in/out and finer control
        without changing workloads.', Data mover pods can be constrained to eligible
        nodes via a ConfigMap for better resource placement and isolation., Restore
        operations now persist VolumeInfo metadata for restored volumes and `velero
        restore describe` surfaces more volume-handling details., Restores add a new
        `Finalizing` phase to ensure PV label patching and post-restore hooks occur
        after volume data movement completes., 'Azure authentication gains support
        for service principals using certificate-based auth (in addition to secret-based),
        enabling stronger conditional access policies.']
    breaking_changes: [CSI plugin is merged into the main Velero repo and is installed
        by default as an internal plugin; do not install it separately via `--plugins`/external
        CSI plugin mechanisms., 'Default resource requests/limits for the node-agent
        are removed, making node-agent pods BestEffort unless you set resources explicitly;
        this can impact scheduling/QoS and cluster resource governance.', 'Namespace
        filtering behavior changes: if `includedNamespaces`/`excludedNamespaces` are
        unset but label selectors are set, only namespaces containing matching resources
        are included (previously all namespaces were included).', 'During restore
        `Finalizing`, PV patching can cause restores to end `PartiallyFailed` if a
        PV is blocked in `Pending`, where older versions might have ended `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['CSI Snapshot Data Movement: can move CSI snapshot contents out of
        the source cluster/storage into durable backup storage and restore later (including
        cross-environment/cloud scenarios).', 'Resource Modifiers (JSON Substitutions):
        define match filters and JSON patch operations to mutate resources during
        restore without writing a custom RestoreItemAction plugin.', 'Multiple VolumeSnapshotClasses
        support in the Velero CSI plugin: allows choosing a specific VolumeSnapshotClass
        per backup instead of relying on a single labeled class.', 'Restore finalizer
        cleanup: `velero restore delete` now also cleans up restore-associated data
        in the backup storage location.', 'Runtime/deps refresh: Golang bumped to
        1.20.7 and Kopia bumped to 0.13.x along with other dependency updates.']
    breaking_changes: ['Default `uploader-type` changes from `restic` to `kopia`,
        which can change filesystem-backup behavior and repository expectations if
        you relied on restic defaults.', 'CSI snapshot timing/timeout behavior changed:
        snapshot handle creation uses `backup.spec.csiSnapshotTimeout` (was a fixed
        10m) and ReadyToUse waiting uses operation timeouts (default 4h).', Helm chart
        v4.0.0+ supports multiple BackupStorageLocations (BSL) and VolumeSnapshotLocations
        (VSL) and changes their values schema from map to slice; this is not backward
        compatible and should be migrated before upgrading., Finalizers added to Velero
        CRs (restore/dataupload/datadownload) can cause `kubectl delete namespace
        velero` to hang; use `velero uninstall` or remove/handle finalizers before
        namespace deletion.]
  chart_version: 5.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.12.3']
