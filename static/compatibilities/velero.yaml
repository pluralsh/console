  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized file-system backup (fs-backup) to a micro-service architecture,
        adding concurrency control, cancel/resume on restart, better isolation, and
        steadier node-agent resource usage.', 'fs-backup now supports Windows workloads
        by running data mover pods on Windows nodes; together with prior CSI snapshot
        data movement work, this enables broader Windows backup/restore scenarios.',
      'Beta support for Kubernetes VolumeGroupSnapshot for CSI snapshot backups and
        CSI snapshot data movement, enabling point-in-time consistent snapshots across
        multiple volumes.', 'PriorityClass can now be set independently for Velero
        server, node-agent, data mover pods, and backup repository maintenance jobs.',
      'Improved scalability/resiliency for data movers: a node-agent PrepareQueueLength
        to avoid creating excessive pending pods; data movements can survive node-agent
        restarts with better orphan cancellation; restore now supports node-selection
        (including per storage class) similar to backup.', Resource policies gain
        reusable include/exclude filters via includeExcludePolicy in addition to volumePolicy.,
      'Operational improvements: BSL availability metric and BSL status checks for
        backup/restore; imagePullSecrets inheritance for data mover/maintenance; parameterized
        kubelet mount path; optional ResticIdentifier for kopia repos; additional
        arch support (s390x).']
    breaking_changes: ['Restic uploader path is removed: --uploader-type=restic is
        no longer a valid install configuration; you can still restore from existing
        Restic backups only until v1.19.', 'Repository maintenance job settings were
        removed from Velero server CLI flags and moved to a ConfigMap (flags removed:
        --keep-latest-maintenance-jobs, --maintenance-job-*-request/limit).', 'PVC
        restore behavior change: selected-node annotation is now always removed when
        there is no node mapping; previously it could be preserved if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support (hybrid build/all-in-one image, node-agent/data
        mover/maintenance jobs on Windows + Linux nodes, built-in data mover supports
        Windows workloads end-to-end).', Parallel ItemBlock backup with configurable
        `--item-block-worker-count` to improve throughput; hooks run within item blocks
        and thus in parallel., Data mover restore scalability improvement for WaitForFirstConsumer
        volumes via node-agent config `ignoreDelayBinding` to spread restores across
        nodes., 'Improved data mover observability: more intermediate status/error
        logging, including cleanup failures, enabled by default.', 'CSI snapshot usability
        improvement: no longer retains unnecessary VolumeSnapshotContent objects in
        backups (reduces sync/restore noise).', 'Backup repository maintenance resiliency/observability:
        RecentMaintenance history in BackupRepository CR, recapture running jobs after
        restart, skip maintenance/init for read-only BSL, configurable `fullMaintenanceInterval`
        (normal/fast/eager GC).', Volume Policy can now filter volumes by PVC labels.,
      Per-object resource status restore control via `velero.io/restore-status` annotation.,
      'Velero image now bundles `velero`, `velero-helper`, and `velero-restore-helper`
        binaries into one image.']
    breaking_changes: ['Restic/fs-backup limitations on Windows: fs-backup not supported
        for Windows workloads; fs-backup runs only on Linux nodes for Linux workloads
        in hybrid clusters.', 'Windows support limitations: no backup/restore of Security
        Descriptors or NTFS extended attributes; workloads requiring non-admin privileges
        may not restore correctly.', 'Potential performance/behavior change: backups
        may run much more concurrently due to parallel ItemBlocks; may require tuning
        CPU/memory and API QPS/burst and setting `--item-block-worker-count` deliberately.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI snapshot data movement shifts from long-running
        node-agent pods to dedicated backup/restore pods, improving security (no hostPath),
        resource control, and resilience.', Item Block concepts and new ItemBlockAction
        (IBA) plugin type to categorize correlated resources for future concurrent/multi-threaded
        backups (v1.15 supports categorization but still processes single-threaded).,
      Node selection support for repository maintenance jobs via a new repository
        maintenance configuration ConfigMap., 'BackupPVC configuration via a new ConfigMap:
        support read-only mounting (can speed expose on some storage like Ceph), and
        choosing a storage class for backupPVCs.', Backup repository cache size configuration
        via a new backup repository configuration ConfigMap to avoid ephemeral-storage
        eviction during repo operations., 'Performance fixes and improvements: server
        memory leak after plugin calls fixed; client QPS/burst args passed through
        to plugins; Kopia maintenance memory improvements included.']
    breaking_changes: ['Restic filesystem backup path is deprecated starting in v1.15:
        backups/restores still succeed but emit warnings when using --uploader-type=restic
        or restic-based fs-backup paths; plan migration off Restic.', Node-agent configuration
        ConfigMap name is no longer fixed; if you customize it you must set the node-agent
        server parameter --node-agent-configmap accordingly., Repository maintenance
        job settings are moving from Velero server CLI flags to the new repository
        maintenance ConfigMap; flags remain for backward compatibility but ConfigMap
        values take precedence., Changing PVC selected-node feature is deprecated
        in v1.15 and should not be relied on going forward.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Moves kopia/restic repository maintenance out of the Velero server
        pod into a separate Kubernetes Job to avoid server OOMs; you can now size
        requests/limits for that job independently., 'Extends VolumePolicy to support
        additional actions (e.g., `fs-backup` or `snapshot`) so volume handling can
        be controlled via policy instead of changing workloads.', Adds node selection
        for data-movement (datamover) pods via a ConfigMap to constrain where high-resource
        datamover workloads can run., Persists VolumeInfo metadata on restores (not
        just backups) and improves `velero restore describe` output accordingly.,
      'Introduces a new Restore phase, `Finalizing`, to ensure PV labeling and post-restore
        hooks occur after volume data movement/snapshot restore completes.', 'Adds
        Azure service principal certificate-based authentication support for more
        secure, phishing-resistant auth.']
    breaking_changes: [CSI plugin is now merged into the main Velero repo and installed
        by default as an internal plugin; you must stop installing it via `--plugins`
        during install/upgrade., Default resource requests/limits for the node-agent
        are removed so node-agent pods become QoS BestEffort; you may need to set
        explicit resources if you relied on previous defaults., 'Backup namespace
        filtering behavior changes when `includedNamespaces`/`excludedNamespaces`
        are omitted but `labelSelector`/`orLabelSelectors` are set: only namespaces
        containing matching resources are included (previously all namespaces were).',
      'Restore behavior change: PV patching during the new `Finalizing` phase can
        cause restores to end `PartiallyFailed` if the PV is stuck `Pending`, whereas
        earlier versions might still report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
