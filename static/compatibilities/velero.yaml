  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm / values changes to consider (1.14 \0\x1A\01.15)\n\n> Note:\
      \ you provided application release notes, not the Helm chart changelog. The\
      \ items below map the app-level changes into likely Helm values / manifests\
      \ you may need to adjust when upgrading.\n\n- **Node-agent configMap name is\
      \ now configurable**\n  - If you use a node-agent configMap, Velero 1.15 requires\
      \ the server arg **`--node-agent-configmap`** to match the configMap name (previously\
      \ a fixed name was assumed).\n  - Action: ensure the Helm chart is setting the\
      \ server arg and creating/using the intended configMap.\n\n- **Repository maintenance\
      \ job configuration moved to a configMap (preferred)**\n  - These server flags\
      \ can now be set via the *repository maintenance job configuration* configMap\
      \ and the configMap takes precedence if both are set:\n    - `--keep-latest-maintenance-jobs`\n\
      \    - `--maintenance-job-cpu-request`\n    - `--maintenance-job-mem-request`\n\
      \    - `--maintenance-job-cpu-limit`\n    - `--maintenance-job-mem-limit`\n\
      \  - Action: migrate your Helm values from flags/env into the new configMap\
      \ (or keep flags but know configMap overrides).\n\n- **New configMaps introduced\
      \ in 1.15 that you may need to template via Helm**\n  - *Repository maintenance\
      \ configuration configMap* (adds node selection/placement for maintenance jobs).\n\
      \  - *Backup PVC configuration configMap* (controls read-only mounting, storageClass\
      \ for backupPVCs, and related options like no-relabeling).\n  - *Backup repository\
      \ configuration configMap* (controls per-repository cache sizing, e.g., `cacheLimit`,\
      \ to avoid ephemeral-storage eviction).\n  - Action: decide whether to enable\
      \ these features and wire them into your Helm release (create configMaps + pass\
      \ references/args as required by your chart).\n\n- **Data mover micro service\
      \ introduces new pods (backupPod/restorePod)**\n  - Action: ensure your Helm\
      \ values cover **resources**, **node selectors/tolerations/affinity**, **PSA/SCC**,\
      \ and **network policies** for these new pod types (they replace some node-agent\
      \ responsibilities for CSI snapshot data movement).\n\n- **Restic deprecation\
      \ warnings in 1.15**\n  - `--uploader-type=restic` and restic-based fs-backups\
      \ will still work but emit warnings.\n  - Action: if your Helm values explicitly\
      \ set restic uploader, plan migration to kopia/uploader defaults and update\
      \ runbooks.\n\n- **SELinux caveat with read-only backupPVCs**\n  - Read-only\
      \ mounts can fail on SELinux-enforced nodes unless an option is enabled that\
      \ runs the backupPod container as highly privileged and disables SELinux access\
      \ control.\n  - Action: if you enable read-only backupPVC, validate your cluster\
      \ security policy (PSA/SCC) allows the required privilege, or leave feature\
      \ off."
    chart_updates: ['Velero 1.15 introduces additional controller behavior and new
        configMap-driven configuration surfaces (maintenance job placement, backup
        PVC behavior, repository cache limits). Ensure the chart version you choose
        templates these configMaps and mounts/passes them into the velero deployment.',
      'Data movement for CSI snapshot data movement shifts from node-agent pods to
        dedicated backup/restore pods (data mover micro service). Expect additional
        pod workloads, RBAC needs, and scheduling/security considerations.', Repository
        maintenance jobs can now be scheduled onto selected nodes via configMap configuration
        (useful for isolating heavy maintenance workloads).]
    features: ['Data mover micro service: CSI snapshot data movement now runs in dedicated
        backup/restore pods instead of node-agent hostPath access, improving security,
        resource isolation, and resilience.', 'Item Block model + ItemBlockAction
        (IBA) plugin type: enables categorizing resources into blocks for future concurrent
        backup processing; includes built-in IBAs for Pods and PVCs.', 'Repository
        maintenance job node selection: you can steer maintenance jobs to specific
        nodes via a new maintenance configMap.', 'Backup PVC configuration: ability
        to mount backupPVCs read-only (can speed up expose on some storage like Ceph)
        and to choose a dedicated StorageClass for backupPVCs.', 'Backup repository
        cache limit configuration: cap client-side cache usage per repository to reduce
        risk of ephemeral-storage eviction.', 'Performance improvements: fixes plugin-call
        memory leak, passes client QPS/burst to plugins automatically, and includes
        kopia upstream memory/perf fixes for large repositories.']
    breaking_changes: ['Restic fs-backup is now deprecated: it still works in 1.15
        but emits warnings when restic uploader/path is used; plan migration off restic
        per Velero deprecation policy.', 'Node-agent configMap name is no longer implicitly
        fixed: if you customize it, you must set `--node-agent-configmap` to the chosen
        name.', 'Repository maintenance job resource settings are moving from server
        flags to a dedicated configMap (flags remain for compatibility, but configMap
        takes precedence).', Changing PVC selected-node feature is deprecated in 1.15
        and will be removed in a future release; avoid relying on it.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: [CSI plugin is now bundled into Velero (internal plugin) and should
        no longer be installed separately via the `--plugins` mechanism; ensure any
        helm values/args that add the CSI plugin image are removed to avoid duplicate
        plugin loading., 'Node-agent default CPU/memory requests/limits were removed
        upstream; if you relied on chart defaults for sizing/QoS, explicitly set node-agent
        resources in Helm values or accept BestEffort QoS.', 'Repository maintenance
        for kopia/restic is now executed via Kubernetes Jobs; review/override job
        resource requests/limits if your chart exposes them, and ensure RBAC allows
        creating Jobs in the Velero namespace.', 'Restore workflow adds a new `Finalizing`
        phase; if you have alerts/dashboards/automation that expect only prior phases,
        update them to include `Finalizing` and changed completion semantics.']
    features: [Repository maintenance for kopia/restic runs in separate Kubernetes
        Jobs to reduce Velero server pod OOM risk; resources can be tuned independently.,
      'VolumePolicies now support an `action` to force `fs-backup` or `snapshot` per
        volume, enabling fine-grained per-workload volume handling without app changes.',
      Data mover pods can be constrained to eligible nodes via a ConfigMap-based node
        selection mechanism for better resource and placement control., Restore VolumeInfo
        metadata is persisted and `velero restore describe` output is enhanced to
        show more per-volume restore details., Restores gain a `Finalizing` phase
        so PV labeling and post-restore hooks occur after snapshot/data movement completes.,
      Azure plugin adds certificate-based service principal authentication as an alternative
        to secret-based auth.]
    breaking_changes: ['Do not install the CSI plugin separately anymore: it is merged
        into the Velero repo and installed by default as an internal plugin in v1.14;
        remove CSI plugin entries to avoid conflicts.', 'Node-agent default resource
        requests/limits were removed, changing pods to BestEffort QoS unless you set
        resources explicitly; this can affect scheduling and performance under contention.',
      'Namespace filtering behavior changes when you use label selectors without explicit
        include/exclude namespaces: backups will now include only namespaces that
        contain matching resources (previously all namespaces were included).', 'PV
        patching during the new `Finalizing` phase can cause restores to end `PartiallyFailed`
        if PVs are stuck Pending, where older versions may have shown `Complete`;
        update expectations/alerts/runbooks.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
