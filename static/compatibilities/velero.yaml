  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero components (node-agent, data mover
        pods, maintenance jobs) can run on Windows nodes and backup/restore Windows
        workloads, with a new hybrid/all-in-one image build.', 'Parallel ItemBlock
        backup: backup engine can process ItemBlocks concurrently using a configurable
        server flag `--item-block-worker-count` to improve throughput (default 1).',
      'Data mover restore scalability improvement: new node-agent config flag `ignoreDelayBinding`
        lets restores for WaitForFirstConsumer volumes spread across nodes instead
        of being constrained to the attachment node.', 'Improved observability for
        data mover: node-agent logs now include intermediate object statuses on failures
        and errors when cleanup/deletion of intermediate objects fails.', 'CSI snapshot
        usability: retained `VolumeSnapshotContent` objects are no longer included
        in backups, avoiding syncing/restoring unnecessary CSI objects across clusters.',
      'BackupRepository maintenance resiliency/observability: BackupRepository CR
        adds `RecentMaintenance` history; running maintenance jobs are recaptured
        after server restarts; maintenance/init skipped for readOnly BSL; configurable
        kopia maintenance cadence via `fullMaintenanceInterval` (normalGC/fastGC/eagerGC).',
      'Volume Policy enhancement: can filter volumes by PVC labels (and additional
        CSI PV VolumeAttributes properties).', Per-object status restore control via
        annotation `velero.io/restore-status` on individual objects., 'Velero image
        now bundles `velero`, `velero-helper`, and `velero-restore-helper` binaries
        in a single image.']
    breaking_changes: []
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm values / install-time config changes to review (Velero\
      \ 1.14 \03 1.15)\n\n- **Restic uploader deprecation warnings (1.15):**\n  -\
      \ If you currently set `--uploader-type=restic` (often surfaced via Helm values\
      \ like `configuration.uploaderType`, `uploaderType`, or `initContainers`/args\
      \ overrides depending on chart), expect **warnings** on backup/restore. Plan\
      \ migration to **Kopia** for filesystem backups.\n\n- **node-agent configMap\
      \ name is no longer fixed (1.15):**\n  - If you rely on a node-agent configMap,\
      \ you now must ensure the Velero node-agent is started with `--node-agent-configmap=<name>`\
      \ matching your configMap.\n  - If you previously assumed an implicit/standard\
      \ name, verify Helm values generate the expected configMap name and pass it\
      \ to node-agent args.\n\n- **Repository maintenance job configuration prefers\
      \ configMap (1.15):**\n  - These server flags are effectively migrated to a\
      \ new **repository maintenance configuration configMap**; if both are set, **configMap\
      \ wins**:\n    - `--keep-latest-maintenance-jobs`\n    - `--maintenance-job-cpu-request`\n\
      \    - `--maintenance-job-mem-request`\n    - `--maintenance-job-cpu-limit`\n\
      \    - `--maintenance-job-mem-limit`\n  - For Helm: consider moving any existing\
      \ `server.extraArgs` / `configuration.extraArgs` values for these into the new\
      \ configMap mechanism supported by the chart.\n\n- **New configMaps introduced\
      \ (1.15) you may want to manage via Helm:**\n  - **Repository maintenance configMap**\
      \ (node selection + resource knobs).\n  - **Backup PVC configuration configMap**\
      \ (read-only mount, storageClass selection, and `no-relabeling` option).\n \
      \ - **Backup repository configuration configMap** (repository cache size/limits).\n\
      \n- **Node-agent resource requests/limits (already changed in 1.14):**\n  -\
      \ Default node-agent requests/limits were removed in 1.14 (BestEffort). If your\
      \ cluster requires requests/limits for scheduling/PSA, ensure your Helm values\
      \ explicitly set them.\n\n- **CSI plugin installation behavior (1.14):**\n \
      \ - CSI plugin is built-in starting 1.14; do **not** install it via `--plugins`\
      \ / chart plugin lists if your chart still allows specifying plugins.\n"
    chart_updates: []
    features: ['Data mover microservice: CSI snapshot data movement shifts from node-agent
        pods into dedicated backup/restore pods, improving security (less hostPath),
        resource control per operation, and fault isolation.', 'Item Block concepts
        and a new ItemBlockAction (IBA) plugin type: Velero can group correlated resources
        into blocks to enable future multi-threaded backup processing; v1.15 includes
        the model and plugin support but still processes single-threaded for now.',
      'Node selection for repository maintenance jobs: you can direct maintenance
        jobs to specific nodes (e.g., idle nodes) using a new repository maintenance
        configuration configMap.', 'Backup PVC configuration: data mover backup pods
        can mount backupPVCs read-only (faster on some storage like Ceph) and can
        use a configurable storageClass for backupPVCs.', 'Backup repository client-side
        cache limit: you can cap per-repository cache usage to avoid pod eviction
        due to ephemeral storage pressure.', 'Performance/stability improvements:
        fixes a server memory leak after plugin calls, passes client QPS/burst settings
        through to plugins, and includes upstream Kopia improvements reducing memory
        usage during maintenance on large repositories.']
    breaking_changes: ['Restic is deprecated for filesystem backups starting in 1.15:
        backups/restores still succeed but will emit warnings when Restic uploader
        is selected or used.', node-agent configMap name is now configurable and must
        be provided via `--node-agent-configmap`; relying on a hard-coded name will
        break., Repository maintenance job tuning is moving from Velero server flags
        to a dedicated configMap (flags still work for backward compatibility but
        configMap takes precedence)., Changing PVC selected-node feature is now deprecated
        and should no longer be used; it will be removed in a future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Moves kopia/restic repository maintenance out of the Velero server
        pod into a separate Kubernetes Job to avoid server OOMs; you can now size
        requests/limits for that job independently., 'Extends VolumePolicy to support
        additional actions (e.g., `fs-backup` or `snapshot`) so volume handling can
        be controlled via policy instead of changing workloads.', Adds node selection
        for data-movement (datamover) pods via a ConfigMap to constrain where high-resource
        datamover workloads can run., Persists VolumeInfo metadata on restores (not
        just backups) and improves `velero restore describe` output accordingly.,
      'Introduces a new Restore phase, `Finalizing`, to ensure PV labeling and post-restore
        hooks occur after volume data movement/snapshot restore completes.', 'Adds
        Azure service principal certificate-based authentication support for more
        secure, phishing-resistant auth.']
    breaking_changes: [CSI plugin is now merged into the main Velero repo and installed
        by default as an internal plugin; you must stop installing it via `--plugins`
        during install/upgrade., Default resource requests/limits for the node-agent
        are removed so node-agent pods become QoS BestEffort; you may need to set
        explicit resources if you relied on previous defaults., 'Backup namespace
        filtering behavior changes when `includedNamespaces`/`excludedNamespaces`
        are omitted but `labelSelector`/`orLabelSelectors` are set: only namespaces
        containing matching resources are included (previously all namespaces were).',
      'Restore behavior change: PV patching during the new `Finalizing` phase can
        cause restores to end `PartiallyFailed` if the PV is stuck `Pending`, whereas
        earlier versions might still report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
