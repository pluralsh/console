  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, adding concurrency
        control, cancel/resume, better isolation, and steadier node-agent resource
        usage.', 'fs-backup now supports Windows clusters by running data mover pods
        on Windows nodes; combined with 1.16 CSI snapshot data movement, this enables
        full Windows workload backup/restore scenarios.', 'Adds beta Kubernetes VolumeGroupSnapshot
        support for both CSI snapshot backups and CSI snapshot data movement to achieve
        crash-consistent, point-in-time snapshots across multiple volumes.', 'Adds
        PriorityClass support across Velero components (server, node-agent, data mover
        pods, and repository maintenance jobs).', 'Improves scalability/resiliency
        of data movers via node-agent PrepareQueueLength to throttle pod creation,
        plus better restart/orphan handling.', Adds include/exclude policy support
        in resource policies so reusable include/exclude filters can be defined in
        a configmap and referenced by multiple backups., 'Operational improvements:
        BSL availability metric, BSL status checks for backup/restore, imagePullSecrets
        inheritance for data mover/maintenance jobs, s390x binary support, and multiple
        fixes around PVC restore selected-node, affinities, and hooks.']
    breaking_changes: ['Restic uploader path for fs-backup is removed: `--uploader-type=restic`
        is no longer valid for installs; restores from existing restic-based backups
        remain supported until v1.19.', Repository maintenance job settings were removed
        from velero server flags (keep-latest and CPU/memory req/limits); configuration
        moves to a repository maintenance job ConfigMap (with some CLI fallback).,
      'PVC restore behavior change: selected-node annotation is now always removed
        when no node mapping exists; previously it could be preserved if the node
        existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can now run in Windows and hybrid
        Linux/Windows clusters, including node-agent, data mover pods, and maintenance
        jobs; supports backup/restore of Windows workloads with the built-in data
        mover.', 'Parallel ItemBlock backup: backup engine can process ItemBlocks
        concurrently to improve throughput; configurable via `--item-block-worker-count`
        (default 1).', 'Data mover restore scalability improvement: new node-agent
        config flag `ignoreDelayBinding` allows restoring WaitForFirstConsumer volumes
        without being pinned to the attached node, improving parallelism and load
        balancing.', 'Improved observability for data mover: enhanced logging/status
        output for intermediate objects and cleanup failures in node-agent logs (enabled
        by default).', 'CSI snapshot usability improvement: removes retained `VolumeSnapshotContent`
        objects from backups to avoid syncing/restoring unnecessary CSI artifacts
        across clusters.', 'BackupRepository maintenance improvements: adds `RecentMaintenance`
        history to BackupRepository CR; maintenance jobs are recaptured after server
        restart; maintenance/init are skipped for readOnly BSLs/BackupRepositories;
        configurable Kopia full maintenance intervals via `fullMaintenanceInterval`
        (normalGC/fastGC/eagerGC).', 'Volume Policy enhancement: can now filter volumes
        based on PVC labels (in addition to previous criteria).', 'Per-object resource
        status restore control: annotation `velero.io/restore-status` lets you enable/disable
        status restore on specific objects.', 'Single image now contains restore helper
        binaries: `velero`, `velero-helper`, and `velero-restore-helper` are bundled
        in the main Velero image; no separate restore-helper image needed.']
    breaking_changes: ['No explicit breaking changes were called out in the provided
        v1.16.0 notes; however, behavior changes include concurrent execution of pre/post
        hooks when ItemBlock parallelism is enabled, and CSI backup contents changing
        (VolumeSnapshotContent no longer included), which may affect downstream workflows
        expecting those objects.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm values / configuration changes to plan for (Velero 1.14\
      \ -> 1.15)\n\n> These notes are based on the Velero **application** release\
      \ notes you provided (not a Helm chart changelog). When upgrading via Helm,\
      \ you typically implement these via `values.yaml` (extra args/env), plus creating\
      \ the referenced ConfigMaps.\n\n### 1) node-agent configmap name is no longer\
      \ fixed\n- **New behavior:** Velero can use a **custom** node-agent configuration\
      \ ConfigMap name.\n- **Action:** If you use a node-agent config ConfigMap, ensure\
      \ the Velero server is started with:\n  - `--node-agent-configmap=<your-configmap-name>`\n\
      - **Helm impact:** Add/adjust server `configuration.extraArgs` / `initContainers`\
      \ / chart-specific `configuration.extraArgs` equivalent, depending on your chart.\n\
      \n### 2) Repository maintenance job tuning moved to a ConfigMap (preferred)\n\
      - **New recommended config:** Use the new **repository maintenance job configuration\
      \ ConfigMap**.\n- **Args still exist for backward compatibility**, but **ConfigMap\
      \ takes precedence** if both are set.\n- **Moved settings:**\n  - `--keep-latest-maintenance-jobs`\n\
      \  - `--maintenance-job-cpu-request`\n  - `--maintenance-job-mem-request`\n\
      \  - `--maintenance-job-cpu-limit`\n  - `--maintenance-job-mem-limit`\n- **Action:**\
      \ Decide whether to keep existing args or migrate to the ConfigMap (recommended\
      \ for 1.15+).\n\n### 3) New ConfigMaps you may want/need to add (optional features)\n\
      If you use data movement and/or want more control, plan to manage these ConfigMaps\
      \ (chart may or may not template them):\n- **Repository maintenance configuration\
      \ ConfigMap** (also supports **node selection** for maintenance jobs)\n- **Backup\
      \ PVC configuration ConfigMap**\n  - read-only mount behavior\n  - backupPVC\
      \ storage class selection\n  - `no-relabeling` option\n- **Backup repository\
      \ configuration ConfigMap**\n  - e.g., `cacheLimit` for kopia repo cache size\n\
      \n### 4) Restic deprecation warnings\n- **Behavior:** Restic is deprecated starting\
      \ 1.15; backups/restores still succeed but warnings appear if:\n  - `--uploader-type=restic`\
      \ is used at install\n  - restic path is used for fs-backup\n- **Action:** If\
      \ your Helm values set uploader/restic explicitly, plan migration toward kopia/node-agent\
      \ path to avoid future removals.\n"
    chart_updates: []
    features: ['Data mover micro service: CSI Snapshot Data Movement transfers run
        in dedicated backup/restore pods instead of node-agent pods, improving isolation
        and enabling per-operation resource tuning.', Repository maintenance jobs
        now support node selection via a new maintenance configuration ConfigMap so
        you can steer heavy jobs to specific nodes., 'Backup PVC configuration: data-mover
        backup pods can mount backupPVCs read-only (can improve performance for some
        storage backends) and can use a configurable StorageClass for backupPVCs.',
      'Backup repository configuration: configure per-repository client-side cache
        size limits to reduce risk of pod eviction from ephemeral storage pressure.',
      'Performance improvements: fixes a post-plugin-call memory leak, automatically
        passes client QPS/burst settings to plugins, and incorporates upstream kopia
        improvements for large repositories.']
    breaking_changes: [Restic fs-backup path is deprecated in 1.15; operations still
        work but produce warnings and will be removed in a future release per the
        deprecation policy., "node-agent configuration ConfigMap name can now be customized,\
        \ but requires explicitly setting the server arg `--node-agent-configmap`\
        \ if you don\u2019t use the default name.", 'Repository maintenance job tuning
        is expected to move from server flags to a dedicated ConfigMap (flags remain
        for compatibility, but ConfigMap values override if both are set).', The 'Changing
        PVC selected-node' feature is deprecated in 1.15 and should not be relied
        upon for new setups.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Repository maintenance for kopia/restic is now executed in separate
        Kubernetes Jobs to avoid Velero server OOM during maintenance; install-time
        resource requests can be specified for these jobs., 'VolumePolicies now support
        additional actions (e.g., `fs-backup` and `snapshot`) enabling fine-grained
        per-volume backup method selection without changing workloads.', 'Data mover
        pods can be constrained to eligible nodes via a ConfigMap, allowing better
        control over resource-heavy data movement workloads.', Restore operations
        now persist VolumeInfo metadata and `velero restore describe` surfaces more
        details about how volumes were handled during restore., Restore workflow adds
        a new `Finalizing` phase to sequence PV patching and hook execution after
        data movement completes., 'Azure plugin adds service-principal certificate-based
        authentication support (phishing-resistant, aligns with Azure recommendations).']
    breaking_changes: [CSI plugin is merged into the main Velero repo and is installed
        by default as an internal plugin; do not install it separately via `--plugins`
        during `velero install`/upgrade., 'Default resource requests/limits for the
        node-agent are removed, making node-agent pods BestEffort by default; you
        may need to set explicit resources if you relied on prior defaults.', 'Backup
        namespace filtering behavior changes when `includedNamespaces`/`excludedNamespaces`
        are unset but label selectors are set: only namespaces containing matching
        resources are included (previously all namespaces were included).', PV patching
        during the new restore `Finalizing` phase can cause restores to end `PartiallyFailed`
        if a PV is blocked in `Pending` (previously might still be `Complete`).]
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
