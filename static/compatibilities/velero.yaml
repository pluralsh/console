  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, enabling concurrency
        control, cancel/resume, better robustness across node-agent restarts, and
        steadier resource usage.', fs-backup now supports Windows clusters by allowing
        data mover pods to run on Windows nodes for volume backup/restore., 'Adds
        (beta) Kubernetes VolumeGroupSnapshot support for point-in-time consistent
        snapshots across multiple volumes, for both CSI snapshot backup and CSI snapshot
        data movement.', 'Adds PriorityClass support across Velero components (server,
        node-agent, data movers, and maintenance jobs) with per-module configuration.',
      Improves data mover scalability/resiliency via a node-agent PrepareQueueLength
        to avoid creating too many pending data mover pods and better restart/orphan
        handling., "Adds node-selection for CSI snapshot data movement restores and\
        \ supports per-storage-class node selection for environments where SCs aren\u2019\
        t available on all nodes.", Resource policies now support reusable include/exclude
        filters via includeExcludePolicy in addition to volumePolicy., Adds/updates
        operational improvements like BSL availability metric and more robust behavior
        around snapshots and backup finalization.]
    breaking_changes: ['Restic uploader is removed for new fs-backup operations: --uploader-type=restic
        is no longer valid for install/config (restores from existing restic-path
        backups still supported until v1.19).', Repository maintenance job configuration
        flags were removed from the velero server (keep/latest and CPU/memory request/limit
        flags); these settings must be provided via the maintenance job ConfigMap.,
      'PVC restore behavior changed: selected-node annotation is now always removed
        when no node mapping exists (previously preserved if the node existed).']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
