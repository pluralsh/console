  summary:
    helm_changes: ''
    chart_updates: ['Velero 1.17 modernizes fs-backup (formerly restic-oriented) into
        a micro-service architecture in the node-agent/data mover path, improving
        resiliency (resume/cancel), stability of resource usage, and isolating failures
        per volume transfer.', Adds Windows support for fs-backup via data mover pods
        able to run on Windows nodes (complements CSI snapshot data movement Windows
        support added in 1.16)., 'Adds VolumeGroupSnapshot (VGS) support (beta upstream
        feature) for both CSI snapshot backups and CSI snapshot data movement, enabling
        crash-consistent, write-order-consistent multi-volume snapshots.', 'Adds PriorityClass
        support across Velero components: server, node-agent, data mover pods, and
        backup repository maintenance jobs.', Improves scalability of data mover pod
        creation via node-agent PrepareQueueLength to avoid large numbers of Pending
        pods in large environments., 'Improves restart behavior: data movements can
        resume after node-agent restart and can be canceled if orphaned (e.g., node
        absent).', 'Adds node selection for CSI snapshot data movement restore, plus
        per-storageclass node selection capabilities.', Adds reusable include/exclude
        resource filtering policies in ResourcePolicy ConfigMaps (includeExcludePolicy)
        in addition to volumePolicy., 'Operational/config changes: repository maintenance
        job configuration moved from server CLI flags into a ConfigMap; CLI/server
        validate ConfigMap parameters.', 'Breaking behavior tweak during PVC restore:
        selected-node annotation is always removed when no node mapping exists (previously
        preserved if node existed).', 'Deprecation enforcement: restic uploader type
        removed from install configuration; cannot create new restic-path fs-backups,
        but restores from existing restic backups supported until v1.19.']
    features: [Modernized fs-backup into a micro-service architecture with concurrency
        controls plus cancel/resume and better resource isolation., Windows workload
        fs-backup/restore support via Windows-scheduled data mover pods., Volume Group
        Snapshot support for consistent point-in-time snapshots across multiple volumes
        (Kubernetes beta)., 'PriorityClass configuration supported for Velero server,
        node-agent, data movers, and maintenance jobs.', Data mover scalability improvements
        using PrepareQueueLength to reduce excessive Pending pods., ResourcePolicy
        enhancements with reusable include/exclude filtering policies.]
    breaking_changes: [Restic uploader type is no longer valid (`--uploader-type=restic`
        removed); you cannot create new restic-based fs-backups (restores from existing
        restic backups supported until v1.19)., Repository maintenance job configuration
        flags were removed from the Velero server; configuration must come from the
        maintenance job ConfigMap instead., 'PVC restore behavior changed: Velero
        now always removes `selected-node` annotation when no node mapping exists
        (previously could be preserved).']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
