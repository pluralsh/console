    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can run on Windows clusters and back
        up/restore Windows workloads; node-agent, data mover pods, and maintenance
        jobs can be scheduled on Windows nodes (fs-backup remains Linux-only).', 'Parallel
        ItemBlock backup: item blocks are now processed concurrently via a thread
        pool to improve backup throughput; configurable via `--item-block-worker-count`
        (default 1).', 'Data mover restore scalability for WaitForFirstConsumer volumes:
        node-agent can ignore delay binding so restores can spread across nodes; configured
        via `ignoreDelayBinding` in node-agent config.', 'Improved observability for
        data mover backup/restore: logs include intermediate-object statuses on failure
        and cleanup deletion errors, enabled by default.', 'CSI snapshot usability
        improvement: retained `VolumeSnapshotContent` objects are no longer included
        in backups, reducing unnecessary CSI objects synced/restored across clusters.',
      'BackupRepository maintenance resiliency/observability: `RecentMaintenance`
        history added; maintenance jobs are recaptured after server restart; maintenance/init
        skipped for readOnly BSLs; configurable `fullMaintenanceInterval` supporting
        normal/fast/eager GC intervals.', 'Volume Policy enhancement: can filter volumes
        by PVC labels (in addition to existing selectors).', 'Per-object resource
        status restore control: annotate resources with `velero.io/restore-status`
        to opt in/out at object granularity.', 'Velero restore helper binaries are
        now included in the main Velero image (single image contains `velero`, `velero-helper`,
        `velero-restore-helper`).']
    breaking_changes: [No explicit breaking changes were called out for 1.16.0 in
        the provided notes; main upgrade risks are behavioral changes (parallel item-block
        execution affecting hook concurrency and CSI VolumeSnapshotContent no longer
        being backed up).]
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: "## Helm/values changes to check\nNo Helm chart changelog was provided,\
      \ so treat these as **application-level config changes that will likely map\
      \ to Helm values**:\n\n- **New ConfigMaps introduced in 1.15** (you may need\
      \ to create/enable via chart values if the chart supports it):\n  - **Repository\
      \ maintenance job configuration ConfigMap** (preferred over server flags; values\
      \ here take precedence).\n  - **Backup PVC configuration ConfigMap** (controls\
      \ read-only mounts, storageClass, and `no-relabeling`).\n  - **Backup repository\
      \ configuration ConfigMap** (controls per-repository cache size limit).\n- **node-agent\
      \ configmap name is now configurable**: if you use a node-agent config ConfigMap,\
      \ ensure Helm values set **both** the ConfigMap name and the server arg `--node-agent-configmap=<name>`.\n\
      - **Repository maintenance settings**: if you currently set any of these via\
      \ args/values, plan to migrate into the new ConfigMap:\n  - `--keep-latest-maintenance-jobs`\n\
      \  - `--maintenance-job-cpu-request`\n  - `--maintenance-job-mem-request`\n\
      \  - `--maintenance-job-cpu-limit`\n  - `--maintenance-job-mem-limit`\n- **Restic\
      \ deprecation warnings**: if you set `--uploader-type=restic` via values, expect\
      \ warnings; start planning migration away from restic uploader.\n"
    chart_updates: ['Velero 1.15 introduces a new data mover microservice architecture
        for CSI Snapshot Data Movement: data transfer moves from node-agent pods into
        dedicated backup/restore pods, with new resource-tuning knobs.', 'Item Block
        concepts and the ItemBlockAction (IBA) plugin type were added (single-threaded
        for now, but enables future parallelization).', Repository maintenance jobs
        can be steered to selected nodes; requires a new repository maintenance configuration
        ConfigMap., 'BackupPVC behavior is now configurable (read-only mount option,
        storageClass selection, and `no-relabeling` option) via a new backup PVC configuration
        ConfigMap.', Backup repository client-side cache limit is configurable per
        repository via a new backup repository configuration ConfigMap., 'Performance
        changes: fix plugin-call memory leak; pass client QPS/burst to plugins; Kopia
        maintenance memory improvements included.', 'Dependencies/runtime updated:
        Go 1.22.8; Kopia remains 0.17.0.']
    features: ['Data mover microservice: CSI snapshot data movement now runs in dedicated
        backup/restore pods instead of node-agent hostPath-based access, improving
        security, isolation, and resiliency.', Item Block + ItemBlockAction plugin
        type allows grouping related resources into blocks (foundation for future
        multi-threaded backup processing)., 'Repository maintenance jobs can be scheduled
        onto specific nodes via configuration, helping isolate heavy maintenance workloads.',
      'BackupPVC configuration: optionally mount backup PVCs read-only (can significantly
        speed expose for some storage like Ceph) and choose a dedicated storage class
        for backup PVCs.', Backup repository cache limit configuration reduces risk
        of pod eviction due to ephemeral storage consumption during repo operations.,
      'Performance improvements: fixes a server memory leak after plugin calls, automatically
        propagates client QPS/burst to plugins, and reduces Kopia maintenance memory
        usage for large repos.']
    breaking_changes: ["Restic path for fs-backup enters deprecation: backups/restores\
        \ still succeed but you\u2019ll see warnings if `--uploader-type=restic` is\
        \ used or restic uploader path is exercised.", 'node-agent configuration ConfigMap
        name is no longer assumed: if you rely on a node-agent configmap, you must
        set `--node-agent-configmap` to the chosen name.', 'Repository maintenance
        job settings are moving from server flags to a dedicated ConfigMap (flags
        still work for backward compatibility, but ConfigMap values override and are
        recommended).', "The \u2018change PVC selected-node\u2019 feature is deprecated\
        \ in 1.15 and should not be relied on going forward."]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: [Velero CSI plugin is now built-in (merged into core) and installed
        by default; do not install the external CSI plugin via `--plugins` anymore.,
      Node-agent default CPU/memory requests/limits were removed so node-agent runs
        BestEffort unless you set resources explicitly., Repository maintenance for
        kopia/restic is moved out of the Velero server pod into separate Kubernetes
        Jobs; resources for those jobs can be specified during install/upgrade., 'Restore
        workflow now includes a new `Finalizing` phase, changing timing of PV patching
        and post-restore hooks.', Restore now persists VolumeInfo metadata and `velero
        restore describe` output includes more volume details., Backup namespace filtering
        behavior changes when using label selectors without explicit included/excluded
        namespaces.]
    features: [Moves kopia/restic repository maintenance into separate Kubernetes
        Jobs to avoid Velero server pod OOM; you can set job resource requests., 'Extends
        VolumePolicies to control volume backup method per volume (e.g., force `fs-backup`
        vs `snapshot`) for fine-grained opt-in/out.', Adds node selection for data
        movement backups via a ConfigMap to constrain where datamover pods can run.,
      Persists VolumeInfo metadata for restores and enhances `velero restore describe`
        to show CSI/data movement details., Introduces a restore `Finalizing` phase
        so PV labeling and post-restore hooks happen after volume data movement completes.,
      Adds Azure service principal certificate-based authentication support and updates
        Azure SDK libraries.]
    breaking_changes: [Do not install the separate CSI plugin anymore; CSI plugin
        code is merged into Velero and enabled by default in v1.14., 'Node-agent no
        longer has default resource requests/limits; if you relied on them, set explicit
        resources to avoid noisy-neighbor/eviction issues.', 'Backup namespace filtering
        changes: if included/excluded namespaces are unset but labelSelector/OrLabelSelectors
        are set, only namespaces containing matching resources are backed up (previously
        all namespaces were included).', 'Restore may now end in PartiallyFailed when
        PV patching during `Finalizing` is blocked (e.g., PV stuck Pending) whereas
        earlier it might have shown Complete.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
