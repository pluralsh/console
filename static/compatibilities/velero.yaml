- version: 1.17.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, improving robustness
        and enabling concurrency control, cancel/resume, and steadier node-agent resource
        usage.', fs-backup now supports Windows workloads by running data mover pods
        on Windows nodes for volume backup/restore., 'Beta support for Kubernetes
        VolumeGroupSnapshots for point-in-time, write-order-consistent snapshots across
        multiple volumes (for both CSI snapshot backup and CSI snapshot data movement).',
      'PriorityClass support across Velero components (server, node-agent, data mover
        pods, and repository maintenance jobs).', 'Scalability/resiliency improvements
        for data movers: PrepareQueueLength to throttle pod creation, improved restart
        survival, and enhanced node-selection (including per storage class) for CSI
        snapshot data movement restore.', Resource policy now supports reusable include/exclude
        filters via includeExcludePolicy in addition to volumePolicy.]
    breaking_changes: ['Restic uploader path removed: `--uploader-type=restic` is
        no longer valid for new backups (restores from existing restic backups supported
        only until v1.19).', Repository maintenance job configuration flags removed
        from Velero server (`--keep-latest-maintenance-jobs` and the maintenance job
        CPU/memory request/limit flags); these settings moved to a maintenance job
        ConfigMap., 'PVC restore behavior change: Velero now always removes the `selected-node`
        annotation during PVC restore when no node mapping exists (previously it could
        be preserved if the node existed).']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can run in Windows/hybrid clusters;
        node-agent, data mover pods, and maintenance jobs can schedule to Windows
        nodes, and built-in data mover supports Windows workload backup/restore lifecycle
        (with noted limitations).', 'Parallel ItemBlock backup: Velero can now process
        item blocks concurrently to improve backup throughput; controlled via new
        server flag `--item-block-worker-count` (default 1).', 'Data mover restore
        scalability: new node-agent config `ignoreDelayBinding` allows spreading WaitForFirstConsumer
        volume restores across nodes rather than being pinned to the attachment node.',
      'Improved data mover observability: richer intermediate-object status/error
        logging for backup/restore and cleanup failures in node-agent logs (enabled
        by default).', 'CSI snapshot usability: VolumeSnapshotContent objects that
        were previously retained and replicated are no longer included in backups,
        reducing cross-cluster sync/restore noise.', 'Backup repository maintenance
        resiliency/observability: maintenance history (`RecentMaintenance`) added
        to BackupRepository, running jobs are recaptured after server restarts, maintenance/init
        suppressed for read-only BSLs, and Kopia full maintenance interval is configurable
        (`normalGC`/`fastGC`/`eagerGC`).', 'Volume Policy enhancements: can filter
        volumes by PVC labels.', 'Per-object resource status restore control: annotation
        `velero.io/restore-status` can enable/disable restoring status on a per-object
        basis.', 'Packaging change: `velero`, `velero-helper`, and `velero-restore-helper`
        are merged into a single Velero image.']
    breaking_changes: ['No explicit breaking changes were called out in the v1.16.0
        release notes provided; validate your existing Restic/fs-backup usage and
        custom configs against 1.16 docs, especially in mixed OS clusters and around
        maintenance/configmap-based settings introduced in 1.15.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI Snapshot Data Movement now runs in dedicated
        backup/restore pods instead of node-agent pods, improving security (no hostPath),
        allowing per-activity resource control, and improving resilience.', Item Block
        concepts and new ItemBlockAction (IBA) plugin type to group related resources
        for future concurrent backup processing; built-in IBAs for Pods and PVCs and
        support for custom IBAs., 'Node selection for repository maintenance jobs
        via a new repository maintenance configMap, letting you steer heavy maintenance
        workloads to specific nodes.', 'BackupPVC configuration via a new configMap:
        supports read-only mounting to speed expose on some storage backends and choosing
        a dedicated StorageClass for backup PVCs.', 'Backup repository cache size
        (ephemeral storage) limit per repository via a new backup repository configuration
        configMap, reducing risk of eviction due to disk pressure.', 'Performance
        fixes: plugin-call memory leak fixed; plugin executions inherit server client-qps/client-burst;
        Kopia memory improvements merged for large repos.']
    breaking_changes: ['Restic-based fs-backup is deprecated starting in 1.15: backups/restores
        still succeed but emit warnings when restic uploader is used; plan migration
        to kopia/uploader defaults.', node-agent configuration ConfigMap name is no
        longer fixed; you must set the server parameter `node-agent-configmap` if
        you use a non-default name., Repository maintenance job settings are moving
        from server flags to a repository-maintenance configMap; flags remain for
        compatibility but configMap values take precedence., Changing PVC selected-node
        feature is deprecated and should not be relied on; it will be removed in a
        future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Moves kopia/restic repository maintenance out of the Velero server
        pod into a separate Kubernetes Job to avoid server OOMs; you can now size
        requests/limits for that job independently., 'Extends VolumePolicy to support
        additional actions (e.g., `fs-backup` or `snapshot`) so volume handling can
        be controlled via policy instead of changing workloads.', Adds node selection
        for data-movement (datamover) pods via a ConfigMap to constrain where high-resource
        datamover workloads can run., Persists VolumeInfo metadata on restores (not
        just backups) and improves `velero restore describe` output accordingly.,
      'Introduces a new Restore phase, `Finalizing`, to ensure PV labeling and post-restore
        hooks occur after volume data movement/snapshot restore completes.', 'Adds
        Azure service principal certificate-based authentication support for more
        secure, phishing-resistant auth.']
    breaking_changes: [CSI plugin is now merged into the main Velero repo and installed
        by default as an internal plugin; you must stop installing it via `--plugins`
        during install/upgrade., Default resource requests/limits for the node-agent
        are removed so node-agent pods become QoS BestEffort; you may need to set
        explicit resources if you relied on previous defaults., 'Backup namespace
        filtering behavior changes when `includedNamespaces`/`excludedNamespaces`
        are omitted but `labelSelector`/`orLabelSelectors` are set: only namespaces
        containing matching resources are included (previously all namespaces were).',
      'Restore behavior change: PV patching during the new `Finalizing` phase can
        cause restores to end `PartiallyFailed` if the PV is stuck `Pending`, whereas
        earlier versions might still report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['CSI Snapshot Data Movement: can move CSI snapshot contents out of
        the source cluster/storage into durable backup storage and restore later (including
        cross-environment/cloud scenarios).', 'Resource Modifiers (JSON Substitutions):
        define match filters and JSON patch operations to mutate resources during
        restore without writing a custom RestoreItemAction plugin.', 'Multiple VolumeSnapshotClasses
        support in the Velero CSI plugin: allows choosing a specific VolumeSnapshotClass
        per backup instead of relying on a single labeled class.', 'Restore finalizer
        cleanup: `velero restore delete` now also cleans up restore-associated data
        in the backup storage location.', 'Runtime/deps refresh: Golang bumped to
        1.20.7 and Kopia bumped to 0.13.x along with other dependency updates.']
    breaking_changes: ['Default `uploader-type` changes from `restic` to `kopia`,
        which can change filesystem-backup behavior and repository expectations if
        you relied on restic defaults.', 'CSI snapshot timing/timeout behavior changed:
        snapshot handle creation uses `backup.spec.csiSnapshotTimeout` (was a fixed
        10m) and ReadyToUse waiting uses operation timeouts (default 4h).', Helm chart
        v4.0.0+ supports multiple BackupStorageLocations (BSL) and VolumeSnapshotLocations
        (VSL) and changes their values schema from map to slice; this is not backward
        compatible and should be migrated before upgrading., Finalizers added to Velero
        CRs (restore/dataupload/datadownload) can cause `kubectl delete namespace
        velero` to hang; use `velero uninstall` or remove/handle finalizers before
        namespace deletion.]
  chart_version: 5.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.12.3']
