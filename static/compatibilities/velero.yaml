  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['fs-backup is modernized to a micro-service architecture, improving
        robustness, concurrency control, cancel/resume behavior, and steadier node-agent
        resource usage.', 'fs-backup now supports Windows workloads by running data
        mover pods on Windows nodes; combined with prior CSI snapshot data movement
        support, Windows backup/restore is supported across scenarios.', Adds (beta)
        Kubernetes VolumeGroupSnapshot support for CSI snapshot backups and CSI snapshot
        data movement to achieve write-order consistency across multiple volumes.,
      'Adds PriorityClass support across Velero components (server, node-agent, data
        mover pods, repo maintenance jobs) for better scheduling control.', 'Improves
        data mover scalability/resiliency with node-agent PrepareQueueLength to throttle
        pod creation, plus better restart handling and cancellation of orphaned data
        movements.', CSI snapshot data movement restores now support node selection
        (like backup) and per-storage-class node selection controls., Resource policies
        now support reusable include/exclude filters via includeExcludePolicy in addition
        to volumePolicy.]
    breaking_changes: ['Restic uploader path is removed: --uploader-type=restic is
        no longer valid for new backups; restores from existing restic backups are
        supported only until v1.19.', Repository maintenance job configuration flags
        were removed from the Velero server (--keep-latest-maintenance-jobs and maintenance-job
        resource flags); configuration is now via a maintenance job ConfigMap (with
        CLI fallback noted)., 'Behavior change during PVC restore: selected-node annotation
        is always removed when no node mapping exists; previously it was preserved
        if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can run in Windows/hybrid clusters;
        node-agent, data mover pods, and maintenance jobs can be scheduled on Windows
        nodes, and built-in data mover supports Windows workloads end-to-end (with
        listed limitations).', 'Parallel Item Block backup: item blocks are now processed
        concurrently via a configurable worker pool (`--item-block-worker-count`),
        improving throughput for large numbers of resources; hooks are part of item
        blocks and may run in parallel.', 'Data mover restore scalability improvement:
        new node-agent config flag `ignoreDelayBinding` allows restores for WaitForFirstConsumer
        volumes to be spread across nodes instead of being constrained to the attached
        node.', 'Data mover observability improvements: node-agent logs now include
        intermediate object statuses on failures and errors encountered when deleting
        intermediate objects during cleanup.', 'CSI snapshot usability improvement:
        unnecessary retained VolumeSnapshotContent objects are no longer included
        in backups, reducing sync/restore noise across clusters.', 'Backup repository
        maintenance improvements: BackupRepository CR now exposes `RecentMaintenance`
        history; running jobs are recaptured after server restarts; maintenance/initialization
        is skipped for readOnly BSLs; configurable maintenance cadence via `fullMaintenanceInterval`
        (normalGC/fastGC/eagerGC).', 'Volume Policy enhancement: can filter volumes
        by PVC labels in volume policies.', 'Object-level resource status restore:
        per-object opt-in/out via `velero.io/restore-status` annotation.', 'Image
        packaging change: velero, velero-helper, and velero-restore-helper are now
        bundled into a single Velero image.']
    breaking_changes: [Item Block backups may now run concurrently (including hooks)
        when `--item-block-worker-count` > 1; any custom plugins/hooks that assumed
        strict serial execution may need validation and potential tuning., "Windows\
        \ support introduces platform-specific limitations: fs-backup is not supported\
        \ for Windows workloads; security descriptors/NTFS extended attributes aren\u2019\
        t backed up/restored, impacting non-admin Windows workloads."]
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro-service for CSI Snapshot Data Movement: data transfer
        moves from node-agent pods to dedicated backupPods/restorePods, improving
        security (no hostPath), per-operation resource control, resilience, and reducing
        unnecessary full backups on pod restarts.', Introduces Item Block concepts
        and the new ItemBlockAction (IBA) plugin type to categorize correlated resources
        for future multi-threaded backups (concepts/plugins available now; concurrent
        processing will come later)., 'Adds node selection for repository maintenance
        jobs via a new repository maintenance configuration ConfigMap, allowing maintenance
        jobs to run on specific/idle nodes.', 'Adds backupPVC configuration via a
        new ConfigMap: option for read-only mounting in data mover backupPods (can
        accelerate expose on some storage like Ceph) and ability to choose storage
        class for backupPVCs.', Adds backup repository cache limit configuration via
        a new backup repository configuration ConfigMap to cap ephemeral storage usage
        during repository operations and reduce eviction risk., 'Performance improvements:
        fixes server memory leak after plugin calls; passes server client QPS/burst
        to plugins automatically; incorporates Kopia upstream changes to reduce memory
        usage during maintenance with many files.']
    breaking_changes: ['Restic for filesystem backups enters deprecation in 1.15:
        existing restic-based fs-backup still works but emits warnings when installed
        with --uploader-type=restic or when restic path is used for fs-backup backup/restore.',
      'Node-agent configuration ConfigMap name is no longer assumed fixed; if you
        customize it, you must set the velero server parameter --node-agent-configmap
        to match.', Repository maintenance job settings are moving from velero server
        flags to the new repository maintenance ConfigMap; flags remain for backward
        compatibility but ConfigMap values take precedence when both are present.,
      Changing PVC selected-node feature is deprecated in 1.15 and should not be used;
        it will be removed in a future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: '- **CSI plugin install behavior changed**: starting in v1.14, the
      CSI plugin is merged into the Velero repo and **installed by default as an internal
      plugin**. If your Helm values currently install the CSI plugin via `--plugins`/plugin
      init containers, **remove it** to avoid duplicate/incorrect plugin installation.

      - **Node-agent resources default removed**: v1.14 removes default CPU/memory
      requests/limits for node-agent pods so they run as **BestEffort** by default.
      If you rely on guaranteed/burstable QoS or want to prevent eviction, **set explicit
      `resources.requests/limits` for node-agent** in Helm values.

      - **Repository maintenance moved to Jobs**: maintenance for kopia/restic repositories
      now runs in **separate Kubernetes Jobs**. Plan to **set resource requests/limits
      for the maintenance job** (if exposed via chart values) and ensure the cluster
      allows Jobs in the Velero namespace.

      - **Namespace filtering behavior change**: if `includedNamespaces`/`excludedNamespaces`
      are unset but `labelSelector`/`orLabelSelectors` are set on backups, v1.14 will
      **only include namespaces that contain matching resources** (previously all
      namespaces were included). Review any scheduled backups created/templated by
      Helm that rely on label selectors.

      '
    chart_updates: [CSI plugin is now internal to Velero in v1.14; charts/manifests
        should no longer add it as an external plugin., Node-agent pod defaults change
        (no default resources); chart users may need to add explicit resources for
        stability., 'Operational behavior change: repository maintenance runs as Jobs;
        ensure RBAC/PSA policies allow job creation and resource settings are appropriate.']
    features: [Kopia/restic repository maintenance is executed in separate Kubernetes
        Jobs to reduce Velero server pod memory pressure; you can size those jobs
        independently., 'VolumePolicies now support actions (e.g., `fs-backup` or
        `snapshot`) to control how individual volumes are protected without changing
        workloads.', Data mover backups can restrict eligible nodes via a ConfigMap-based
        node selection mechanism., Restore operations now persist VolumeInfo metadata
        and `velero restore describe` surfaces more volume-level details., Restores
        now include a `Finalizing` phase to order PV label restoration and ensure
        post-restore hooks run after data movement completes., Azure gains certificate-based
        service principal authentication support (phishing-resistant alternative to
        client secrets).]
    breaking_changes: [CSI plugin is bundled/internal in v1.14 and should not be installed
        via the `--plugins` parameter (or equivalent Helm initContainers/plugins list).,
      Default resource requests/limits for node-agent are removed; node-agent pods
        become BestEffort unless you set resources explicitly., 'Backup namespace
        filtering changes when only label selectors are provided: namespaces without
        matching resources are excluded (previously included).', PV patching during
        the new restore `Finalizing` phase can surface Pending PV issues as `PartiallyFailed`
        restores where older versions might have shown `Complete`.]
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
