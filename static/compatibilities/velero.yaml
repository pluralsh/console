  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support, including running node-agent/data mover/maintenance
        on Windows nodes and backing up/restoring Windows workloads (with noted limitations).',
      Parallel ItemBlock backup processing to improve throughput; configurable via
        the new server flag `--item-block-worker-count` (default 1)., Data mover restore
        scalability improvement for WaitForFirstConsumer volumes via node-agent config
        `ignoreDelayBinding` to spread restores across nodes., 'Improved data mover
        observability: more intermediate-object status/error logging (enabled by default).',
      'CSI snapshot usability improvement: retained VolumeSnapshotContent objects
        are no longer included in backups/restores, reducing cross-cluster sync noise.',
      'BackupRepository maintenance resiliency/observability enhancements: `RecentMaintenance`
        history, restart recapture, readOnly BSL safeguards, and configurable kopia
        maintenance cadence via `fullMaintenanceInterval` (normalGC/fastGC/eagerGC).',
      Volume Policy can now filter volumes by PVC labels., Per-object control for
        restoring resource status via `velero.io/restore-status` annotation., Velero
        restore-helper binaries are merged into the main Velero image.]
    breaking_changes: []
