  summary:
    helm_changes: "## Helm/values changes to plan for (Velero 1.14 -> 1.15)\n\n> The\
      \ notes you provided are application release notes, not the Helm chart changelog,\
      \ so exact `values.yaml` key changes **can\u2019t be asserted** from this alone.\
      \ Use this as an **upgrade checklist** for values/config you may need to add/change.\n\
      \n### 1) Node-agent configMap naming becomes configurable (breaking change)\n\
      - **Old behavior:** Velero looked for a fixed-name node-agent configMap.\n-\
      \ **New behavior (1.15):** If you customize the node-agent configMap name, you\
      \ must also set the node-agent server arg `--node-agent-configmap=<name>`.\n\
      - **Helm impact:**\n  - If your chart renders a node-agent configMap, ensure\
      \ its name matches what Velero is configured to use.\n  - If you rename resources\
      \ via Helm (e.g., `fullnameOverride`, `nameOverride`, custom `configMap` names),\
      \ verify the rendered name and server args stay consistent.\n\n### 2) Repository\
      \ maintenance job settings: flags -> configMap (breaking change)\n- In 1.15,\
      \ these server flags are **moved** to a new **repository maintenance job configuration\
      \ configMap** (flags still work for backward compatibility; configMap wins if\
      \ both set):\n  - `--keep-latest-maintenance-jobs`\n  - `--maintenance-job-cpu-request`\n\
      \  - `--maintenance-job-mem-request`\n  - `--maintenance-job-cpu-limit`\n  -\
      \ `--maintenance-job-mem-limit`\n- **Helm impact:**\n  - If you currently set\
      \ these via `configuration.extraArgs` / `server.extraArgs`, consider migrating\
      \ to the new configMap mechanism.\n  - Ensure RBAC allows Velero to read the\
      \ new configMap in the Velero namespace.\n\n### 3) New configMaps to optionally\
      \ manage (new features)\nIf you use CSI snapshot data movement / Kopia repos,\
      \ expect to potentially add/configure these:\n- **Repository maintenance configMap**\
      \ (node selection + job behavior).\n- **Backup PVC configuration configMap**\
      \ (read-only mounts, storageClass selection, and the new `no-relabeling` option).\n\
      - **Backup repository configuration configMap** (client-side cache sizing per\
      \ repo).\n\n### 4) Restic deprecation begins (breaking change)\n- Restic uploader\
      \ is deprecated starting 1.15; operations still succeed but emit warnings.\n\
      - **Helm impact:**\n  - If you set `--uploader-type=restic` in Helm values,\
      \ plan to migrate to **kopia** and remove that flag over time.\n  - Audit any\
      \ node-agent/restic-specific values and prepare a rollback plan if you still\
      \ rely on restic behavior.\n\n### 5) Data mover microservice changes operational\
      \ knobs\n- Data movement for CSI snapshot data movement shifts from node-agent\
      \ pods to dedicated backup/restore pods.\n- **Helm impact:**\n  - Expect new\
      \ tunables for resource requests/limits and possibly scheduling (node selectors/tolerations/affinity)\
      \ for these new pods\u2014verify what your chart version exposes.\n  - Review\
      \ Pod Security / PSP / PSA constraints because this feature aims to reduce hostPath\
      \ usage; but read-only backup PVC on SELinux may require privileged mode.\n"
    chart_updates: ['Data movement architecture changes in 1.15: CSI Snapshot Data
        Movement now runs in dedicated backup/restore pods (microservice) instead
        of node-agent pods; this affects scheduling and resource configuration practices.',
      ItemBlock concepts and ItemBlockAction (IBA) plugin type added (foundation for
        future concurrent backups; 1.15 still processes single-thread)., Repository
        maintenance jobs gain node selection support via a new repository maintenance
        configuration configMap., 'Backup PVC configuration added (read-only mounting
        option, backup PVC storageClass selection, and `no-relabeling` option).',
      Backup repository cache sizing (`cacheLimit`) becomes configurable via a new
        backup repository configuration configMap., 'Performance improvements: fix
        server memory leak after plugin calls; pass client QPS/burst to plugins; include
        Kopia upstream fixes for high-memory maintenance scenarios.', 'Operational/deprecation
        changes: Restic deprecation warnings; change-PVC selected-node feature deprecated.',
      'Node-agent configMap lookup behavior changed: name is now configurable but
        must be provided via `--node-agent-configmap` if customized.', Repository
        maintenance job resource/retention configuration moves from server flags to
        a configMap (configMap takes precedence).]
    features: ['Data mover microservice for CSI snapshot data movement uses dedicated
        backup/restore pods, improving security posture (less hostPath), resilience,
        and per-activity resource control.', Item Block model and ItemBlockAction
        plugin type introduced to group related resources for future concurrent backup
        processing (concurrency not enabled yet in 1.15)., 'Repository maintenance
        jobs now support node selection via a dedicated configMap, enabling isolation
        onto specific/idle nodes.', 'Backup PVC behavior is configurable: read-only
        mounts (to speed exposes for some storage backends) and explicit storageClass
        selection for backup PVCs.', Backup repository client-side cache limit is
        configurable per repository to prevent ephemeral storage pressure/evictions.,
      'Performance fixes: plugin-call memory leak fixed, server client QPS/burst automatically
        passed to plugins, and Kopia maintenance memory usage improved with upstream
        changes.']
    breaking_changes: [Restic-based filesystem backup/restore path is now deprecated;
        it still works in 1.15 but emits warnings (notably when `--uploader-type=restic`
        is used)., 'Node-agent configMap name is no longer assumed/fixed; if you customize
        it, you must set the node-agent arg `--node-agent-configmap` accordingly.',
      Repository maintenance job settings are migrated from Velero server flags into
        a repository maintenance job configuration configMap; flags remain but configMap
        values take precedence when both are set., The 'Changing PVC selected-node'
        feature is deprecated in 1.15 and should not be relied on going forward.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Moves kopia/restic repository maintenance out of the Velero server
        pod into a separate Kubernetes Job to avoid server OOMs; you can now size
        requests/limits for that job independently., 'Extends VolumePolicy to support
        additional actions (e.g., `fs-backup` or `snapshot`) so volume handling can
        be controlled via policy instead of changing workloads.', Adds node selection
        for data-movement (datamover) pods via a ConfigMap to constrain where high-resource
        datamover workloads can run., Persists VolumeInfo metadata on restores (not
        just backups) and improves `velero restore describe` output accordingly.,
      'Introduces a new Restore phase, `Finalizing`, to ensure PV labeling and post-restore
        hooks occur after volume data movement/snapshot restore completes.', 'Adds
        Azure service principal certificate-based authentication support for more
        secure, phishing-resistant auth.']
    breaking_changes: [CSI plugin is now merged into the main Velero repo and installed
        by default as an internal plugin; you must stop installing it via `--plugins`
        during install/upgrade., Default resource requests/limits for the node-agent
        are removed so node-agent pods become QoS BestEffort; you may need to set
        explicit resources if you relied on previous defaults., 'Backup namespace
        filtering behavior changes when `includedNamespaces`/`excludedNamespaces`
        are omitted but `labelSelector`/`orLabelSelectors` are set: only namespaces
        containing matching resources are included (previously all namespaces were).',
      'Restore behavior change: PV patching during the new `Finalizing` phase can
        cause restores to end `PartiallyFailed` if the PV is stuck `Pending`, whereas
        earlier versions might still report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
