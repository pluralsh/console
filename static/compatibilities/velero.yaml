  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, improving robustness,
        enabling concurrency control, cancel/resume, and reducing long-lived memory
        usage in node-agent.', fs-backup now supports Windows clusters by running
        data mover pods on Windows nodes for backup/restore of Windows volumes., Beta
        support for Kubernetes VolumeGroupSnapshot for both CSI snapshot backup and
        CSI snapshot data movement to improve write-order consistency across multiple
        volumes., 'PriorityClass support across Velero components (server, node-agent,
        data movers, repo maintenance jobs) for workload scheduling control.', 'Scalability/resiliency
        improvements for data movers: PrepareQueueLength to avoid creating excessive
        pending pods; data movements can survive node-agent restarts; improved cancel/orphan
        handling; restore node-selection plus storage-class specific node selection
        for CSI snapshot data movement.', Resource policy now supports reusable include/exclude
        filters via includeExcludePolicy in addition to volumePolicy., 'Operational
        improvements including BSL availability gauge metric, BSL status checks during
        backup/restore, and various CSI snapshot/data mover controller refinements. ']
    breaking_changes: ['Restic uploader path is removed for new backups: `--uploader-type=restic`
        is no longer valid for installation; restores from existing Restic backups
        are still supported until v1.19.', 'Repository maintenance job configuration
        flags were removed from the Velero server (`--keep-latest-maintenance-jobs`,
        `--maintenance-job-*-request/limit`); configuration moves to a maintenance
        job ConfigMap.', 'PVC restore behavior change: `selected-node` annotation
        is always removed when no node mapping exists; previously it could be preserved
        if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero can run in Windows/hybrid clusters
        and backup/restore Windows workloads via an all-in-one hybrid image; node-agent,
        data mover pods, and maintenance jobs can schedule onto Windows nodes.', 'Parallel
        ItemBlock backup: backups can process ItemBlocks concurrently via a worker
        pool; configure with the new `--item-block-worker-count` server flag (default
        1), and pre/post hooks run in parallel with their ItemBlock.', 'Data mover
        restore scalability: for WaitForFirstConsumer volumes, restores can be spread
        across nodes using the new node-agent config flag `ignoreDelayBinding` to
        avoid single-node bottlenecks.', 'Improved data mover observability: node-agent
        logs now include richer status/error output for intermediate objects and cleanup
        failures automatically.', 'CSI snapshot usability improvement: Velero no longer
        retains/backs up unnecessary VolumeSnapshotContent objects, avoiding syncing/restoring
        them to other clusters.', 'Backup repository maintenance improvements: BackupRepository
        gains `RecentMaintenance` history; maintenance jobs are recaptured after server
        restart; readOnly BSLs skip maintenance/init; Kopia maintenance interval configurable
        via `fullMaintenanceInterval` (normalGC/fastGC/eagerGC).', 'Volume policy
        enhancement: volume policies can filter volumes using PVC labels (in addition
        to prior criteria).', 'Per-object resource status restore: opt in/out per
        object using the `velero.io/restore-status` annotation.', 'Restore helper
        binaries bundled: `velero`, `velero-helper`, and `velero-restore-helper` are
        now included in the single Velero image.']
    breaking_changes: ['No explicit breaking changes are called out in the v1.16.0
        release notes provided; validate Windows limitations and any operational behavior
        changes (parallel hooks/ItemBlocks, CSI VSC retention change) against your
        environment and automation.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI snapshot data movement is shifted from
        node-agent pods into dedicated backup/restore pods, improving security (no
        hostPath), resource control, resilience, and reducing unnecessary full backups
        after pod restarts.', 'Item Block concepts and the new ItemBlockAction (IBA)
        plugin type to group related resources (built-in for Pods/PVCs, extensible)
        in preparation for future multi-threaded backups.', Configurable node selection
        for repository maintenance jobs via a new repository maintenance ConfigMap
        so heavy maintenance runs on chosen/idle nodes., 'Backup PVC configuration
        via a new ConfigMap: allow read-only mounting of backupPVCs (can speed up
        expose on some storage like Ceph) and choose a different StorageClass for
        backupPVCs.', Backup repository cache sizing via a new backup repository ConfigMap
        (cacheLimit) to reduce pod eviction risk due to ephemeral storage usage.,
      'Performance improvements: fix plugin-call memory leak; pass client QPS/burst
        to plugins; include Kopia upstream enhancements to reduce memory during maintenance
        in large repos.']
    breaking_changes: ['Restic uploader path for filesystem backups is deprecated
        starting 1.15; backups/restores still succeed but emit warnings when Restic
        is used (e.g., --uploader-type=restic).', node-agent ConfigMap name is no
        longer fixed; if you customize it you must set the server parameter node-agent-configmap
        accordingly., Repository maintenance job settings are moving from Velero server
        flags to a repository maintenance job ConfigMap; flags remain for compatibility
        but ConfigMap values take precedence., The 'change PVC selected-node' feature
        is now deprecated and should not be relied on; it will be removed in a future
        release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: [Repository maintenance for kopia/restic is moved out of the Velero
        server pod into a separate Kubernetes Job to avoid Velero OOM during repo
        maintenance; resources for the job become configurable., Restore workflow
        gains a new **Finalizing** phase; some PV patching and hook execution timing
        changes happen here., CSI plugin code is now merged into the Velero core repo
        and is installed by default as an internal plugin (do not install it separately).,
      Default CPU/memory requests/limits for the **node-agent** are removed; node-agent
        pods become BestEffort unless you set resources explicitly., 'Namespace filtering
        behavior changes when using label selectors without included/excludedNamespaces:
        only namespaces containing matched resources are included.']
    features: [Repo maintenance now runs as a separate Job to prevent velero server
        OOM during kopia repository maintenance; you can tune job resources., 'VolumePolicies
        now support actions like `fs-backup` and `snapshot` for per-volume backup
        method selection, enabling opt-in/out without changing workloads.', Data mover
        backup supports node selection via ConfigMap to constrain where datamover
        pods can run., Restore now persists VolumeInfo metadata and `velero restore
        describe` shows richer volume handling details., 'Restores include a new `Finalizing`
        phase to fix ordering issues (e.g., PV labels restored after data restore;
        post-restore hooks after datamovement).', Azure now supports certificate-based
        Service Principal auth in addition to secret-based SP auth.]
    breaking_changes: [CSI plugin is bundled with Velero in v1.14 and should not be
        installed via `--plugins`; remove external CSI plugin installs to avoid duplication/conflicts.,
      Node-agent default resource requests/limits are removed; clusters relying on
        previous defaults must set explicit resources to avoid starvation/eviction
        risks., 'Backup namespace selection changes when using labelSelector/OrLabelSelectors
        without included/excludedNamespaces: namespaces with no matching items are
        excluded (previously all namespaces were included).', 'PV patching during
        the new Restore `Finalizing` phase can cause restores to become `PartiallyFailed`
        when PVs are stuck `Pending`, where they might previously report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['CSI Snapshot Data Movement: can move CSI snapshot contents out of
        the source cluster/storage into durable backup storage and restore later (including
        cross-environment/cloud scenarios).', 'Resource Modifiers (JSON Substitutions):
        define match filters and JSON patch operations to mutate resources during
        restore without writing a custom RestoreItemAction plugin.', 'Multiple VolumeSnapshotClasses
        support in the Velero CSI plugin: allows choosing a specific VolumeSnapshotClass
        per backup instead of relying on a single labeled class.', 'Restore finalizer
        cleanup: `velero restore delete` now also cleans up restore-associated data
        in the backup storage location.', 'Runtime/deps refresh: Golang bumped to
        1.20.7 and Kopia bumped to 0.13.x along with other dependency updates.']
    breaking_changes: ['Default `uploader-type` changes from `restic` to `kopia`,
        which can change filesystem-backup behavior and repository expectations if
        you relied on restic defaults.', 'CSI snapshot timing/timeout behavior changed:
        snapshot handle creation uses `backup.spec.csiSnapshotTimeout` (was a fixed
        10m) and ReadyToUse waiting uses operation timeouts (default 4h).', Helm chart
        v4.0.0+ supports multiple BackupStorageLocations (BSL) and VolumeSnapshotLocations
        (VSL) and changes their values schema from map to slice; this is not backward
        compatible and should be migrated before upgrading., Finalizers added to Velero
        CRs (restore/dataupload/datadownload) can cause `kubectl delete namespace
        velero` to hang; use `velero uninstall` or remove/handle finalizers before
        namespace deletion.]
  chart_version: 5.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.12.3']
