- version: 1.17.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized file-system backup (fs-backup) to a micro-service architecture,
        enabling better concurrency control, cancel/resume, improved robustness across
        node-agent restarts, and steadier resource usage.', fs-backup now supports
        Windows clusters by allowing data mover pods to run on Windows nodes for backing
        up/restoring Windows volumes., Beta support for Kubernetes VolumeGroupSnapshot
        for coordinated point-in-time snapshots across multiple volumes (for CSI snapshot
        backup and CSI snapshot data movement)., 'PriorityClass support across Velero
        components (server, node-agent, data mover pods, and backup repository maintenance
        jobs) with separate configuration per module.', 'Scalability/resiliency improvements
        for data movers, including a node-agent PrepareQueueLength to throttle creation
        of data mover pods and better resume/cancel behavior across node-agent restarts.',
      'CSI snapshot data movement restore now supports node-selection like backup,
        including per-storage-class node selection constraints.', Resource policies
        now support reusable include/exclude filters via includeExcludePolicy in addition
        to volumePolicy., 'Operational improvements such as BSL availability metrics/status
        checks, imagePullSecrets inheritance for data mover/maintenance jobs, parameterized
        kubelet mount path, optional disabling of node-agent hostPath mounts, third-party
        tolerations for data mover pods, and s390x binary support.']
    breaking_changes: ['Restic uploader path is removed for new backups: --uploader-type=restic
        is no longer a valid install configuration. Restores from existing Restic-path
        backups remain supported only until v1.19.', Repository maintenance job configuration
        flags were removed from the Velero server (--keep-latest-maintenance-jobs
        and related CPU/memory request/limit flags); configuration is now expected
        via a repository maintenance job ConfigMap., 'PVC restore behavior change:
        selected-node annotation is always removed when no node mapping exists (previously
        it could be preserved if the node existed).']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero components (node-agent, data mover
        pods, maintenance jobs) can run on Windows nodes and back up/restore Windows
        workloads; includes new hybrid/multi-arch/all-in-one image build.', 'Parallel
        ItemBlock backup: Velero can now process ItemBlocks concurrently via a worker
        pool; configurable with the new `--item-block-worker-count` server flag (default
        1).', 'Data mover restore scalability for WaitForFirstConsumer volumes: node-agent
        config gains `ignoreDelayBinding` to allow restores to spread across nodes
        instead of being constrained to the attach node.', 'Improved data mover observability:
        richer status/error logging for intermediate objects and cleanup failures,
        enabled by default in node-agent logs.', 'CSI snapshot usability improvement:
        VolumeSnapshotContent objects that were previously retained/synced/restored
        unnecessarily are no longer included in backups.', 'BackupRepository maintenance
        resiliency/observability: BackupRepository CR now exposes `RecentMaintenance`
        history; maintenance jobs are re-captured after server restart; maintenance/init
        are skipped for readOnly BSLs; configurable Kopia GC intervals via `fullMaintenanceInterval`
        (normal/fast/eager).', 'Volume Policy enhancement: filter volumes by PVC labels
        (in addition to prior criteria).', 'Object-level restore status control: per-object
        annotation `velero.io/restore-status` determines whether resource status is
        restored for that object.', 'Image packaging change: velero, velero-helper,
        and velero-restore-helper binaries are now bundled into the single `velero/velero`
        image.']
    breaking_changes: [No explicit breaking changes were called out in the v1.16.0
        notes provided; validate any operational assumptions around helper images
        and new parallelism flags before upgrading.]
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI snapshot data movement shifts from node-agent
        pods to dedicated per-backup/restore pods, improving security (no hostPath),
        resource control, and resilience.', 'Item Block concepts and new ItemBlockAction
        (IBA) plugin to group related resources (built-in for Pods and PVCs, extensible)
        to enable future parallelized backups; 1.15 supports the model but not multi-threaded
        execution yet.', 'Node selection for repository maintenance jobs via a new
        repository maintenance configMap, allowing scheduling on specific/idle nodes.',
      'Backup PVC configuration via configMap: support read-only mounting to speed
        expose on some storage backends (e.g., Ceph) and specify the storage class
        used for backupPVCs.', Backup repository cache limit configuration via a new
        configMap to control per-repository client-side cache/ephemeral storage usage
        and avoid eviction., 'Performance improvements: fixes a server memory leak
        after plugin calls, passes client-qps/burst to plugins, and includes upstream
        Kopia improvements reducing memory usage for large repositories.']
    breaking_changes: ['Restic for filesystem backups is deprecated starting 1.15:
        backups/restores still work but emit warnings when restic uploader type is
        used or restic path is exercised; plan migration toward kopia.', Node-agent
        configuration configMap name is no longer fixed; you must set the server parameter
        `--node-agent-configmap` if using a non-default name., 'Repository maintenance
        job settings are moving from server CLI flags to the new repository maintenance
        configMap; configMap values take precedence when both are set, though flags
        remain for compatibility.', Changing PVC selected-node feature is deprecated
        and should not be relied upon; expect removal in a future release.]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Moves kopia/restic backup repository maintenance out of the Velero
        server pod into separate Kubernetes Jobs to avoid OOMs; resources for these
        jobs can be specified during install/upgrade., 'Extends VolumePolicies to
        support additional actions (e.g., `fs-backup` and `snapshot`) for finer-grained
        per-volume backup behavior without changing workloads.', Adds node selection
        for data-movement (datamover) pods via a ConfigMap so resource-heavy datamover
        workloads can be scheduled onto eligible nodes., Persists VolumeInfo metadata
        for restores (similar to backups) and enhances `velero restore describe` output
        with per-volume handling details., Introduces a new `Finalizing` phase in
        restore workflow to ensure PV patching and post-restore hooks happen after
        data restore/datamovement completes., Adds certificate-based (SPN cert) authentication
        support for Azure in addition to secret/password-based auth.]
    breaking_changes: [CSI plugin code is now merged into the core Velero repo and
        is installed by default as an internal plugin; do not install the CSI plugin
        separately via `--plugins`., 'Default resource requests/limits for the node-agent
        are removed, making node-agent pods BestEffort by default; you may need to
        set explicit resources if you relied on previous defaults.', 'Namespace filtering
        behavior changes: if `includedNamespaces`/`excludedNamespaces` are unset but
        `labelSelector`/`orLabelSelectors` are set, only namespaces containing matching
        resources are included (previously all namespaces were included).', 'With
        the new restore `Finalizing` phase, PV patching can cause restores to end
        in `PartiallyFailed` if a PV is blocked `Pending`; previously such cases might
        still report `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
