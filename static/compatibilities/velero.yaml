  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, enabling concurrency
        control, cancel/resume, better isolation, and steadier node-agent resource
        usage.', fs-backup now supports Windows clusters by running data mover pods
        on Windows nodes for volume backup/restore., Adds (beta) Kubernetes VolumeGroupSnapshot
        support for point-in-time consistent snapshots across multiple volumes (for
        CSI snapshot backup and data movement)., 'Adds PriorityClass configuration
        support across Velero components (server, node-agent, data movers, and repo
        maintenance jobs).', 'Improves data mover scalability/resiliency: queue length
        to limit pending pod creation, survive node-agent restarts, and better node
        selection (including per StorageClass) for CSI snapshot data movement restores.',
      Resource policies gain reusable include/exclude filters via includeExcludePolicy
        (in addition to volumePolicy).]
    breaking_changes: ['Restic uploader is removed for fs-backup: --uploader-type=restic
        is no longer a valid install configuration; restores from existing restic-path
        backups are supported only until v1.19.', Repository maintenance job settings
        are removed from velero server flags and moved to a ConfigMap; the corresponding
        --maintenance-job-* and --keep-latest-maintenance-jobs flags are no longer
        accepted., 'Behavior change during PVC restore: Velero now always removes
        selected-node annotation when no node mapping exists; previously it was preserved
        if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support (hybrid/multi-arch build, runs on Windows
        nodes, and built-in data mover can back up/restore Windows workloads end-to-end).',
      Parallel Item Block backup with configurable worker pool via `--item-block-worker-count`
        to increase backup throughput on large resource sets., Data mover restore
        scalability improvement for WaitForFirstConsumer volumes via node-agent config
        `ignoreDelayBinding` to spread restores across nodes., 'Improved data mover
        observability: more intermediate-object status/error logging, including cleanup
        failures, enabled by default in node-agent logs.', 'CSI snapshot usability
        improvement: stop retaining/restoring unnecessary VolumeSnapshotContent objects,
        reducing cross-cluster sync noise.', 'Backup repository maintenance improvements:
        maintenance history (`RecentMaintenance`) on BackupRepository CR, recapture
        jobs after server restart, skip maintenance/init for readOnly BSLs, configurable
        kopia full maintenance interval (`fullMaintenanceInterval`: normalGC/fastGC/eagerGC).',
      Volume Policy can now filter volumes by PVC labels (and related extensions around
        CSI PV attributes in resource policies)., Per-object resource status restore
        control via `velero.io/restore-status` annotation., 'Velero helper and restore-helper
        binaries are now shipped inside the single `velero/velero` image, simplifying
        images to manage.']
    breaking_changes: ['Restic/fs-backup deprecation path continues from 1.15: Windows
        workloads do not support fs-backup, and fs-backup is restricted to Linux nodes
        only; plan migration to the supported uploader paths.', 'Operational change:
        backups may run with higher concurrency due to parallel ItemBlock processing;
        if you enable `--item-block-worker-count` >1, expect increased API server
        load and adjust QPS/burst/resources accordingly.', 'Behavioral change for
        CSI backups: VolumeSnapshotContent objects previously retained are no longer
        included, which may affect any external processes that expected them in backups.']
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI Snapshot Data Movement transfers move
        from node-agent pods into dedicated per-backup/per-restore pods (backupPods/restorePods),
        improving security (no hostPath), resiliency, and allowing per-operation resource
        tuning.', "Item Block + ItemBlockAction (IBA) plugin framework: introduces\
        \ grouping of related resources into \u201Citem blocks\u201D and a new IBA\
        \ plugin type (built-ins for Pods/PVCs). Multi-threaded processing is not\
        \ enabled yet in 1.15, but the model is in place for future concurrency improvements.",
      'Repository maintenance node selection: adds a new repository maintenance configMap
        to steer maintenance jobs onto specific nodes and avoid busy/critical nodes.',
      'Backup PVC configuration for data mover: can mount backupPVC read-only for
        faster expose (notably on Ceph) and can choose a different StorageClass for
        backupPVCs than workload PVCs.', 'Backup repository cache sizing: new backup
        repository configMap option to cap client-side cache usage per repository
        and avoid eviction from ephemeral storage pressure.', 'Performance improvements:
        fixes a server memory leak after plugin calls; passes client QPS/burst settings
        to plugins; includes Kopia upstream enhancements reducing memory usage during
        maintenance in repositories with many files.', 'Operational/CLI enhancements:
        restore describe can show resource modifiers; adds labels to maintenance job
        pods; adds more descriptive restore errors and other robustness fixes.']
    breaking_changes: ['Restic is deprecated for filesystem backups starting in 1.15:
        backups/restores still succeed, but warnings appear when using `--uploader-type=restic`
        or when restic-based fs-backup paths are exercised; plan a migration away
        from restic.', "node-agent configMap name is no longer implicitly fixed: if\
        \ you customize the configMap name you must set the node-agent server parameter\
        \ `node-agent-configmap` accordingly, otherwise Velero won\u2019t find node-agent\
        \ settings.", Repository maintenance job settings are moving from Velero server
        flags into a new repository maintenance job configuration configMap; existing
        flags remain for backward compatibility but configMap values take precedence
        when both are set., "The \u201CChanging PVC selected-node\u201D feature is\
        \ now deprecated and will be removed in a future release; avoid new dependencies\
        \ on it."]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Repository maintenance for kopia/restic repositories is now executed
        in separate Kubernetes Jobs to reduce Velero server pod memory pressure; users
        can set resource requests for these jobs during install., 'VolumePolicies
        now support an "action" field to choose per-volume backup method (e.g., fs-backup
        vs snapshot), enabling finer-grained opt-in/opt-out control without modifying
        workloads.', Data mover backup supports node selection via a ConfigMap to
        restrict/target which nodes can run data mover pods., Restore operations now
        persist VolumeInfo metadata for restored volumes and `velero restore describe`
        surfaces more volume details., Restore workflow adds a new "Finalizing" phase
        so PV relabeling and post-restore hooks occur after volume data movement/snapshot
        restore completes., Azure authentication adds support for certificate-based
        service principal auth as an alternative to secret-based credentials.]
    breaking_changes: [CSI plugin is now merged into the Velero repo and installed
        by default as an internal plugin; do not install it via `--plugins` during
        `velero install` in v1.14., 'Default resource requests/limits for the node-agent
        DaemonSet were removed, making pods BestEffort; you may need to explicitly
        set resources if you relied on prior defaults.', 'Backup namespace filtering
        changes when `includedNamespaces`/`excludedNamespaces` are unset but label
        selectors are used: namespaces with no matching resources are now excluded
        (previously all namespaces were included).', PV patching during the new Restore
        "Finalizing" phase can cause restores to end PartiallyFailed if a PV is stuck
        Pending; older versions could report Complete in this scenario.]
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
