  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized fs-backup to a micro-service architecture, enabling concurrency
        control, cancel/resume, better robustness across node-agent restarts, and
        steadier node-agent resource usage.', 'fs-backup now supports Windows workloads
        by running data mover pods on Windows nodes; combined with existing CSI snapshot
        data movement support, this enables end-to-end Windows backup/restore scenarios.',
      'Beta support for Kubernetes Volume Group Snapshots (VGS) for both CSI snapshot
        backup and CSI snapshot data movement, enabling crash-consistent, write-order-consistent
        snapshots across multiple related volumes.', 'PriorityClass support across
        Velero components (server, node-agent, data movers, and repository maintenance
        jobs) so backup/restore and related workloads can be scheduled with explicit
        priority.', 'Scalability/resiliency improvements for data movers: configurable
        node-agent PrepareQueueLength to avoid creating excessive pending pods, improved
        resume/cancel behavior across node-agent restarts, and expanded node-selection
        controls including per-storage-class selection for CSI snapshot data movement
        restores.', 'Resource policy enhancements: add includeExcludePolicy to make
        reusable include/exclude resource filters via a resource policy ConfigMap.',
      'Operational/security/UX improvements: BSL availability gauge metric and status
        checks, imagePullSecrets inheritance for data mover and maintenance jobs,
        parameterized kubelet mount path, optional ResticIdentifier for kopia repos,
        better hook tracking, and safer credential file permissions.']
    breaking_changes: ['Restic uploader path removed: `--uploader-type=restic` is
        no longer valid for new installs/backups in v1.17 (restores from older Restic
        backups still supported until v1.19).', Repository maintenance job settings
        removed from Velero server flags; they must be configured via the repository
        maintenance job ConfigMap instead (flags like --keep-latest-maintenance-jobs
        and maintenance job CPU/memory request/limit are gone)., 'PVC restore behavior
        change: selected-node annotation is always removed when no node mapping exists;
        previously it could be preserved if the node existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
