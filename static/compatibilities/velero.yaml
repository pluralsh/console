  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Modernized file-system backup (fs-backup) into a micro-service architecture,
        adding concurrency control, cancel/resume, better robustness across node-agent
        restarts, and steadier resource usage.', fs-backup now supports Windows clusters
        by running data mover pods on Windows nodes to back up/restore Windows volumes.,
      Adds beta support for Kubernetes VolumeGroupSnapshot for both CSI snapshot backups
        and CSI snapshot data movement to improve write-order consistency across multiple
        volumes., 'Adds PriorityClass support across Velero components (server, node-agent,
        data mover pods, and backup repository maintenance jobs).', 'Improves data
        mover scalability/resiliency with node-agent PrepareQueueLength to throttle
        pod creation, plus better resume/cancel handling across node-agent restarts.',
      Adds reusable resource policy include/exclude filters via includeExcludePolicy
        in the resource policy ConfigMap.]
    breaking_changes: ['Restic uploader path is removed for new backups: --uploader-type=restic
        is no longer valid in v1.17 (restores from old restic backups remain supported
        until v1.19).', Repository maintenance job settings are no longer configurable
        via Velero server flags; the related --maintenance-job-* and --keep-latest-maintenance-jobs
        flags are removed in favor of a maintenance job ConfigMap., 'Behavior change
        during PVC restore: Velero now always removes the selected-node annotation
        when no node mapping exists; previously it could be preserved if the node
        existed.']
  chart_version: 11.4.0
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'docker.io/velero/velero:v1.17.1']
- version: 1.17.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: ['Velero v1.17 modernizes fs-backup to a micro-service architecture
        (new controllers/pods for PVB/PVR data paths), improving concurrency control,
        cancel/resume behavior, and steadier node-agent resource usage.', 'Windows
        coverage expands: fs-backup now supports Windows workloads; additional Windows
        tolerations added.', 'Adds Kubernetes VolumeGroupSnapshot (beta upstream)
        support for CSI snapshot backup and CSI snapshot data movement, including
        documentation and label-key configuration.', 'Adds PriorityClassName support
        across server, node-agent, data mover pods, and repository maintenance jobs.',
      Adds node-agent load-soothing via PrepareQueueLength to limit how many data-mover-related
        pods are created/pending at once., 'Improves resiliency: data movements (PVB/PVR,
        DU/DD) can resume after node-agent restarts; cancellation/orphan handling
        improved; server restart handling improved.', Adds resource policy includeExcludePolicy
        support (reusable include/exclude filters in a resource policy ConfigMap).,
      Removes Restic as a valid uploader type for new installs/backups; retains restore
        compatibility until v1.19 via legacy PVR controller., Moves repository maintenance
        job configuration from velero server flags to a ConfigMap; server flags removed
        accordingly., 'Behavior change: during PVC restore, selected-node annotation
        is now always removed when no node mapping exists (previously might be preserved).',
      'Dependency bumps: Go 1.24.6, Kopia 0.21.1; various controller/runtime/library
        updates and observability/metrics additions (e.g., BSL availability gauge,
        BSL status checks).']
    features: ['Modernized fs-backup to a micro-service architecture with concurrency
        control and improved resiliency (cancel/resume, survive node-agent restarts).',
      fs-backup now supports backing up/restoring Windows workloads., Supports Kubernetes
        VolumeGroupSnapshot for consistent point-in-time snapshots across multiple
        volumes (CSI snapshot + CSI data movement)., PriorityClass support across
        Velero components so workloads can be scheduled with appropriate priority.,
      Node-agent PrepareQueueLength to throttle data-mover pod creation and reduce
        Pending pod storms in large clusters., Resource policy now supports reusable
        include/exclude filters via includeExcludePolicy.]
    breaking_changes: ['Restic deprecation: `--uploader-type=restic` is no longer
        a valid install configuration in v1.17; you can still restore older Restic-based
        backups until v1.19.', Repository maintenance job settings removed from Velero
        server flags and must be configured via the maintenance job ConfigMap instead.,
      'PVC restore behavior change: `selected-node` annotation is always removed when
        no node mapping exists (previously could be preserved if the node existed).']
  chart_version: 11.3.2
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.17.1']
- version: 1.16.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Windows cluster support: Velero components (node-agent, data mover
        pods, maintenance jobs) can run on Windows nodes and Velero can back up/restore
        Windows workloads; fs-backup remains Linux-only and Windows has some metadata
        limitations.', 'Parallel ItemBlock backup: backup engine can process ItemBlocks
        concurrently to improve throughput; controlled via new server flag `--item-block-worker-count`
        (default 1).', 'Data mover restore scalability for WaitForFirstConsumer PVCs:
        new node-agent config flag `ignoreDelayBinding` allows spreading restores
        across nodes instead of pinning to the attachment node.', 'Improved observability
        for data mover: node-agent logs now include intermediate object status on
        failures and errors during cleanup of intermediate objects.', 'CSI snapshot
        backup/restore usability: VolumeSnapshotContent objects that were previously
        retained/synced/restored unnecessarily are now removed from backups to reduce
        noise and cross-cluster syncing.', 'Backup repository maintenance improvements:
        BackupRepository CR now tracks recent maintenance history; maintenance jobs
        are recaptured after server restarts; maintenance/init are skipped for readOnly
        BSLs; configurable `fullMaintenanceInterval` supports normal/fast/eager GC
        modes.', 'Volume Policy enhancement: can filter volumes by PVC labels (in
        addition to prior criteria).', 'Per-object resource status restore control:
        annotation `velero.io/restore-status` allows opting in/out on individual objects.',
      'Image packaging change: `velero`, `velero-helper`, and `velero-restore-helper`
        are now shipped in the single `velero/velero` image.']
    breaking_changes: []
  chart_version: 10.1.3
  images: ['docker.io/bitnamilegacy/kubectl:1.37', 'velero/velero:v1.16.2']
- version: 1.15.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Data mover micro service: CSI snapshot data movement now runs in dedicated
        backup/restore pods instead of node-agent, improving security (no hostPath),
        per-operation resource control, and resilience.', Item Block + ItemBlockAction
        (IBA) plugin framework added to group related resources into blocks as groundwork
        for future multi-threaded backups., Repository maintenance job node selection
        and resource configuration introduced via a new repository maintenance ConfigMap;
        maintenance pods also get labels for easier scheduling/selection., Backup
        PVC configuration added (read-only mount option and storageClass override)
        to speed up expose on some storage backends and tune how backupPVCs are provisioned.,
      Backup repository client-side cache limit is now configurable per repository
        via a new backup repository ConfigMap to avoid ephemeral-storage eviction.,
      'Performance improvements: fixed a post-plugin-call memory leak; plugin executions
        inherit client QPS/burst; Kopia maintenance memory usage improved via upstream
        Kopia updates.']
    breaking_changes: [Restic filesystem-backup path is now deprecated; backups/restores
        still work but emit warnings when restic uploader is used or restic path is
        exercised., node-agent ConfigMap name is no longer fixed; if you customize
        it you must pass the name via the node-agent server parameter `node-agent-configmap`.,
      'Repository maintenance settings are migrating from Velero server flags to the
        new repository maintenance ConfigMap; if both are set, the ConfigMap takes
        precedence.', Changing PVC selected-node feature is deprecated and should
        not be relied on (scheduled for removal in a future release).]
  chart_version: 8.7.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.15.2']
- version: 1.14.0
  kube: ['1.37', '1.36', '1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28',
    '1.27', '1.26', '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: [Repository maintenance for kopia/restic backup repositories now runs
        in separate Kubernetes Jobs to avoid Velero server OOM during maintenance;
        resource requests for these Jobs can be set during install., 'VolumePolicies
        now support explicit per-volume backup action selection (e.g., `fs-backup`
        vs `snapshot`) to enable fine-grained opt-in/opt-out without changing workloads.',
      Data mover pods (data movement backups) can be scheduled only on eligible nodes
        via a ConfigMap-based node selection mechanism., Restore operations now persist
        VolumeInfo metadata (similar to backup VolumeInfo introduced in 1.13) and
        `velero restore describe` surfaces more detailed volume information., Restores
        gain a new `Finalizing` phase to ensure PV label/patch restoration and to
        run post-restore hooks after data movement completes., Azure gains certificate-based
        (phishing-resistant) service principal authentication support; Azure SDKs
        were also modernized.]
    breaking_changes: [CSI plugin is merged into the core Velero repo in v1.14 and
        is installed by default as an internal plugin; you must not install it via
        the `--plugins` flag anymore., Default resource requests/limits for node-agent
        are removed so node-agent pods run with QoS class `BestEffort`; if you relied
        on prior defaults you must set resources explicitly., 'Namespace filtering
        behavior changes: if `includedNamespaces`/`excludedNamespaces` are unset and
        `labelSelector`/`orLabelSelectors` are set, backups include only namespaces
        containing matching resources (previously all namespaces were included).',
      'PV patching during the new restore `Finalizing` phase can cause restores to
        end `PartiallyFailed` when PVs are stuck `Pending`, where earlier versions
        might have reported `Complete`.']
  chart_version: 7.2.2
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.14.1']
- version: 1.13.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
  incompatibilities: []
  summary:
    helm_changes: ''
    chart_updates: []
    features: ['Resource Modifiers gained JSON Merge Patch and Strategic Merge Patch
        support, enabling more flexible restore-time resource edits from the same
        ConfigMap rules.', Node-agent concurrency controls were added so you can cap/shape
        how many filesystem backup and CSI snapshot data-mover operations run per
        node (globally and per-node)., Kopia uploader now supports configurable parallel
        file upload options to speed up filesystem backups and CSI snapshot data movement.,
      Restores can optionally write sparse files for fs-restore and CSI snapshot data
        movement to improve performance/space usage in some cases., "`velero backup\
        \ describe` output was enhanced with a new \u201CBackup Volumes\u201D section\
        \ and now shows CSI snapshot data movement details.", 'Backups now write a
        new VolumeInfo metadata file in the repository to record PV/PVC volume backup
        method, snapshot info, and status; used to drive PV restore decisions.', Improved
        resilience of CSI snapshot data movement across Velero pod/node-agent restarts
        so operations are less likely to get stuck after restarts., Backup/restore
        hook execution details are now tracked in CR status (HooksAttempted/HooksFailed)
        and shown in describe output., AWS SDK for Go was bumped to v2 for better
        CPU/memory performance., Azure AD/Workload Identity support was extended to
        Kopia operations (filesystem backup/data mover/etc.) in addition to native
        snapshots., Runtime bumped to Go 1.21.6 and Kopia bumped to 0.15.0 (plus other
        dependency bumps for CVEs).]
    breaking_changes: ['CLI output change: `velero backup describe` reorganized/changed
        formatting; scripts parsing the old output may break.', 'API type change:
        `DataUploadSpec.DataMoverConfig` changed from `*map[string]string` to `map[string]string`;
        any custom tooling/controllers using this field must be updated.', '`velero
        install` now enables informer cache by default (previously disabled); this
        can increase Velero pod memory usage and may require raising memory limits
        or explicitly disabling via `--disable-informer-cache`.']
  chart_version: 6.7.0
  images: ['docker.io/bitnami/kubectl:1.37', 'velero/velero:v1.13.2']
- version: 1.12.0
  kube: ['1.35', '1.34', '1.33', '1.32', '1.31', '1.30', '1.29', '1.28', '1.27', '1.26',
    '1.25', '1.24', '1.23', '1.22', '1.21', '1.20', '1.19', '1.18']
  requirements: []
