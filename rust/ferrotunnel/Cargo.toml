[package]
name = "ferrotunnel-client"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ferrotunnel-client"

[dependencies]
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube = { version = "4.2", features = ["derive", "runtime"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ferrotunnel = "1.5.2"
