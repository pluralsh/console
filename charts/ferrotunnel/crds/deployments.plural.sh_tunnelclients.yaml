apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tunnelclients.deployments.plural.sh
spec:
  group: deployments.plural.sh
  names:
    kind: TunnelClient
    plural: tunnelclients
    singular: tunnelclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Id registered with the tunnel server
      jsonPath: '.spec.tunnelId'
      name: Tunnel ID
      type: string
    - jsonPath: '.status.conditions[?(@.type=="Ready")].status'
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: One local endpoint registered on the FerroTunnel server.
        properties:
          spec:
            description: Desired endpoint for this tunnel.
            properties:
              tunnelId:
                description: DNS label sent to the tunnel server and later used as the HTTP Host.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              upstream:
                description: Address the controller can reach from this cluster.
                properties:
                  host:
                    description: Host or IP of the local service.
                    minLength: 1
                    type: string
                  port:
                    description: TCP port of the local service.
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                required:
                - host
                - port
                type: object
            required:
            - tunnelId
            - upstream
            type: object
          status:
            description: Status of a TunnelClient. `Ready` is True once the tunnel id is registered.
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: TunnelClient
        type: object
    served: true
    storage: true
    subresources:
      status: {}
