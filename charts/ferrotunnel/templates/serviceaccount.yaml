apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ferrotunnel.serviceAccountName" . }}
  labels:
    app.kubernetes.io/part-of: plural-ferrotunnel
    {{- include "ferrotunnel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
