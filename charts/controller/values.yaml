global:
  additionalVolumes: ~
  additionalVolumeMounts: ~

disableAdditionalVolumes: false

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

consoleUrl: ~
fullnameOverride: console-operator

tokenSecretRef:
  create: false
  name: console-auth-token
  key: access-token
  token: CHANGEME

controllerManager:
  podLabels: {}
  podAnnotations: {}

  manager:
    args:
    - --health-probe-bind-address=:8081
    - --metrics-bind-address=127.0.0.1:8080
    - --leader-elect
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: ghcr.io/pluralsh/deployment-controller
      tag: ~
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 1.5Gi
      requests:
        cpu: 50m
        memory: 200Mi
  replicas: 1
  serviceAccount:
    annotations: {}
imagePullSecrets: []
kubernetesClusterDomain: cluster.local

rbac:
  configMapsAndNamespaces:
    resources:
    - configmaps
    - namespaces
    verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
  secrets:
    resources:
    - secrets
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  deploymentsPlural:
    resources:
    - agentruntimepolicies
    - bindingpolicies
    - bootstraptokens
    - catalogs
    - cloudconnections
    - clusterrestores
    - clusterrestoretriggers
    - clusters
    - clustersyncs
    - compliancereportgenerators
    - customcompatibilitymatrices
    - customstackruns
    - deploymentsettings
    - federatedcredentials
    - flows
    - generatedsecrets
    - gitrepositories
    - globalservices
    - groups
    - helmrepositories
    - infrastructurestacks
    - managednamespaces
    - mcpservers
    - namespacecredentials
    - notificationrouters
    - notificationsinks
    - observabilityproviders
    - observers
    - oidcproviders
    - personas
    - pipelinecontexts
    - pipelines
    - policies
    - prautomations
    - prautomationtriggers
    - previewenvironmenttemplates
    - prgovernances
    - projects
    - providers
    - scmconnections
    - sentinels
    - sentineltriggers
    - serviceaccounts
    - servicecontexts
    - servicedeployments
    - stackdefinitions
    - upgradeplancallouts
    - workbenchcrons
    - workbenches
    - workbenchprompts
    - workbenchtools
    - workbenchwebhooks
    verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
    finalizerVerbs:
    - update
    statusVerbs:
    - get
    - patch
    - update
