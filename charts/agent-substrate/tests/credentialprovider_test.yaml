suite: credential providers
release:
  name: ate
  namespace: ate-system
capabilities:
  majorVersion: 1
  minorVersion: 34
templates:
  - templates/*.yaml
set:
  objectStore.snapshotLocation: s3://snapshots/ate/
tests:
  - it: atelet runs no image credential provider by default
    template: templates/atelet.yaml
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: atelet-image-credential-provider
          any: true
        not: true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --image-credential-provider-config=/etc/atelet/image-credential-provider/config.yaml
        documentSelector:
          path: kind
          value: DaemonSet

  - it: the ecr preset renders the ECR provider and mounts the EKS bin dir
    template: templates/atelet.yaml
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: ecr
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: ecr-credential-provider"
        documentSelector:
          path: metadata.name
          value: atelet-image-credential-provider
      - matchRegex:
          path: data["config.yaml"]
          pattern: "defaultCacheDuration: 12h"
        documentSelector:
          path: metadata.name
          value: atelet-image-credential-provider
      - matchRegex:
          path: data["config.yaml"]
          pattern: "apiVersion: credentialprovider.kubelet.k8s.io/v1"
        documentSelector:
          path: metadata.name
          value: atelet-image-credential-provider
      - contains:
          path: spec.template.spec.volumes
          content:
            name: image-credential-provider-bin
            hostPath:
              path: /etc/eks/image-credential-provider
              type: Directory
        documentSelector:
          path: kind
          value: DaemonSet

  - it: the gar preset renders auth-provider-gcp with its args
    template: templates/atelet.yaml
    documentSelector:
      path: metadata.name
      value: atelet-image-credential-provider
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: gar
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: auth-provider-gcp"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "- get-credentials"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "pkg.dev"

  - it: the acr preset mounts the node's azure.json
    template: templates/atelet.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: acr
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: azure-json
            hostPath:
              path: /etc/kubernetes/azure.json
              type: File
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: azure-json
            mountPath: /etc/kubernetes/azure.json
            readOnly: true

  - it: preset overrides replace matchImages, args and cache duration
    template: templates/atelet.yaml
    documentSelector:
      path: metadata.name
      value: atelet-image-credential-provider
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: ecr
      atelet.imageCredentialProvider.matchImages: ["123456789012.dkr.ecr.us-east-2.amazonaws.com"]
      atelet.imageCredentialProvider.defaultCacheDuration: 1h
      atelet.imageCredentialProvider.env:
        - name: AWS_PROFILE
          value: pull
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "123456789012.dkr.ecr.us-east-2.amazonaws.com"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "\\*\\.dkr\\.ecr"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "defaultCacheDuration: 1h"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "AWS_PROFILE"

  - it: the custom preset renders the providers verbatim
    template: templates/atelet.yaml
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: custom
      atelet.imageCredentialProvider.binDir: /opt/providers
      atelet.imageCredentialProvider.providers:
        - name: my-provider
          apiVersion: credentialprovider.kubelet.k8s.io/v1
          matchImages: ["registry.example.com"]
          defaultCacheDuration: 5m
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: my-provider"
        documentSelector:
          path: metadata.name
          value: atelet-image-credential-provider
      - contains:
          path: spec.template.spec.volumes
          content:
            name: image-credential-provider-bin
            hostPath:
              path: /opt/providers
              type: Directory
        documentSelector:
          path: kind
          value: DaemonSet

  - it: the custom preset needs providers and binDir
    template: templates/validate.yaml
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: custom
    asserts:
      - failedTemplate:
          errorPattern: custom

  - it: rejects an unknown preset
    template: templates/validate.yaml
    set:
      atelet.imageCredentialProvider.enabled: true
      atelet.imageCredentialProvider.preset: quay
    asserts:
      - failedTemplate:
          errorPattern: preset

  - it: egress gets the k8s.io provider by default
    template: templates/atenet-egress.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-name=k8s.io
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-address=k8s-credential-provider.ate-system.svc:50051
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-server-name=k8s-credential-provider.ate-system.svc

  - it: egress gets k8s.io and plural.sh providers in order
    template: templates/atenet-egress.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      atenet.egress.credentialProviders:
        - name: k8s.io
        - name: plural.sh
          address: devbox-gateway.plrl-deploy-operator.svc:50052
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-name=plural.sh
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-address=devbox-gateway.plrl-deploy-operator.svc:50052
      - contains:
          path: spec.template.spec.containers[?(@.name=="ext-proc")].args
          content: --credential-provider-server-name=devbox-gateway.plrl-deploy-operator.svc

  - it: the bundled k8s.io provider is skipped when not listed
    template: templates/k8s-credential-provider.yaml
    set:
      atenet.egress.credentialProviders:
        - name: plural.sh
          address: devbox-gateway.plrl-deploy-operator.svc:50052
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a non-k8s.io provider without an address
    template: templates/validate.yaml
    set:
      atenet.egress.credentialProviders:
        - name: plural.sh
    asserts:
      - failedTemplate:
          errorPattern: address

  - it: rejects duplicate provider names
    template: templates/validate.yaml
    set:
      atenet.egress.credentialProviders:
        - name: k8s.io
        - name: k8s.io
    asserts:
      - failedTemplate:
          errorPattern: listed twice
