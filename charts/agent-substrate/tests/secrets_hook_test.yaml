suite: secrets hook
release:
  name: ate
  namespace: ate-system
capabilities:
  majorVersion: 1
  minorVersion: 34
templates:
  - templates/*.yaml
set:
  objectStore.snapshotLocation: s3://snapshots/ate/
tests:
  - it: runs as a pre-install/pre-upgrade hook after its RBAC
    template: templates/secrets-hook.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: uses its own service account and the documented images
    template: templates/secrets-hook.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: agent-substrate-secrets
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: alpine/openssl:3.5.9
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/kubectl:1.37.2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_READ_WRITE_SECRET
            value: ate-postgres-readwrite

  - it: can't modify existing secrets (no update or delete, patch only for the derived bundle)
    template: templates/secrets-hook.yaml
    asserts:
      - equal:
          path: rules[1]
          value:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create"]
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: rules[0]
          value:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["actor-id-ca-certs"]
            verbs: ["patch"]
        documentSelector:
          path: kind
          value: Role

  - it: the apply script creates each secret only when absent
    template: templates/secrets-hook.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["apply.sh"]
          pattern: 'if kubectl get secret -n "\$ns" "\$name" >/dev/null 2>&1; then\n\s+echo "secret \$ns/\$name exists; keeping it"\n\s+return 0'
      - matchRegex:
          path: data["apply.sh"]
          pattern: AlreadyExists
      - notMatchRegex:
          path: data["apply.sh"]
          pattern: "kubectl (replace|delete)|--overwrite"
      - matchRegex:
          path: data["apply.sh"]
          pattern: "create_secret \"\\$NS\" actor-id-jwt-pool Opaque pool"
      - matchRegex:
          path: data["apply.sh"]
          pattern: "create_secret \"\\$PODCERT_NS\" postgres-ca-pool kubernetes.io/tls pool tls.crt tls.key"

  - it: the generate script produces every pool ate-setup creates
    template: templates/secrets-hook.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["generate.sh"]
          pattern: "jwt_pool actor-id-jwt-pool"
      - matchRegex:
          path: data["generate.sh"]
          pattern: "ca_pool actor-id-ca-pool p256"
      - matchRegex:
          path: data["generate.sh"]
          pattern: "ca_pool egress-mitm-ca-pool p256"
      - matchRegex:
          path: data["generate.sh"]
          pattern: "ca_pool service-dns-ca-pool ed25519"
      - matchRegex:
          path: data["generate.sh"]
          pattern: "ca_pool pod-identity-ca-pool ed25519"
      - matchRegex:
          path: data["generate.sh"]
          pattern: "ca_pool postgres-ca-pool ed25519"

  - it: external Postgres generates no read-write password
    template: templates/secrets-hook.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      postgres.mode: external
      postgres.external.readWrite.secretName: pg-dsn
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_READ_WRITE_SECRET
          any: true

  - it: passes the expected issuer through
    template: templates/secrets-hook.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      auth.expectedJWTIssuer: https://oidc.eks.us-east-2.amazonaws.com/id/ABC
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPECTED_JWT_ISSUER
            value: https://oidc.eks.us-east-2.amazonaws.com/id/ABC
