{{- if .Values.crds.install }}
{{- range $name := list "csidriverconfigs" "sandboxconfigs" "workerpools" }}
{{- $crd := $.Files.Get (printf "files/crds/ate.dev_%s.yaml" $name) | fromYaml }}
{{- $meta := $crd.metadata }}
{{- $annotations := $meta.annotations | default dict }}
{{- if $.Values.crds.keep }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
{{- $_ := set $meta "annotations" $annotations }}
{{- $_ := set $meta "labels" (merge ($meta.labels | default dict) (include "substrate.labels" $ | fromYaml)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
