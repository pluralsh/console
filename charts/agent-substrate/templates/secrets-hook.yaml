{{- /*
Generates the CA pools, the actor ID JWT pool, the Postgres read-write
password and ate-api-server's authentication config before every install and
upgrade. Existing secrets are never overwritten (files/scripts/apply.sh).
*/ -}}
{{- $ns := include "substrate.namespace" . -}}
{{- $podcertNs := include "substrate.podcertNamespace" . -}}
{{- $h := .Values.secretsHook -}}
{{- $name := "agent-substrate-secrets" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# Cluster-wide because the pod-certificate controller's namespace may not exist
# yet, so no RoleBinding can be placed in it. Deleted once the hook succeeds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["actor-id-ca-certs"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ate-api-authentication"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  generate.sh: |
    {{- .Files.Get "files/scripts/generate.sh" | nindent 4 }}
  apply.sh: |
    {{- .Files.Get "files/scripts/apply.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ $h.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- include "substrate.imagePullSecrets" . | nindent 6 }}
      {{- include "substrate.systemInfraScheduling" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate
          image: {{ $h.opensslImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/generate.sh"]
          env:
            - name: WORK
              value: /work
            - name: CA_VALIDITY_DAYS
              value: {{ $h.caValidityDays | toString | quote }}
            - name: JWT_ALGORITHM
              value: {{ .Values.auth.actorJWTAlgorithm }}
            - name: HOME
              value: /work
            {{- if eq .Values.postgres.mode "cnpg" }}
            - name: PG_READ_WRITE_SECRET
              value: {{ include "substrate.cnpg.readWriteSecret" . }}
            - name: PG_READ_WRITE_USER
              value: {{ .Values.postgres.readWriteUser }}
            {{- if .Values.juicefs.enabled }}
            - name: PG_JUICEFS_SECRET
              value: {{ include "substrate.juicefs.passwordSecret" . }}
            - name: PG_JUICEFS_USER
              value: {{ .Values.juicefs.postgres.user }}
            {{- end }}
            {{- end }}
            {{- if and .Values.zerofs.enabled (not .Values.zerofs.encryption.existingSecret.name) }}
            - name: ZEROFS_SECRET
              value: {{ include "substrate.zerofs.passwordSecret" . }}
            {{- end }}
          {{- with $h.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
      containers:
        - name: apply
          image: {{ $h.kubectlImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/apply.sh"]
          env:
            - name: WORK
              value: /work
            - name: HOME
              value: /work
            - name: NAMESPACE
              value: {{ $ns }}
            - name: PODCERT_NAMESPACE
              value: {{ $podcertNs }}
            - name: EXPECTED_JWT_ISSUER
              value: {{ .Values.auth.expectedJWTIssuer | quote }}
            {{- if eq .Values.postgres.mode "cnpg" }}
            - name: PG_READ_WRITE_SECRET
              value: {{ include "substrate.cnpg.readWriteSecret" . }}
            {{- if .Values.juicefs.enabled }}
            - name: PG_JUICEFS_SECRET
              value: {{ include "substrate.juicefs.passwordSecret" . }}
            {{- end }}
            {{- end }}
            {{- if and .Values.zerofs.enabled (not .Values.zerofs.encryption.existingSecret.name) }}
            - name: ZEROFS_SECRET
              value: {{ include "substrate.zerofs.passwordSecret" . }}
            {{- end }}
          {{- with $h.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}
        - name: work
          emptyDir:
            medium: Memory
