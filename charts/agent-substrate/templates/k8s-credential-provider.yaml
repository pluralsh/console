{{- if include "substrate.k8sCredentialProviderEnabled" . }}
{{- $ns := include "substrate.namespace" . -}}
{{- $v := .Values.k8sCredentialProvider -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-credential-provider
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-credential-provider-secret-reader
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-credential-provider-secret-reader
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: k8s-credential-provider
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: k8s-credential-provider-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
data:
  namespace-policy.yaml: |
    {{- dict "policies" ($v.namespacePolicies | default list) | toYaml | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-credential-provider
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: k8s-credential-provider
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-credential-provider
  namespace: {{ $ns }}
  labels:
    app: k8s-credential-provider
    {{- include "substrate.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      labels:
        app: k8s-credential-provider
        {{- include "substrate.systemInfraPodLabels" . | nindent 8 }}
      annotations:
        checksum/namespace-policy: {{ toYaml ($v.namespacePolicies | default list) | sha256sum }}
    spec:
      serviceAccountName: k8s-credential-provider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      {{- include "substrate.imagePullSecrets" . | nindent 6 }}
      {{- include "substrate.systemInfraScheduling" . | nindent 6 }}
      containers:
        - name: k8s-credential-provider
          image: {{ include "substrate.image" (dict "ctx" . "key" "kubernetesSecrets" "name" "kubernetes-secrets") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen-address=:50051
            - --metrics-address=:9090
            - --health-address=:9091
            - --status-address=127.0.0.1:4040
            - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
            - --client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem
            - --namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml
            - --log-level={{ .Values.logLevel }}
            - {{ include "substrate.previewArg" . }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: namespace-policy
              mountPath: /etc/k8s-credential-provider
              readOnly: true
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
      volumes:
        - name: namespace-policy
          configMap:
            name: k8s-credential-provider-namespace-policy
        {{- include "substrate.podCertVolume" (dict "name" "servicedns" "signer" "servicedns" "ca" true) | nindent 8 }}
        {{- include "substrate.podCertVolume" (dict "name" "podidentity" "signer" "podidentity" "ca" true) | nindent 8 }}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: atenet-egress
      ports:
        - protocol: TCP
          port: 50051
{{- end }}
{{- end }}
