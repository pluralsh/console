{{- /*
Stages the microvm sandbox binaries into the asset bucket at
microvm-assets/<arch>/<sha256> (what `ate-setup deploy sandboxconfig` does on
GCS/Kind), so atelet can fetch them. Backend-agnostic: it uploads through
gocloud.dev blob, so S3, GCS and Azure Blob all work. The pinned digests come
from the microvm SandboxConfig rendered below, and the Job fails if the
upstream releases don't match them. Idempotent: existing objects are skipped.
Runs as ate-api-server, so its object store access (apiServer.serviceAccount
annotations, or the EKS Pod Identity / IRSA binding for that name) covers
staging too and there is a single identity to grant bucket access to.
*/ -}}
{{- $a := .Values.assetStaging -}}
{{- $m := .Values.sandboxConfigs.microvm -}}
{{- if and $m.enabled $a.enabled }}
{{- $ns := include "substrate.namespace" . -}}
{{- $name := "agent-substrate-microvm-assets" -}}
{{- $bucketUrl := $a.bucketUrl | default (printf "%s://%s" $m.assetScheme $m.assetBucket) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  microvm.yaml: |
    {{- .Files.Get "files/sandboxconfig/microvm.yaml" | replace "${BUCKET_SCHEME}" $m.assetScheme | replace "${ASSET_BUCKET_NAME}" $m.assetBucket | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ $a.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: ate-api-server
      restartPolicy: OnFailure
      {{- include "substrate.imagePullSecrets" . | nindent 6 }}
      {{- include "substrate.systemInfraScheduling" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stage
          image: {{ $a.image }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/microvm-assets"]
          args:
            - --bucket-url={{ $bucketUrl }}
            - --sandboxconfig=/config/microvm.yaml
            - --arches={{ $a.arches | join "," }}
            - --work-dir=/work
            {{- with $a.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $a.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: work
          emptyDir:
            sizeLimit: {{ $a.workSize }}
        - name: tmp
          emptyDir: {}
{{- end }}
