{{- if .Values.ferrotunnel.enabled }}
{{- $host := .Values.ferrotunnel.host | default .Values.ingress.console_dns }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrotunnel.controlServiceName" . }}
  labels:
    {{- include "ferrotunnel.labels" . | nindent 4 }}
  {{- with $host }}
  annotations:
    plural.sh/ferrotunnel-host: {{ . | quote }}
  {{- end }}
spec:
  type: {{ .Values.ferrotunnel.service.type }}
  ports:
    - name: control
      port: {{ .Values.ferrotunnel.service.controlPort }}
      targetPort: control
      protocol: TCP
  selector:
    {{- include "ferrotunnel.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrotunnel.httpServiceName" . }}
  labels:
    {{- include "ferrotunnel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ferrotunnel.service.httpPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ferrotunnel.selectorLabels" . | nindent 4 }}
{{- end }}
