apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  annotations:
{{ include "console.annotations" . | nindent 4 }}
  labels:
{{ include "console.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{ if .Values.podLabels }}
        {{ toYaml .Values.podLabels | nindent 8 }}
        {{ end }}
      annotations:
      {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
      {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}

    spec:
      serviceAccountName: console
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
    {{- end }}
      {{ if .Values.console.securityContext }}
      securityContext:
      {{ toYaml .Values.console.securityContext | nindent 8 }}
      {{ end }}
      terminationGracePeriodSeconds: {{ .Values.shutdownDelay }}
      {{ if .Values.initContainers }}
      initContainers:
      {{ toYaml .Values.initContainers | nindent 6 }}
      {{- end }}
      containers:
      {{ if .Values.console.additionalContainers }}
      {{ toYaml .Values.console.additionalContainers | nindent 6 }}
      {{ end }}
      - name: auth
        {{ if .Values.console.containerSecurityContext }}
        securityContext:
        {{- toYaml .Values.console.containerSecurityContext | nindent 10 }}
        {{ end }}
        image: "{{ .Values.global.registry }}/{{ .Values.ociAuth.repository }}:{{ .Values.ociAuth.tag | default (printf "v%s" .Chart.AppVersion) }}"
        imagePullPolicy: {{ .Values.ociAuth.imagePullPolicy }}
        args:
        - --token-file=/shared/token
        volumeMounts:
        - name: conf-dir
          mountPath: /shared
        ports:
        - name: sidecar
          containerPort: 3000
          protocol: TCP
      - name: console
        {{ if .Values.console.containerSecurityContext }}
        securityContext:
        {{- toYaml .Values.console.containerSecurityContext | nindent 10 }}
        {{ end }}
        image: "{{ .Values.image.registry | default .Values.global.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.imagePullPolicy }}
        envFrom:
        - secretRef:
            name: console-env
        env:
        - name: KAS_SERVICE
        {{ if .Values.console.config.kasHost }}
          {{- if .Values.kas.tls.enabled }}
          value: {{ printf "https://%s" .Values.console.config.kasHost | quote }}
          {{- else }}
          value: {{ .Values.console.config.kasHost }}
          {{- end }}
        {{ else if and .Values.kas.tls.enabled .Values.kas.ingress.kas_dns }}
          value: {{ printf "https://%s" .Values.kas.ingress.kas_dns | quote }}
        {{ else }}
          {{- if .Values.kas.tls.enabled }}
          value: {{ printf "https://%s.%s:%v" (include "kas.serviceName" .) .Release.Namespace .Values.kas.service.kubernetesApiPort | quote }}
          {{- else }}
          value: {{ include "kas.serviceName" . }}.{{ .Release.Namespace }}:{{ .Values.kas.service.kubernetesApiPort }}
          {{- end }}
        {{ end }}
        {{- if and .Values.kas.tls.enabled (not .Values.console.config.kasHost) }}
        - name: KAS_INSECURE_SKIP_TLS_VERIFY
          value: "true"
        {{- end }}
        - name: REPLICAS
          value: {{ .Values.replicaCount | quote }}
        {{- if .Values.console.tls.enabled }}
        - name: CONSOLE_TLS_CERT_FILE
          value: /etc/plrl/tls.crt
        - name: CONSOLE_TLS_KEY_FILE
          value: /etc/plrl/tls.key
        {{- end }}
        {{ include "console.env" . | nindent 8 }}
        {{- if  .Values.extraEnv }}
        {{ toYaml .Values.extraEnv | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: temp-dir
          mountPath: /tmp
        - name: conf-dir
          mountPath: /shared
        - name: home-cache-dir
          mountPath: {{ .Values.homeDir }}/.cache
        {{- if .Values.console.tls.enabled }}
        - name: console-tls
          mountPath: /etc/plrl
          readOnly: true
        {{- end }}
        {{ if .Values.cloud.pgRootCert }}
        - mountPath: /opt/app/certs
          name: pg-cert
        {{ end }}
        {{ if .Values.cliContainer.enabled }}
        - name: cli-override
          mountPath: /usr/local/bin/plural
          subPath: plural
        {{- end }}
        {{- if or .Values.secrets.identity .Values.secrets.key }}
        - name: console-conf
          mountPath: {{ .Values.homeDir }}/.plural
        {{- end }}
        {{ if not .Values.disableAdditionalVolumes }}
        {{ if .Values.global.additionalVolumeMounts }}
        {{ toYaml .Values.global.additionalVolumeMounts | nindent 8 }}
        {{ end }}
        {{ end }}
        ports:
        - name: {{ ternary "https" "http" .Values.console.tls.enabled }}
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: epmd
          containerPort: 4369
          protocol: TCP
        - name: node
          containerPort: 6000
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        {{- $livenessProbe := deepCopy .Values.livenessProbe }}
        {{- $readinessProbe := deepCopy .Values.readinessProbe }}
        {{- if .Values.console.tls.enabled }}
        {{- if hasKey $livenessProbe "httpGet" }}
        {{- $_ := set $livenessProbe.httpGet "scheme" "HTTPS" }}
        {{- $_ := set $livenessProbe.httpGet "port" "https" }}
        {{- end }}
        {{- if hasKey $readinessProbe "httpGet" }}
        {{- $_ := set $readinessProbe.httpGet "scheme" "HTTPS" }}
        {{- $_ := set $readinessProbe.httpGet "port" "https" }}
        {{- end }}
        {{- end }}
        livenessProbe:
        {{ toYaml $livenessProbe | nindent 10 }}
        readinessProbe:
        {{ toYaml $readinessProbe | nindent 10 }}
        resources:
        {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: temp-dir
        emptyDir: { }
      - name: conf-dir
        emptyDir: { }
      - name: home-cache-dir
        emptyDir: { }
      {{- if .Values.console.tls.enabled }}
      - name: console-tls
        secret:
          secretName: {{ required "console.tls.existingSecret is required when console TLS is enabled" .Values.console.tls.existingSecret }}
          items:
          - key: {{ .Values.console.tls.certificateKey }}
            path: tls.crt
          - key: {{ .Values.console.tls.privateKeyKey }}
            path: tls.key
      {{- end }}
      {{ if .Values.cloud.pgRootCert }}
      - name: pg-cert
        secret:
          secretName: pg-root-cert
      {{ end }}
      {{ if .Values.cliContainer.enabled }}
      - name: cli-override
        emptyDir: { }
      {{ end }}
      {{- if or .Values.secrets.identity .Values.secrets.key }}
      - name: console-conf
        secret:
          secretName: console-conf
      {{- end }}
      {{ if .Values.global.additionalVolumes }}
      {{ toYaml .Values.global.additionalVolumes | nindent 6 }}
      {{ end }}
