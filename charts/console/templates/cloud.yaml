{{ if and .Values.cloud.enabled .Values.cloud.o11y.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-user
  namespace: {{ .Values.cloud.elasticNamespace }}
stringData:
  password: {{ .Values.cloud.esPassword }}
---
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchUser
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  credentialsRef:
    name: elasticsearch
  definition:
    user: plrl-{{ .Values.cloud.instanceName }}
    passwordSecretKeyRef:
      name: plrl-{{ .Values.cloud.instanceName }}-user
      key: password
    role:
      name: plrl-{{ .Values.cloud.instanceName }}
      clusterPermissions:
      - "monitor"
      indexPermissions:
      - names: ["plrl-{{ .Values.cloud.instanceName }}*"]
        privileges: [ "read", "index", "write", "create", "create_index", "manage", "manage_ilm" ]
---
{{/* Legacy ILM for dated indices */}}
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchILMPolicy
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-logs
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  name: plrl-{{ .Values.cloud.instanceName }}-logs
  credentialsRef:
    name: elasticsearch
  definition:
    policy:
      {{- toYaml .Values.cloud.o11y.ilm.logs | nindent 6 }}
---
{{/* Rollover ILM for plrl-{inst}-logs-00000N via write alias */}}
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchILMPolicy
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
  credentialsRef:
    name: elasticsearch
  definition:
    policy:
      {{- toYaml .Values.cloud.o11y.ilm.logsRollover | nindent 6 }}
---
{{/* Lower priority: dated / catch-all indices, legacy ILM */}}
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchIndexTemplate
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-logs
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  name: plrl-{{ .Values.cloud.instanceName }}-logs
  credentialsRef:
    name: elasticsearch
  definition:
    indexPatterns:
      - "plrl-{{ .Values.cloud.instanceName }}-logs-*"
    priority: 101
    template:
      settings:
        index:
          number_of_shards: 15
          refresh_interval: 30s
          lifecycle:
            name: plrl-{{ .Values.cloud.instanceName }}-logs
---
{{/* Higher priority: rolled indices plrl-{inst}-logs-0*, rollover ILM */}}
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchIndexTemplate
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
  credentialsRef:
    name: elasticsearch
  definition:
    indexPatterns:
      - "plrl-{{ .Values.cloud.instanceName }}-logs-0*"
    priority: 300
    template:
      mappings:
        properties:
          "@timestamp":
            type: date
      settings:
        index:
          number_of_shards: 5
          number_of_replicas: 1
          refresh_interval: 30s
          sort.field: "@timestamp"
          sort.order: desc
          lifecycle:
            name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
            rollover_alias: plrl-{{ .Values.cloud.instanceName }}-logs-write
---
apiVersion: dbs.plural.sh/v1alpha1
kind: ElasticsearchIndex
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-000001
  namespace: {{ .Values.cloud.elasticNamespace }}
spec:
  name: plrl-{{ .Values.cloud.instanceName }}-logs-000001
  credentialsRef:
    name: elasticsearch
  definition:
    aliases:
      plrl-{{ .Values.cloud.instanceName }}-logs-write:
        is_write_index: true
    mappings:
      properties:
        "@timestamp":
          type: date
    settings:
      index:
        number_of_shards: 5
        number_of_replicas: 1
        refresh_interval: 30s
        sort.field: "@timestamp"
        sort.order: desc
        lifecycle:
          name: plrl-{{ .Values.cloud.instanceName }}-logs-rollover
          rollover_alias: plrl-{{ .Values.cloud.instanceName }}-logs-write
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: plrl-{{ .Values.cloud.instanceName }}
  namespace: monitoring
spec:
  password: {{ .Values.cloud.vmPassword }}
  targetRefs:
  - crd:
      kind: VMCluster/vminsert
      name: vm-cluster
      namespace: monitoring
    paths:
    - "/insert/{{ .Values.cloud.vmTenant }}/.*"
  - crd:
      kind: VMCluster/vmselect
      name: vm-cluster
      namespace: monitoring
    paths:
    - "/select/{{ .Values.cloud.vmTenant }}/.*"
{{ end }}
