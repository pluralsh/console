{{- if include "pseudofs.enabled" . }}
{{- $store := .Values.console.config.objectStore }}
{{- $provider := include "objectStore.provider" . | trim }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pseudofs.fullname" . }}-env
  labels:
    {{- include "pseudofs.labels" . | nindent 4 }}
type: Opaque
data:
{{- if eq $provider "s3" }}
  {{- with $store.s3.accessKey }}
  AWS_ACCESS_KEY_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $store.s3.secretKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- else if eq $provider "azure" }}
  {{- with $store.azure.accessKey }}
  AZURE_STORAGE_ACCOUNT_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- else if include "pseudofs.gcsKey" . }}
  GOOGLE_APPLICATION_CREDENTIALS: {{ "/var/run/gcs/credentials.json" | b64enc | quote }}
{{- end }}
{{- if include "pseudofs.gcsKey" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pseudofs.fullname" . }}-gcs
  labels:
    {{- include "pseudofs.labels" . | nindent 4 }}
type: Opaque
data:
  credentials.json: {{ $store.gcs.credentials | b64enc | quote }}
{{- end }}
{{- end }}
