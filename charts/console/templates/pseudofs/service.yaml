{{- if include "pseudofs.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pseudofs.fullname" . }}
  labels:
    {{- include "pseudofs.labels" . | nindent 4 }}
  {{- with .Values.pseudofs.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "pseudofs.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.pseudofs.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
