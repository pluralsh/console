{{- if and .Values.networkPolicy.enabled (include "pseudofs.enabled" .) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pseudofs.fullname" . }}
  labels:
    {{- include "pseudofs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pseudofs.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: console
          app.kubernetes.io/instance: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: {{ .Values.pseudofs.service.port }}
{{- end }}
