{{- if .Values.ai.localEmbeddings.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: console-embedding-server
  labels:
    {{- include "embedding-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.ai.localEmbeddings.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "embedding-server.selectorLabels" . | nindent 4 }}
{{- end }}
