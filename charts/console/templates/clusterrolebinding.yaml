{{- $clusterRoleBindingEnabled := true }}
{{- with .Values.rbac }}
{{- with .clusterRoleBinding }}
{{- if hasKey . "enabled" }}
{{- $clusterRoleBindingEnabled = .enabled }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (not .Values.cloud.enabled) $clusterRoleBindingEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plrl-{{ .Release.Name }}-console-binding
subjects:
- kind: ServiceAccount
  name: console
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
