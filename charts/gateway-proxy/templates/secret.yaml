{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-proxy.secretName" . }}
  labels:
    {{- include "gateway-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  PROXY_API_KEY: {{ required "secrets.apiKey is required unless secrets.existingSecret is set" .Values.secrets.apiKey | b64enc | quote }}
  OAUTH_CLIENT_SECRET: {{ required "secrets.clientSecret is required unless secrets.existingSecret is set" .Values.secrets.clientSecret | b64enc | quote }}
{{- end }}
