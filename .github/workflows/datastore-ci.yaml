name: CI / Datastore
on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/datastore-ci.yaml"
      - "go/datastore/**"
      - "go/polly/**"
      - "go/client/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/datastore-ci.yaml"
      - "go/datastore/**"
      - "go/polly/**"
      - "go/client/**"
permissions:
  contents: read
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  test:
    needs: [vouch]
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/datastore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/datastore/go.mod
          cache-dependency-path: go/datastore/go.sum
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: PATH=$PATH:$GOPATH/bin make test
