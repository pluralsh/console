name: Fix ECK compatibility aggregate

on:
  push:
    branches:
      - feat/eck-operator-compatibility
    paths:
      - '.github/workflows/eck-fix-aggregate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/eck-operator-compatibility
          fetch-depth: 0
      - name: Restore aggregate formatting and append ECK
        run: |
          git show e25569197d9c6427f5c0256dd3e2270975ed292b:static/compatibilities.yaml > static/compatibilities.yaml
          cat >> static/compatibilities.yaml <<'EOF'
          - icon: https://helm.elastic.co/icons/eck.png
            git_url: https://github.com/elastic/cloud-on-k8s
            release_url: https://github.com/elastic/cloud-on-k8s/releases/tag/v{vsn}
            helm_repository_url: https://helm.elastic.co
            versions:
            - version: 3.5.0
              kube: ['1.36', '1.35', '1.34', '1.33', '1.32']
              chart_version: 3.5.0
              requirements: []
              incompatibilities: []
              summary: null
            - version: 3.4.1
              kube: ['1.36', '1.35', '1.34', '1.33', '1.32', '1.31']
              chart_version: 3.4.1
              requirements: []
              incompatibilities: []
              summary: null
            - version: 3.3.2
              kube: ['1.35', '1.34', '1.33', '1.32', '1.31']
              chart_version: 3.3.2
              requirements: []
              incompatibilities: []
              summary: null
            - version: 3.2.0
              kube: ['1.34', '1.33', '1.32', '1.31', '1.30']
              chart_version: 3.2.0
              requirements: []
              incompatibilities: []
              summary: null
            - version: 3.1.0
              kube: ['1.33', '1.32', '1.31', '1.30', '1.29']
              chart_version: 3.1.0
              requirements: []
              incompatibilities: []
              summary: null
            - version: 3.0.0
              kube: ['1.32', '1.31', '1.30', '1.29', '1.28']
              chart_version: 3.0.0
              requirements: []
              incompatibilities: []
              summary: null
            name: eck-operator
          EOF
          git diff --check
      - name: Commit corrected aggregate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/compatibilities.yaml
          git commit -m 'fix: keep ECK aggregate update minimal'
          git push origin HEAD:feat/eck-operator-compatibility
