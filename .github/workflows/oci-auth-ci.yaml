name: CI / OCI Authentication Sidecar
on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/oci-auth-ci.yaml"
      - "go/oci-auth/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/oci-auth-ci.yaml"
      - "go/oci-auth/**"
permissions:
  contents: read
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  test:
    needs: [vouch]
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/oci-auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/oci-auth/go.mod
          cache-dependency-path: go/oci-auth/go.sum
          cache: true
      - run: go mod download
      - run: PATH=$PATH:$GOPATH/bin make test
