name: CD / Vendor pseudofs

# Mirrors the pinned pseudofs release (pseudofs.image.tag in charts/console/values.yaml) from the
# telemetry repo's ghcr image into every registry the console is published to.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pseudofs-vendor.yaml
      - charts/console/values.yaml

permissions:
  contents: read

env:
  SOURCE_IMAGE: ghcr.io/pluralsh/pseudofs

jobs:
  vendor:
    name: Copy pseudofs image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read pinned version
        id: version
        uses: mikefarah/yq@v4
        with:
          cmd: yq '.pseudofs.image.tag' charts/console/values.yaml
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: "projects/${{ secrets.GOOGLE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "terraform@pluralsh.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: Login to registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCR_TOKEN: ${{ steps.gcp.outputs.access_token }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          echo "$GCR_TOKEN" | skopeo login gcr.io -u oauth2accesstoken --password-stdin
          echo "$DOCKER_TOKEN" | skopeo login docker.io -u mjgpluralsh --password-stdin
      - name: Copy image
        env:
          VERSION: ${{ steps.version.outputs.result }}
        run: |
          set -euo pipefail
          test -n "$VERSION" && test "$VERSION" != "null"
          for dest in ghcr.io/pluralsh/fs gcr.io/pluralsh/fs docker.io/pluralsh/fs; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              "docker://${SOURCE_IMAGE}:${VERSION}" \
              "docker://${dest}:${VERSION}"
          done
