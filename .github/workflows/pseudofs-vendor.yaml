name: CD / Vendor pseudofs

# Mirrors the pinned upstream pseudofs release from the telemetry repo's ghcr image to pluralsh/fs,
# tagged exactly like the console image of the calling run (sha-<sha> and pr-<n>/<branch> from CI,
# <version> from a release) so the chart can default its tag to the console's.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_IMAGE: ghcr.io/pluralsh/pseudofs
  # bump alongside the pseudofs images in docker-compose.yml and docker-compose.test.yml
  PSEUDOFS_VERSION: 0.2.11
  DOCKER_METADATA_PR_HEAD_SHA: 'true'

jobs:
  vendor:
    name: Copy pseudofs image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/pluralsh/fs
            gcr.io/pluralsh/fs
            docker.io/pluralsh/fs
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: "projects/${{ secrets.GOOGLE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "terraform@pluralsh.iam.gserviceaccount.com"
          token_format: "access_token"
      - name: Login to registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCR_TOKEN: ${{ steps.gcp.outputs.access_token }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          echo "$GCR_TOKEN" | skopeo login gcr.io -u oauth2accesstoken --password-stdin
          echo "$DOCKER_TOKEN" | skopeo login docker.io -u mjgpluralsh --password-stdin
      - name: Login to registries for Cosign
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub for Cosign
        uses: docker/login-action@v4
        with:
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Login to GCR for Cosign
        run: |
          echo "${{ steps.gcp.outputs.access_token }}" | docker login gcr.io -u oauth2accesstoken --password-stdin
      - name: Copy image
        id: copy
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE_IMAGE}:${PSEUDOFS_VERSION}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          while read -r dest; do
            [ -n "$dest" ] || continue
            skopeo copy --all --preserve-digests --retry-times 3 \
              "docker://${SOURCE_IMAGE}:${PSEUDOFS_VERSION}" \
              "docker://${dest}"
          done <<< "$TAGS"
      - name: Cosign sign
        uses: ./.github/actions/cosign-sign
        with:
          digest: ${{ steps.copy.outputs.digest }}
          images: |
            ghcr.io/pluralsh/fs
            gcr.io/pluralsh/fs
            docker.io/pluralsh/fs
