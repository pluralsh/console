name: CD / Devbox voxl

# Builds the statically linked voxl in dockerfiles/devbox/voxl.Dockerfile on native amd64 and arm64 runners and
# publishes it as ghcr.io/pluralsh/devbox-voxl:<voxl version>, which devbox-minimal copies /voxl from, so image
# builds don't compile Rust.
#
# master and manual runs publish. A pull request builds and tests, and also publishes when its voxl version
# hasn't been published yet, so a pull request that bumps voxl can build devbox-minimal against it.
on:
  pull_request:
    branches:
    - "master"
    paths:
    - ".github/workflows/devbox-voxl.yaml"
    - "go/deployment-operator/dockerfiles/devbox/voxl.Dockerfile"
    - "go/deployment-operator/dockerfiles/devbox/tests/voxl-smoke.sh"
  push:
    branches:
    - "master"
    paths:
    - ".github/workflows/devbox-voxl.yaml"
    - "go/deployment-operator/dockerfiles/devbox/voxl.Dockerfile"
    - "go/deployment-operator/dockerfiles/devbox/tests/voxl-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pluralsh/devbox-voxl
  CACHE: ghcr.io/pluralsh/console-cache
  DOCKERFILE: go/deployment-operator/dockerfiles/devbox/voxl.Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  version:
    name: Resolve voxl version
    needs: [vouch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: voxl version
        id: version
        run: |
          version=$(sed -n 's/^ARG VOXL_VERSION=//p' "${DOCKERFILE}")
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VOXL_VERSION in ${DOCKERFILE}: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether to publish
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          publish=true
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]] && docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            publish=false
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test voxl (${{ matrix.platforms.platform }})
    needs: [version]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platforms:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platforms.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare
        run: |
          platform=${{ matrix.platforms.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: go/deployment-operator/dockerfiles/devbox
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platforms.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.publish }}
          cache-from: type=registry,ref=${{ env.CACHE }}:devbox-voxl-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.CACHE }}:devbox-voxl-${{ env.PLATFORM_PAIR }},mode=max,ignore-error=true
      # The binary has to stand alone: it's static, and it captures an Xvfb display on a distribution without
      # x264, Opus or libyuv.
      - name: Test
        run: |
          docker buildx build --load --platform ${{ matrix.platforms.platform }} -t voxl-test \
            -f "${DOCKERFILE}" go/deployment-operator/dockerfiles/devbox \
            --cache-from type=registry,ref=${CACHE}:devbox-voxl-${PLATFORM_PAIR}
          docker run --rm voxl-test --version | grep -E '^voxl [0-9]+\.[0-9]+\.[0-9]+$'
          cid=$(docker create voxl-test)
          docker cp "${cid}:/voxl" "${RUNNER_TEMP}/voxl"
          docker rm "${cid}"
          file "${RUNNER_TEMP}/voxl" | grep -E 'static(-pie)? linked'
          docker run --rm -v "${RUNNER_TEMP}/voxl:/usr/local/bin/voxl:ro" -v "${PWD}/go/deployment-operator/dockerfiles/devbox/tests/voxl-smoke.sh:/smoke.sh:ro" \
            debian:trixie-slim bash /smoke.sh
      - name: Export digest
        if: needs.version.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-voxl-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish devbox-voxl
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-voxl-*
          merge-multiple: true
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION}-${GITHUB_SHA::7}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' | \
            sed "s#^#${IMAGE}@#" >> "$GITHUB_STEP_SUMMARY"
