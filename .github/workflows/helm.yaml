name: Helm
on:
  pull_request:
    branches:
      - "*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  smoke-test:
    needs: [vouch]
    name: Verify Helm Template
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - charts/console
          - charts/console-rapid
          - charts/controller
          - charts/ferrotunnel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5.0.1
      - run: helm template ${{ matrix.chart }} --set dashboard.app.security.csrfKey=dummycsrfkey ${{ matrix.chart == 'charts/ferrotunnel' && '--set server=ferrotunnel.example:7835' || '' }}
