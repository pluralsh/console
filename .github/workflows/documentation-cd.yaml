name: CD / Documentation

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/documentation-cd.yaml"
      - "js/.yarnrc.yml"
      - "js/design-system/**"
      - "js/documentation/**"
      - "js/package.json"
      - "js/yarn.lock"
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/documentation-cd.yaml"
      - "js/.yarnrc.yml"
      - "js/design-system/**"
      - "js/documentation/**"
      - "js/package.json"
      - "js/yarn.lock"
    tags:
      - "documentation/v*.*.*"

env:
  DOCKER_METADATA_PR_HEAD_SHA: 'true'

jobs:
  publish-docker:
    name: Build documentation image
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/pluralsh/documentation
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch
            type=match,pattern=documentation/(v.*),group=1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: js/documentation/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ROOT_URL="https://docs.plural.sh"
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
