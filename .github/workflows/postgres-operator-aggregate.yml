name: Regenerate Zalando Postgres Operator compatibility aggregate

on:
  push:
    branches:
      - feat/postgres-operator-compatibility
    paths:
      - '.github/workflows/postgres-operator-aggregate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postgres-operator-compatibility
          fetch-depth: 0
      - name: Update aggregate minimally
        run: |
          git show e25569197d9c6427f5c0256dd3e2270975ed292b:static/compatibilities.yaml > static/compatibilities.yaml
          python - <<'PY'
          from pathlib import Path
          aggregate = Path('static/compatibilities.yaml')
          addon = Path('static/compatibilities/postgres-operator.yaml').read_text().rstrip('\n').splitlines()
          block = '- ' + addon[0] + '\n' + '\n'.join('  ' + line for line in addon[1:]) + '\n'
          with aggregate.open('a') as f:
              f.write(block)
          PY
          git diff --check
      - name: Commit aggregate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/compatibilities.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: include Zalando Postgres Operator in compatibility aggregate'
          git push origin HEAD:feat/postgres-operator-compatibility
