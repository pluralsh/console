name: CI / Helm

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/helm-test-ci.yaml"
      - "go/helm-test/**"
      - "charts/controller/**"
      - "charts/console/**"
      - "charts/console-rapid/**"
permissions:
  contents: read

env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  build:
    needs: [vouch]
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/helm-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/helm-test/go.mod
          cache: true
      - run: go mod download
      - run: PATH=$PATH:$GOPATH/bin make test
