name: Design system / Chromatic

on:
  push:
    branches:
      - "**"
    paths:
      - "assets/design-system/**"
      - ".github/workflows/chromatic.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "assets/design-system/**"
      - ".github/workflows/chromatic.yml"

jobs:
  chromatic:
    name: Publish Storybook
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: assets
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          cache: yarn
          cache-dependency-path: assets/yarn.lock
      - run: yarn --immutable
      - run: yarn workspace @pluralsh/design-system build:storybook
      - uses: chromaui/action@latest
        id: chromatic
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: assets/design-system
          storybookBuildDir: storybook-static
          exitOnceUploaded: true
          exitZeroOnChanges: true
      - if: ${{ github.event_name == 'pull_request' && steps.chromatic.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: storybook
          message: |
            **Storybook preview:** ${{ steps.chromatic.outputs.storybookUrl }}
