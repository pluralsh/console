name: CI / Controller
on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/controller-ci.yaml"
      - "go/controller/**"
      - "go/polly/**"
      - "go/client/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/controller-ci.yaml"
      - "go/controller/**"
      - "go/polly/**"
      - "go/client/**"
permissions:
  contents: read
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  build:
    needs: [vouch]
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/controller/go.mod
          cache-dependency-path: go/controller/go.sum
          cache: true
      - name: Download dependencies
        run: go mod download
      - run: PATH=$PATH:$GOPATH/bin make build
  unit-test:
    needs: [vouch]
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/controller
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/controller/go.mod
          cache-dependency-path: go/controller/go.sum
          cache: true
      - name: Test
        run: PATH=$PATH:$GOPATH/bin make test
  check-docs:
    needs: [vouch]
    name: verify controller docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check docs
        run: make codegen-crd-docs
        working-directory: go/controller
      - name: verify controller docs
        working-directory: go/controller
        run: |
          git diff --exit-code -- docs/api.md || {
            echo "::error docs were not generated. Please run 'make codegen-crd-docs' and commit the changes."
            exit 1
          }
