name: CI / embedding-server

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "rust/embedding-server/**"
      - "charts/console/**"
      - "go/helm-test/**"
      - ".github/workflows/embedding-server-ci.yaml"
      - ".github/workflows/embedding-server-cd.yaml"

permissions:
  contents: read

env:
  DOCKER_METADATA_PR_HEAD_SHA: "true"
  REGISTRY_IMAGE: ghcr.io/pluralsh/embedding-server
  MODEL_ID: nomic-ai/nomic-embed-text-v1.5
  MODEL_REVISION: e9b6763023c676ca8431644204f50c2b100d9aab
  SERVED_MODEL_NAME: nomic-ai/nomic-embed-text-v1.5
  TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726
  TEI_VERSION: 1.9.4

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  build-and-smoke-test:
    name: Build amd64 image and run smoke test
    needs: [vouch]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: rust/embedding-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate shell and Makefile inputs
        run: |
          bash -n scripts/smoke-test.sh
          make -n build IMAGE=embedding-server:ci \
            MODEL_ID="$MODEL_ID" \
            MODEL_REVISION="$MODEL_REVISION" \
            SERVED_MODEL_NAME="$SERVED_MODEL_NAME" \
            TEI_IMAGE="$TEI_IMAGE" \
            TEI_VERSION="$TEI_VERSION" | grep -- '--build-arg MODEL_ID='

      - name: Validate Dockerfile
        run: |
          docker buildx build --check \
            --file Dockerfile \
            --build-arg TEI_IMAGE="$TEI_IMAGE" \
            .

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: rust/embedding-server
          file: rust/embedding-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: embedding-server:ci
          build-args: |
            MODEL_ID=${{ env.MODEL_ID }}
            MODEL_REVISION=${{ env.MODEL_REVISION }}
            SERVED_MODEL_NAME=${{ env.SERVED_MODEL_NAME }}
            TEI_IMAGE=${{ env.TEI_IMAGE }}
            TEI_VERSION=${{ env.TEI_VERSION }}
            IMAGE_VERSION=ci
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=embedding-server-amd64
          cache-to: type=gha,mode=max,scope=embedding-server-amd64

      - name: Run network-isolated OpenAI smoke test
        run: IMAGE=embedding-server:ci SERVED_MODEL_NAME="$SERVED_MODEL_NAME" ./scripts/smoke-test.sh

  build-pr-image:
    name: Build ${{ matrix.arch }} PR image
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [build-and-smoke-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            tei_image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tei_image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9@sha256:7a1b4aa11c491f39cea38eb0a210afe68a78dd5edee11c8f44f46c3529b27cd8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=pr

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: rust/embedding-server
          file: rust/embedding-server/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            MODEL_ID=${{ env.MODEL_ID }}
            MODEL_REVISION=${{ env.MODEL_REVISION }}
            SERVED_MODEL_NAME=${{ env.SERVED_MODEL_NAME }}
            TEI_IMAGE=${{ matrix.tei_image }}
            TEI_VERSION=${{ env.TEI_VERSION }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.event.pull_request.head.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=embedding-server-pr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=embedding-server-pr-${{ matrix.arch }}

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-pr-image:
    name: Publish PR image
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [build-pr-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=pr

      - name: Create and push multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect published PR image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
