name: CI / Devbox images

# Static checks only. The images are built, tested and pushed once, by deployment-operator-cd-devbox.yaml,
# which runs dockerfiles/devbox/test.sh against the digests it pushes.
on:
  pull_request:
    branches:
    - "master"
    paths:
    - ".github/workflows/deployment-operator-ci-devbox.yaml"
    - ".github/workflows/deployment-operator-cd-devbox.yaml"
    - "go/deployment-operator/dockerfiles/devbox/**"
    - "go/deployment-operator/dockerfiles/agent-harness/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: go/deployment-operator/dockerfiles/devbox

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  lint:
    name: Lint and version pins
    needs: [vouch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Harness versions match the agent-run images
        run: ./test.sh versions
      - name: hadolint
        run: ./test.sh lint
      - name: Build checks
        run: ./test.sh fat-check
