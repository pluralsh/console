name: CI / Console

env:
  DOCKER_METADATA_PR_HEAD_SHA: 'true'

on:
  push:
    branches: [master]
  pull_request:
    branches: ["*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  build:
    needs: [vouch]
    name: Test Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/pluralsh/console
            docker.io/pluralsh/console
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch
      - name: Docker meta
        id: meta-ubuntu
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/pluralsh/console-ubuntu
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      # - name: download jwt verification key
      #   run: |
      #     echo $JWT_PUBLIC_KEY > config/pubkey.pem
      #   env:
      #     JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      - name: Test Build console image
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: "./Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/pluralsh/console-cache:buildcache
          # only master writes the shared cache so unmerged branches can't seed layers for everyone else
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'type=registry,ref=ghcr.io/pluralsh/console-cache:buildcache,mode=max' || '' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VITE_PROD_SECRET_KEY=${{ secrets.VITE_PROD_SECRET_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # - name: Build and push ubuntu images
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: "."
      #     file: "./Dockerfile"
      #     push: true
      #     tags: ${{ steps.meta-ubuntu.outputs.tags }}
      #     labels: ${{ steps.meta-ubuntu.outputs.labels }}
      #     platforms: linux/amd64
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
      #     build-args: |
      #       GIT_COMMIT=${{ github.sha }}
      #       OS_VERSION=focal-20250404
      #       OS_VARIANT=ubuntu
      #       VITE_PROD_SECRET_KEY=${{ secrets.VITE_PROD_SECRET_KEY }}

  test:
    needs: [vouch]
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - run: make testup
      # - name: download jwt verification key
      #   run: |
      #     echo $JWT_PUBLIC_KEY > config/pubkey.pem
      #   env:
      #     JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      # PRs restore the newest master entry; only master saves, keyed per commit so saves never collide
      - name: Restore mix cache
        id: mix-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-v3-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-test-v3-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ${{ runner.os }}-mix-test-v3-
      - run: mix deps.get
      - run: mix compile
        env:
          MIX_ENV: test
      - name: Save mix cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}
      - run: mix test
        env:
          TEST_CHART_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN}}
      - name: Verify Changed files
        run: |
          git diff --exit-code -- priv ':(exclude)priv/agent-service-chart.tgz' || {
            echo "::error Agent chart not downloaded, run mix test to compile it locally."
            exit 1
          }
      - uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: workflow,job,repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }} # required
        if: always()
  updateSchema:
    needs: [vouch]
    name: Check that Schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/client/go.mod
          cache-dependency-path: go/client/go.sum
          cache: true
      - name: Restore mix cache
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-v3-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-test-v3-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ${{ runner.os }}-mix-test-v3-
      - name: get dependencies
        run: mix deps.get
      - name: update schema
        run: MIX_ENV=test mix absinthe.schema.sdl --schema Console.GraphQl  schema/schema.graphql
      - name: update openapi schema
        run: MIX_ENV=test mix openapi.dump Console.OpenAPI --pretty -o schema/openapi.json
      - name: Verify Changed files
        run: |
          git diff --exit-code -- schema || {
            echo "::error Schema has changed changed. Please run 'make update-schema' and commit the changes."
            exit 1
          }
