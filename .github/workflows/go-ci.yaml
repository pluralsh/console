name: CI / Go
on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/go-ci.yaml"
      - "go/**"
      - "schema/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/go-ci.yaml"
      - "go/**"
      - "schema/**"
permissions:
  contents: read
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.work
          check-latest: true
      - id: lint-packages
        run: |
          packages=$(make --no-print-directory lint-packages)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go
          version: v2.11.4
          args: -c .golangci.yml ${{ steps.lint-packages.outputs.packages }}

  tools:
    name: Verify tools
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/tools
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.work
          check-latest: true
      - name: Verify tools module and install goimports
        run: |
          go mod verify
          version=$(go list -m -f '{{.Version}}' golang.org/x/tools)
          bin=$(mktemp -d)
          GOBIN="$bin" go install golang.org/x/tools/cmd/goimports@"$version"
          test -x "$bin/goimports"
