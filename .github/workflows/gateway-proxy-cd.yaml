name: CD / Gateway Proxy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy"
        required: true
  push:
    branches:
      - "master"
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GOPATH: /home/runner/go
  GOBIN: /home/runner/go/bin
  GOPROXY: "https://proxy.golang.org"
  # Standalone module: go/go.work may pin a newer Go than go.mod and setup-go installs.
  GOWORK: "off"
  REGISTRY_IMAGE: ghcr.io/pluralsh/gateway-proxy

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  test:
    needs: [vouch]
    name: Unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/gateway-proxy
    steps:
      - uses: actions/checkout@v7
      # module cache is ~2.5GB and was evicting every other Actions cache in the repo
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/gateway-proxy/go.mod
          cache: false
      - run: go mod download
      - run: GOCACHE=/tmp/go-build go test -race ./...

  build-gateway-proxy:
    name: Build gateway-proxy image
    needs: [test]
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platforms:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platforms.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare
        run: |
          platform=${{ matrix.platforms.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ secrets.GOOGLE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "terraform@pluralsh.iam.gserviceaccount.com"
          token_format: "access_token"
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Login to GCR
        run: gcloud auth configure-docker -q

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./go/gateway-proxy
          file: ./go/gateway-proxy/Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/pluralsh/console-cache:gateway-proxy-${{ env.PLATFORM_PAIR }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && format('type=registry,ref=ghcr.io/pluralsh/console-cache:gateway-proxy-{0},mode=max', env.PLATFORM_PAIR) || '' }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-gateway-proxy-${{ env.PLATFORM_PAIR }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-gateway-proxy:
    name: Publish gateway-proxy image
    needs: [build-gateway-proxy]
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        images:
          - ghcr.io/pluralsh/gateway-proxy
          - gcr.io/pluralsh/gateway-proxy
          - docker.io/pluralsh/gateway-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-gateway-proxy-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ secrets.GOOGLE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "terraform@pluralsh.iam.gserviceaccount.com"
          token_format: "access_token"
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Login to GCR
        run: gcloud auth configure-docker -q

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mjgpluralsh
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve tag version
        id: tag_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}},value=${{ steps.tag_version.outputs.version }},enable=${{ steps.tag_version.outputs.version != '' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          digest=$(docker buildx imagetools inspect ${{ matrix.images }}:${{ steps.meta.outputs.version }} --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect ${{ matrix.images }}:${{ steps.meta.outputs.version }}
      - name: Cosign sign
        uses: ./.github/actions/cosign-sign
        with:
          digest: ${{ steps.inspect.outputs.digest }}
          images: ${{ matrix.images }}
