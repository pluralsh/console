name: CI / Polly
on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/polly-ci.yaml"
      - "go/polly/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/polly-ci.yaml"
      - "go/polly/**"
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  test:
    needs: [vouch]
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: go/polly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.work
          cache-dependency-path: |
            go/go.work.sum
            go/polly/go.sum
      - run: PATH=$PATH:$GOPATH/bin make test
