name: Validate Compatibility Schemas

on:
  pull_request:
    paths:
      - '.github/workflows/compatibility-schema-validation.yaml'
      - 'utils/compatibility/**'
      - 'static/addons/**'
      - 'static/compatibilities/**'
      - 'static/compatibilities.yaml'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/compatibility-schema-validation.yaml'
      - 'utils/compatibility/**'
      - 'static/addons/**'
      - 'static/compatibilities/**'
      - 'static/compatibilities.yaml'

permissions:
  contents: read

jobs:
  test-compatibility-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install parser test dependency
        run: python -m pip install packaging==24.1

      - name: Test compatibility scrapers
        run: python -m unittest discover -s utils/compatibility/tests -v

  validate-compatibility-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate add-on compatibility tables
        uses: dsanders11/json-schema-validate-action@eddf079f55830cc9a916a3c512ba9086240d2fea
        with:
          schema: static/compatibilities/schema.json
          files: |
            static/compatibilities.yaml
            static/compatibilities/*.yaml
          all-errors: true

      - name: Validate cloud add-on compatibility tables
        uses: dsanders11/json-schema-validate-action@eddf079f55830cc9a916a3c512ba9086240d2fea
        with:
          schema: static/addons/schema.json
          files: |
            static/addons/*.yaml
          all-errors: true
