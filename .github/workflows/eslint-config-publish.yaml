name: CD / ESLint config

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/eslint-config-publish.yaml"
      - "js/eslint-config/**"
      - "js/package.json"
      - "js/yarn.lock"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - working-directory: js
        run: yarn --immutable
      - name: Bootstrap migrated release history
        run: |
          if [[ -z "$(git tag --list 'eslint-config-v*')" ]]; then
            git tag eslint-config-v1.4.48 14f784408592001aa12be43505498d72d8bb055c
          fi
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: js/eslint-config
          tag_format: eslint-config-v${version}
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.2.1
            semantic-release-monorepo@8.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
