name: CI / JavaScript

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/js-ci.yaml"
      - "js/.yarnrc.yml"
      - "js/console/**"
      - "js/design-system/**"
      - "js/eslint-config/**"
      - "js/stylelint-config/**"
      - "js/package.json"
      - "js/yarn.lock"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/js-ci.yaml"
      - "js/.yarnrc.yml"
      - "js/console/**"
      - "js/design-system/**"
      - "js/eslint-config/**"
      - "js/stylelint-config/**"
      - "js/package.json"
      - "js/yarn.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  lint:
    needs: [vouch]
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - run: >-
          YARN_ENABLE_IMMUTABLE_INSTALLS=true
          yarn workspaces focus
          console @pluralsh/design-system
          @pluralsh/eslint-config-pluralsh @pluralsh/stylelint-config
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: js/*/.eslintcache
          key: ${{ runner.os }}-eslint-v1-${{ hashFiles('js/yarn.lock', 'js/.yarnrc.yml', 'js/**/eslint.config.*', 'js/**/tsconfig*.json') }}
      - run: yarn workspace @pluralsh/eslint-config-pluralsh lint
      - run: yarn workspace @pluralsh/stylelint-config lint
      - run: yarn workspace console lint

  test:
    needs: [vouch]
    name: Unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - run: >-
          YARN_ENABLE_IMMUTABLE_INSTALLS=true
          yarn workspaces focus console @pluralsh/design-system
      - run: yarn test

  typecheck:
    needs: [vouch]
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - run: >-
          YARN_ENABLE_IMMUTABLE_INSTALLS=true
          yarn workspaces focus console @pluralsh/design-system
      - run: yarn workspace @pluralsh/design-system build
      - run: yarn workspace console typecheck
