name: CI / JavaScript

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/js-ci.yaml"
      - "js/.yarnrc.yml"
      - "js/console/**"
      - "js/design-system/**"
      - "js/documentation/**"
      - "js/biome.json"
      - "js/.oxlintrc.json"
      - "js/package.json"
      - "js/yarn.lock"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/js-ci.yaml"
      - "js/.yarnrc.yml"
      - "js/console/**"
      - "js/design-system/**"
      - "js/documentation/**"
      - "js/biome.json"
      - "js/.oxlintrc.json"
      - "js/package.json"
      - "js/yarn.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vouch:
    name: Vouch
    uses: ./.github/workflows/vouch-gate.yml
    permissions:
      contents: read

  lint:
    needs: [vouch]
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      # Full install: type-aware oxlint rules need every app's dependencies.
      - run: yarn install --immutable
      - run: yarn dedupe --check
      - run: yarn lint:biome --reporter=github
      - run: yarn lint:oxlint --format=github

  test:
    needs: [vouch]
    name: Unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - run: >-
          YARN_ENABLE_IMMUTABLE_INSTALLS=true
          yarn workspaces focus console @pluralsh/design-system
      - run: yarn test

  typecheck:
    needs: [vouch]
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: yarn
          cache-dependency-path: js/yarn.lock
      - run: corepack enable
      - run: >-
          YARN_ENABLE_IMMUTABLE_INSTALLS=true
          yarn workspaces focus console @pluralsh/design-system
      - run: yarn workspace console typecheck
