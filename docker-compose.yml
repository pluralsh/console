  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: always
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    depends_on:
      minio:
        condition: service_started
    command: ["mb", "--ignore-existing", "local/console-test"]
    restart: on-failure
  pseudofs:
    # keep in sync with PSEUDOFS_VERSION in .github/workflows/pseudofs-vendor.yaml
    image: ghcr.io/pluralsh/pseudofs:0.2.11
    restart: always
    command: ["--config", "/etc/pseudofs/pseudofs.yaml"]
    ports:
      - 9093:9093
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./docker/pseudofs/pseudofs.yaml:/etc/pseudofs/pseudofs.yaml:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
  gcs:
    image: fsouza/fake-gcs-server@sha256:666f86b873120818b10a5e68d99401422fcf8b00c1f27fe89599c35236f48b4c
    restart: always
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "localhost:4443"]
    ports:
      - 4443:4443
  mcp:
    restart: always
    image: tzolov/mcp-everything-server:v3
    # image: mcp/everything:latest
    ports:
      - 3001:3001
    command:
      - node
      - dist/index.js
      - "streamableHttp"
volumes:
  database_data:
    driver: local
  es_data:
    driver: local
  opensearch_data:
    driver: local
  localstack_data:
    driver: local
