# Image-bearing pod definitions reduced from official v1.33.7 examples/render/contour.yaml
kind: Job
spec:
  template:
    spec:
      containers:
      - name: contour
        image: ghcr.io/projectcontour/contour:v1.33.7
---
kind: Deployment
spec:
  template:
    spec:
      containers:
      - name: contour
        image: ghcr.io/projectcontour/contour:v1.33.7
---
kind: DaemonSet
spec:
  template:
    spec:
      containers:
      - name: shutdown-manager
        image: ghcr.io/projectcontour/contour:v1.33.7
      - name: envoy
        image: docker.io/envoyproxy/envoy:distroless-v1.38.4
      initContainers:
      - name: envoy-initconfig
        image: ghcr.io/projectcontour/contour:v1.33.7
