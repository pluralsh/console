# Evidence excerpt from the official release-tag workflow:
# https://raw.githubusercontent.com/nats-io/k8s/nats-0.13.2/.github/workflows/test.yaml
jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - "1.23"
          - "1.22"
          - "1.21"
    steps:
      - name: Create k8s cluster
        run: |-
          sudo snap install microk8s --channel="${{ matrix.k8s }}/stable" --classic
          sudo microk8s.enable dns
          sudo microk8s.enable storage
      - name: Run chart-testing (install)
        run: |-
          sudo microk8s.kubectl apply -f https://raw.githubusercontent.com/nats-io/nack/main/deploy/crds.yml
          ct install --all --chart-dirs helm/charts --excluded-charts nats-account-server,nats-kafka,nats-operator,surveyor
