fragment WorkbenchFragment on Workbench {
    id
    name
    description
    systemPrompt
    project {
        ...TinyProjectFragment
    }
    repository {
        ...GitRepositoryFragment
    }
    agentRuntime {
        ...TinyAgentRuntimeFragment
    }
    configuration {
        coding {
            mode
            repositories
        }
        infrastructure {
            services
            stacks
            kubernetes
        }
        observability {
            logs
            metrics
        }
    }
    skills {
        ref {
            ref
            folder
            files
        }
        files
    }
    tools {
        ...WorkbenchToolFragment
    }
    readBindings {
        ...PolicyBindingFragment
    }
    writeBindings {
        ...PolicyBindingFragment
    }
    insertedAt
    updatedAt
}

fragment WorkbenchToolFragment on WorkbenchTool {
    id
    name
    tool
    categories
    project {
        ...TinyProjectFragment
    }
    mcpServer {
        ...MCPServerFragment
    }
    cloudConnection {
        ...CloudConnectionFragment
    }
    scmConnection {
        id
        name
        type
    }
    configuration {
        http {
            url
            method
            function
            headers {
                name
                value
            }
            body
            inputSchema
        }
        elastic {
            index
            url
            username
        }
        opensearch {
            host
            index
            awsAccessKeyId
            awsRegion
            assumeRoleArn
            usePodIdentity
        }
        prometheus {
            url
            username
            tenantId
            awsSigv4
            awsAccessKeyId
            awsRegion
        }
        loki {
            url
            username
            tenantId
        }
        splunk {
            url
            username
        }
        tempo {
            url
            username
            tenantId
        }
        jaeger {
            url
            username
        }
        datadog {
            site
        }
        dynatrace {
            url
        }
        cloudwatch {
            region
            logGroupNames
            roleArn
            roleSessionName
        }
        azure {
            subscriptionId
            tenantId
            clientId
            prometheusUrl
        }
        sentry {
            url
        }
        linear {
            url
        }
        slack {
            url
        }
        pagerduty {
            url
        }
        teams {
            clientId
            tenantId
        }
        atlassian {
            url
            email
        }
        exa {
            url
        }
        github {
            url
            toolset
            appId
            installationId
        }
        gitlab {
            url
        }
        bitbucket {
            url
        }
        bitbucketDatacenter {
            url
        }
        azureDevops {
            url
        }
        lambda {
            lambdaArn
            description
            inputSchema
        }
        cloudRun {
            identifier
            description
            inputSchema
        }
        azureFunction {
            identifier
            description
            inputSchema
        }
        docker {
            url
            provider
            proxy {
                url
                noproxy
            }
        }
    }
    insertedAt
    updatedAt
}

mutation CreateWorkbench($attributes: WorkbenchAttributes!) {
    createWorkbench(attributes: $attributes) {
        ...WorkbenchFragment
    }
}

mutation UpdateWorkbench($id: ID!, $attributes: WorkbenchAttributes!) {
    updateWorkbench(id: $id, attributes: $attributes) {
        ...WorkbenchFragment
    }
}

mutation DeleteWorkbench($id: ID!) {
    deleteWorkbench(id: $id) {
        ...WorkbenchFragment
    }
}

mutation WorkbenchPrFollowup($url: String!, $attributes: WorkbenchMessageAttributes!) {
    workbenchPrFollowup(url: $url, attributes: $attributes) {
        id
        prompt
        type
        status
    }
}

mutation CreateWorkbenchTool($attributes: WorkbenchToolAttributes!) {
    createWorkbenchTool(attributes: $attributes) {
        ...WorkbenchToolFragment
    }
}

mutation UpdateWorkbenchTool($id: ID!, $attributes: WorkbenchToolAttributes!) {
    updateWorkbenchTool(id: $id, attributes: $attributes) {
        ...WorkbenchToolFragment
    }
}

mutation DeleteWorkbenchTool($id: ID!) {
    deleteWorkbenchTool(id: $id) {
        ...WorkbenchToolFragment
    }
}

query ListWorkbenches($after: String, $first: Int, $before: String, $last: Int, $q: String) {
    workbenches(after: $after, first: $first, before: $before, last: $last, q: $q) {
        edges {
            node {
                ...WorkbenchFragment
            }
        }
        pageInfo {
            ...PageInfoFragment
        }
    }
}

query GetWorkbench($id: ID, $name: String) {
    workbench(id: $id, name: $name) {
        ...WorkbenchFragment
    }
}

query GetWorkbenchTiny($id: ID, $name: String) {
    workbench(id: $id, name: $name) {
        id
        name
    }
}

query ListWorkbenchTools($after: String, $first: Int, $before: String, $last: Int, $q: String) {
    workbenchTools(after: $after, first: $first, before: $before, last: $last, q: $q) {
        edges {
            node {
                ...WorkbenchToolFragment
            }
        }
        pageInfo {
            ...PageInfoFragment
        }
    }
}

query GetWorkbenchTool($id: ID, $name: String) {
    workbenchTool(id: $id, name: $name) {
        ...WorkbenchToolFragment
    }
}

query GetWorkbenchToolTiny($id: ID, $name: String) {
    workbenchTool(id: $id, name: $name) {
        id
        name
    }
}

fragment WorkbenchCronFragment on WorkbenchCron {
    id
    crontab
    prompt
    workbench {
        id
        name
    }
}

fragment WorkbenchWebhookFragment on WorkbenchWebhook {
    id
    name
    prompt
    priority
    matches {
        regex
        substring
        caseInsensitive
    }
    webhook {
        id
        name
    }
    issueWebhook {
        id
        name
    }
    workbench {
        id
        name
    }
}

fragment WorkbenchPromptFragment on WorkbenchPrompt {
    id
    title
    category
    prompt
}

fragment QueuedPromptFragment on QueuedPrompt {
    id
    prompt
    dequeableAt
    workbenchJob {
        id
    }
    user {
        id
    }
}

mutation CreateWorkbenchCron($workbenchId: ID!, $attributes: WorkbenchCronAttributes!) {
    createWorkbenchCron(workbenchId: $workbenchId, attributes: $attributes) {
        ...WorkbenchCronFragment
    }
}

mutation UpdateWorkbenchCron($id: ID!, $attributes: WorkbenchCronAttributes!) {
    updateWorkbenchCron(id: $id, attributes: $attributes) {
        ...WorkbenchCronFragment
    }
}

mutation DeleteWorkbenchCron($id: ID!) {
    deleteWorkbenchCron(id: $id) {
        ...WorkbenchCronFragment
    }
}

mutation GetWorkbenchCron($id: ID!) {
    workbenchCron(id: $id) {
        ...WorkbenchCronFragment
    }
}

mutation CreateWorkbenchPrompt($workbenchId: ID!, $attributes: WorkbenchPromptAttributes!) {
    createWorkbenchPrompt(workbenchId: $workbenchId, attributes: $attributes) {
        id
    }
}

mutation UpdateWorkbenchPrompt($id: ID!, $attributes: WorkbenchPromptAttributes!) {
    updateWorkbenchPrompt(id: $id, attributes: $attributes) {
        id
    }
}

mutation DeleteWorkbenchPrompt($id: ID!) {
    deleteWorkbenchPrompt(id: $id) {
        id
    }
}

mutation CreateQueuedPrompt($jobId: ID!, $attributes: QueuedPromptAttributes!) {
    createQueuedPrompt(jobId: $jobId, attributes: $attributes) {
        ...QueuedPromptFragment
    }
}

mutation EnqueueWorkbenchPrFollowup($url: String!, $attributes: QueuedPromptAttributes!) {
    enqueueWorkbenchPrFollowup(url: $url, attributes: $attributes) {
        ...QueuedPromptFragment
        workbenchJob {
            id
            url
        }
    }
}

query GetWorkbenchPrompt($id: ID!) {
    workbenchPrompt(id: $id) {
        ...WorkbenchPromptFragment
    }
}

mutation CreateWorkbenchWebhook($workbenchId: ID!, $attributes: WorkbenchWebhookAttributes!) {
    createWorkbenchWebhook(workbenchId: $workbenchId, attributes: $attributes) {
        ...WorkbenchWebhookFragment
    }
}

mutation UpdateWorkbenchWebhook($id: ID!, $attributes: WorkbenchWebhookAttributes!) {
    updateWorkbenchWebhook(id: $id, attributes: $attributes) {
        ...WorkbenchWebhookFragment
    }
}

mutation DeleteWorkbenchWebhook($id: ID!) {
    deleteWorkbenchWebhook(id: $id) {
        ...WorkbenchWebhookFragment
    }
}

mutation GetWorkbenchWebhook($id: ID!) {
    getWorkbenchWebhook(id: $id) {
        ...WorkbenchWebhookFragment
    }
}
