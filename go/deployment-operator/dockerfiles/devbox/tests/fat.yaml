# devbox-fat only (run together with common.yaml).
schemaVersion: 2.0.0

metadataTest:
  user: "1000:1000"
  labels:
    - key: sh.plural.devbox/flavor
      value: fat
  envVars:
    - key: GOPATH
      value: /home/dev/go
    - key: CARGO_HOME
      value: /home/dev/.cargo
    - key: RUSTUP_HOME
      value: /usr/local/rustup
    - key: JAVA_HOME
      value: /opt/java/openjdk
    - key: COREPACK_HOME
      value: /usr/local/share/corepack
    - key: DOTNET_CLI_TELEMETRY_OPTOUT
      value: "1"
    - key: MISE_ERLANG_COMPILE
      value: "false"
    - key: MISE_ERLANG_PRECOMPILED_OS
      value: ubuntu-24.04
    - key: MIX_REBAR3
      value: /usr/local/bin/rebar3
    - key: MIX_ARCHIVES
      value: /usr/local/share/mix/archives

fileExistenceTests:
  - name: writable Java cacerts in the trust dir
    path: /var/lib/devbox/trust/java-cacerts
    shouldExist: true
    uid: 1000

commandTests:
  - name: manifest flavor
    command: jq
    args: ["-r", ".flavor", "/etc/devbox/image.json"]
    expectedOutput: ["(?m)^fat$"]
  - name: JDK trust store is the writable copy in the trust dir
    command: readlink
    args: ["/opt/java/openjdk/lib/security/cacerts"]
    expectedOutput: ["(?m)^/var/lib/devbox/trust/java-cacerts$"]

  # Languages.
  - name: go
    command: go
    args: ["version"]
    expectedOutput: ["go1\\.27\\.2"]
  - name: go caches live in the home directory
    command: go
    args: ["env", "GOMODCACHE", "GOCACHE"]
    expectedOutput: ["(?m)^/home/dev/go/pkg/mod$", "(?m)^/home/dev/.cache/go-build$"]
  - name: gopls
    command: gopls
    args: ["version"]
    expectedOutput: ["v0\\.24\\.0"]
  - name: typescript
    command: tsc
    args: ["--version"]
    expectedOutput: ["6\\.0\\.3"]
  - name: typescript-language-server
    command: typescript-language-server
    args: ["--version"]
    expectedOutput: ["6\\.1\\.0"]
  - name: pnpm via corepack
    command: pnpm
    args: ["--version"]
    expectedOutput: ["12\\.18\\.0"]
  - name: yarn via corepack
    command: yarn
    args: ["--version"]
    expectedOutput: ["1\\.22\\.22"]
  - name: yarn 4 accepts the image's environment
    command: sh
    args: ["-c", "cd \"$(mktemp -d)\" && echo '{\"packageManager\":\"yarn@4.18.1\"}' > package.json && yarn config get enableStrictSsl"]
    expectedOutput: ["^true"]
  - name: rust
    command: rustc
    args: ["--version"]
    expectedOutput: ["rustc 1\\.100\\.0"]
  - name: cargo components
    command: sh
    args: ["-c", "cargo --version && cargo clippy --version && rustfmt --version && rust-analyzer --version"]
    exitCode: 0
  - name: cargo home is the home directory
    command: sh
    args: ["-c", "env | grep '^CARGO_HOME=' && test -w /usr/local/rustup && echo rustup-writable"]
    expectedOutput: ["(?m)^CARGO_HOME=/home/dev/.cargo$", "(?m)^rustup-writable$"]
  - name: java
    command: java
    args: ["-version"]
    expectedError: ["25\\.0\\.5"]
  - name: maven
    command: mvn
    args: ["--version"]
    expectedOutput: ["Apache Maven 3\\.9\\.16"]
  - name: gradle
    command: gradle
    args: ["--version"]
    expectedOutput: ["Gradle 9\\.9\\.1"]
  - name: dotnet
    command: dotnet
    args: ["--list-sdks"]
    expectedOutput: ["10\\.0\\.404"]
  - name: csharp-ls
    command: which
    args: ["csharp-ls"]
    exitCode: 0
  - name: python
    command: python3
    args: ["--version"]
    expectedOutput: ["Python 3\\."]
  - name: uv
    command: uv
    args: ["--version"]
    expectedOutput: ["uv 0\\.13\\.8"]
  - name: erlang
    command: erl
    args: ["-noshell", "-eval", "io:format(\"~s~n\", [erlang:system_info(otp_release)]), halt()."]
    expectedOutput: ["(?m)^28$"]
  - name: rebar3
    command: rebar3
    args: ["version"]
    expectedOutput: ["rebar 3\\.27\\.0"]
  - name: elixir
    command: elixir
    args: ["--version"]
    expectedOutput: ["Elixir 1\\.19\\.4"]
    excludedError: ["latin1"]
  - name: hex is installed and its archives dir is writable
    command: sh
    args: ["-c", "mix hex.info && test -w /usr/local/share/mix/archives && echo archives-writable"]
    expectedOutput: ["Hex: ", "(?m)^archives-writable$"]
  - name: mise resolves erlang and elixir pins to the system installs
    command: sh
    args: ["-c", "cd \"$(mktemp -d)\" && printf 'erlang 28.5\\nelixir 1.19.4\\n' > .tool-versions && MISE_OFFLINE=1 mise exec -- sh -c 'command -v elixir && elixir --version'"]
    expectedOutput: ["/usr/local/share/mise/installs/elixir/1\\.19\\.4/bin/elixir", "Elixir 1\\.19\\.4"]
  - name: corepack home writable
    command: sh
    args: ["-c", "test -w /usr/local/share/corepack && echo ok"]
    expectedOutput: ["(?m)^ok$"]

  # DevOps tools.
  - name: kubectl
    command: kubectl
    args: ["version", "--client"]
    expectedOutput: ["v1\\.37\\.2"]
  - name: helm
    command: helm
    args: ["version", "--short"]
    expectedOutput: ["v4\\.3\\.2"]
  - name: kustomize
    command: kustomize
    args: ["version"]
    expectedOutput: ["5\\.8\\.3"]
  - name: k9s
    command: k9s
    args: ["version", "--short"]
    expectedOutput: ["0\\.51\\.0"]
  - name: terraform
    command: terraform
    args: ["version"]
    expectedOutput: ["Terraform v1\\.17\\.2"]
  - name: opentofu
    command: tofu
    args: ["version"]
    expectedOutput: ["OpenTofu v1\\.13\\.9"]
  - name: terragrunt
    command: terragrunt
    args: ["--version"]
    expectedOutput: ["1\\.2\\.2"]
  - name: yq
    command: yq
    args: ["--version"]
    expectedOutput: ["4\\.54\\.3"]
  - name: podman
    command: podman
    args: ["--version"]
    expectedOutput: ["podman version 5\\."]
  - name: docker maps onto podman
    command: docker
    args: ["--version"]
    expectedOutput: ["podman version"]
  - name: podman-compose
    command: podman-compose
    args: ["--version"]
    expectedOutput: ["podman-compose version"]
  - name: rootless container networks (pasta, netavark, aardvark-dns, nft)
    command: sh
    args: ["-c", "command -v pasta && command -v nft && ls /usr/lib/podman/netavark /usr/lib/podman/aardvark-dns"]
    expectedOutput: ["pasta", "nft", "netavark", "aardvark-dns"]
  - name: docker-compose is podman-compose
    command: docker-compose
    args: ["--version"]
    expectedOutput: ["podman-compose version"]
  - name: docker compose runs the host-network podman-compose wrapper without the provider banner
    command: cat
    args: ["/etc/containers/containers.conf.d/devbox.conf"]
    expectedOutput: ["compose_warning_logs = false", 'compose_providers = \["/usr/local/bin/podman-compose"\]']
  - name: podman-compose and docker-compose resolve to the host-network wrapper
    command: sh
    args: ["-c", "command -v podman-compose; readlink /usr/local/bin/docker-compose; head -1 /usr/local/bin/podman-compose"]
    expectedOutput: ["(?m)^/usr/local/bin/podman-compose\n/usr/local/bin/podman-compose\n#!/usr/bin/python3$"]
  - name: rootless podman stores images with vfs off the home directory
    command: cat
    args: ["/etc/containers/storage.conf"]
    expectedOutput: ['driver = "vfs"', 'rootless_storage_path = "/var/lib/devbox-containers/storage"']
  - name: Block homes keep rootless podman storage on the home with vfs
    command: cat
    args: ["/etc/containers/storage.home.conf"]
    expectedOutput: ['driver = "vfs"', 'runroot = "/run/containers/storage"', 'rootless_storage_path = "/home/dev/\.local/share/containers/storage"']
  - name: dev owns the container storage directory
    command: stat
    args: ["-c", "%u:%g %a", "/var/lib/devbox-containers"]
    expectedOutput: ["(?m)^1000:1000 700$"]
  - name: dev has subordinate ids for rootless containers
    command: grep
    args: ["^dev:", "/etc/subuid", "/etc/subgid"]
    expectedOutput: ["/etc/subuid:dev:100000:65536", "/etc/subgid:dev:100000:65536"]
  - name: bkt (Bitbucket CLI)
    command: bkt
    args: ["--version"]
    expectedOutput: ["bkt version 0\\.41\\.1"]
  - name: crane
    command: crane
    args: ["version"]
    expectedOutput: ["0\\.22\\.1"]
  - name: plural
    command: plural
    args: ["version"]
    expectedOutput: ["0\\.12\\.69"]

  # Cloud CLIs, through the identity-loading wrappers.
  - name: aws
    command: aws
    args: ["--version"]
    expectedOutput: ["aws-cli/2\\.40\\.3"]
  - name: gcloud
    command: gcloud
    args: ["--version"]
    expectedOutput: ["Google Cloud SDK 593\\.0\\.0"]
  - name: gke-gcloud-auth-plugin
    command: which
    args: ["gke-gcloud-auth-plugin"]
    exitCode: 0
  - name: az
    command: az
    args: ["version", "--query", "\"azure-cli\"", "--output", "tsv"]
    expectedOutput: ["2\\.92\\.0"]
  - name: aws picks up the federated identity from the daemon's env file
    command: sh
    args: ["-c", "mkdir -p /run/plural/identity/aws && echo dummy > /run/plural/identity/aws/token && printf 'AWS_ROLE_ARN=arn:aws:iam::123456789012:role/devbox\\nAWS_WEB_IDENTITY_TOKEN_FILE=/run/plural/identity/aws/token\\nAWS_REGION=us-east-1\\nAWS_ENDPOINT_URL_STS=http://127.0.0.1:9\\nAWS_MAX_ATTEMPTS=1\\n' > /run/plural/identity/env && aws sts get-caller-identity --debug 2>&1; true"]
    expectedOutput: ["Looking for credentials via: assume-role-with-web-identity"]
    excludedOutput: ["Looking for credentials via: shared-credentials-file"]
  - name: cloud wrappers come first on PATH
    command: which
    args: ["aws", "gcloud", "az"]
    expectedOutput: ["(?m)^/usr/local/bin/aws$", "(?m)^/usr/local/bin/gcloud$", "(?m)^/usr/local/bin/az$"]
