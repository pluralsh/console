schemaVersion: 2.0.0

metadataTest:
  labels:
    - key: sh.plural.devbox/component
      value: gateway
  entrypoint: ["/devbox-gateway"]
  user: "65532:65532"

commandTests:
  - name: the binary executes
    command: /devbox-gateway
    args: ["-version"]
    exitCode: 0

fileExistenceTests:
  - name: devbox-gateway
    path: /devbox-gateway
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: CA certificates
    path: /etc/ssl/certs/ca-certificates.crt
    shouldExist: true
  - name: no daemon or harnesses
    path: /usr/local/bin/devbox-daemon
    shouldExist: false
