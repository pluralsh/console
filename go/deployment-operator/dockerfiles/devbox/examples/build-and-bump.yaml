# Sample GitHub Actions workflow for a custom devbox image repository. Copy it to
# .github/workflows/ in that repository. It builds the image for both
# architectures, pushes it, and pins the DevboxRunner to the new digest.
name: Devbox image

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly so the image picks up base image and security updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devbox
  # Keep this on your console's release line (the contract requires the daemon
  # to be no more than one minor release behind the operator).
  BASE_IMAGE: ghcr.io/pluralsh/devbox-minimal:0.12
  RUNNER_MANIFEST: deploy/devbox-runner.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Pin the DevboxRunner to the new digest
        run: |
          yq -i '.spec.image = "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"' "${RUNNER_MANIFEST}"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "Bump devbox image to ${{ steps.build.outputs.digest }}" && git push || echo "No change"
