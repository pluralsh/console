apiVersion: deployments.plural.sh/v1alpha1
kind: AgentRuntime
metadata:
  name: test-codex
  namespace: codex
spec:
  type: "CODEX"
  targetNamespace: "codex"
  config:
    codex:
      apiKeySecretRef:
        name: codex-api-key
        key: apiKey
  template:
    spec:
      containers:
        - name: default
          image: ghcr.io/pluralsh/agent-harness:0.6.17-claude-2.1.72
          args:
            - --v=3
  dind: true
  workbenchMcp:
    enabled: true
    categories:
      - metrics
      - logs
      - traces
      - ticketing
      - search
      - scm
      - infrastructure
  mcpServers:
    - name: linear
      url: https://mcp.linear.app/mcp
      allowedTools:
        - list_issues
      headers:
        - name: Authorization
          valueFrom:
            secretKeyRef:
              name: linear-mcp
              key: token
---
apiVersion: v1
kind: Namespace
metadata:
  name: gemini
---
apiVersion: deployments.plural.sh/v1alpha1
kind: AgentRuntime
metadata:
  name: gemini
spec:
  type: "GEMINI"
  targetNamespace: "gemini"
  config:
    gemini:
      apiKeySecretRef:
        name: gemini
        key: apiKey
  template:
    spec:
      containers:
        - name: default
          args:
            - --v=3
  dind: true
  repositoryImage: docker.io/pluralsh/console-repos:latest
  prewarm:
    cron: "0 * * * *"
    selector:
      matchLabels:
        plural.sh/agent-pool: default
  readOnlyRootFilesystem: false
  mise:
    config: |
      [settings.erlang]
      compile = false
      precompiled_os = "ubuntu-24.04"

      [tools]
      erlang = "28.5"
      elixir = "1.19.4"
      rust = "stable"
      go = "1.27.1"
      node = "24.11.1"

      [env]
      MIX_HOME = "/plural/shared/repository/.mix"
      MIX_ARCHIVES = "/plural/shared/repository/.mix/archives"
      HEX_HOME = "/plural/shared/repository/.hex"
      ELIXIR_ERL_OPTIONS = "+fnu"
      GOPATH = "/plural/shared/repository/.gopath"
      GOBIN = "/plural/shared/repository/.gopath/bin"
      GOCACHE = "/plural/shared/repository/.cache/go-build"
      GOMODCACHE = "/plural/shared/repository/.cache/pkg/mod"
      GOWORK = "/plural/shared/repository/go/go.work"
