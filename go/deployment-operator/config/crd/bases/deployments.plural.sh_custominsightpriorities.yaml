kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: custominsightpriorities.deployments.plural.sh
spec:
  group: deployments.plural.sh
  names:
    kind: CustomInsightPriority
    listKind: CustomInsightPriorityList
    plural: custominsightpriorities
    singular: custominsightpriority
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.precedence
      name: Precedence
      type: integer
    - jsonPath: .status.lastEvaluation.matched
      name: Matched
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CustomInsightPriority sets the priority of failing objects in
          the cluster insights and the cluster health score.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CustomInsightPrioritySpec defines how the insight priority
              of failing objects is decided.
            properties:
              engine:
                default: python
                description: Engine the script is written for.
                enum:
                - python
                type: string
              precedence:
                description: |-
                  Precedence decides which script owns an object that several targets match: the highest wins and ties are
                  broken by name. A script never sees objects it does not own, and scripts are not chained.
                type: integer
              script:
                description: |-
                  Script defines `evaluate(input)`, called with the objects this script owns in `input["rows"]`, and returns a
                  dictionary from the `uid` of a row to `{"priority": "LOW|MEDIUM|HIGH|CRITICAL|IGNORE", "reason": "..."}`.
                  Rows that are left out keep their built-in priority, IGNORE removes a row from the insights and the cluster health score.

                  Objects annotated with deployments.plural.sh/insight-priority are decided by the annotation and never reach the script.

                  See https://docs.plural.sh/plural-features/continuous-deployment/deployment-operator/insight-priority for the full guide.
                type: string
              target:
                description: Target selects the failing objects this script sets the
                  priority of.
                properties:
                  kinds:
                    description: Kinds the script is responsible for.
                    items:
                      description: InsightTargetKind selects objects by kind.
                      properties:
                        group:
                          description: Group of the kind, empty for the core group.
                          type: string
                        kind:
                          description: Kind of the objects, for example StatefulSet.
                          minLength: 1
                          type: string
                        version:
                          description: Version of the kind, any version matches when
                            empty.
                          type: string
                      required:
                      - kind
                      type: object
                    type: array
                  labelSelector:
                    description: LabelSelector selects objects by their labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: Namespaces the script is responsible for. Cluster
                      scoped objects only match when this is empty.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - script
            type: object
          status:
            description: CustomInsightPriorityStatus defines the observed state of
              CustomInsightPriority
            properties:
              conditions:
                description: Represents the observations of a CustomInsightPriority's
                  current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastError:
                description: LastError is the error of the last evaluation, empty
                  when it succeeded.
                type: string
              lastEvaluation:
                description: LastEvaluation is the outcome of the last evaluation,
                  empty until the script ran.
                properties:
                  durationMs:
                    description: DurationMs is how long the script took.
                    format: int64
                    type: integer
                  ignored:
                    description: Ignored is the number of objects the script ignored.
                    type: integer
                  matched:
                    description: Matched is the number of failing objects the script
                      owned.
                    type: integer
                  overridden:
                    description: Overridden is the number of objects the script gave
                      a priority.
                    type: integer
                  time:
                    description: Time the script last ran with a different outcome
                      than the one before.
                    format: date-time
                    type: string
                required:
                - durationMs
                - ignored
                - matched
                - overridden
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
