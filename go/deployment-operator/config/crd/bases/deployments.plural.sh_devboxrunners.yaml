---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: devboxrunners.deployments.plural.sh
spec:
  group: deployments.plural.sh
  names:
    kind: DevboxRunner
    listKind: DevboxRunnerList
    plural: devboxrunners
    singular: devboxrunner
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Console ID
      jsonPath: .status.id
      name: Id
      type: string
    - description: Current template revision
      jsonPath: .status.templateRevision
      name: Revision
      type: integer
    - description: Resolved image
      jsonPath: .status.resolvedImage
      name: Image
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DevboxRunner is the Schema for the devboxrunners API. It defines one kind of devbox
          (image, agents, limits, egress) backed by a Substrate WorkerPool and ActorTemplate revisions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DevboxRunnerSpec defines the desired state of DevboxRunner.
            properties:
              agents:
                description: Agents are the coding-agent harnesses this devbox supports.
                  Exactly one must be the default.
                items:
                  description: DevboxAgent declares one supported harness.
                  properties:
                    acpV2:
                      description: ACPV2 opts the harness into the ACP v2 protocol
                        where the adapter supports it.
                      type: boolean
                    adapterVersion:
                      description: AdapterVersion pins the ACP adapter version. Defaults
                        to the version shipped in the image.
                      type: string
                    default:
                      description: Default marks the agent used when a workbench doesn't
                        pick one.
                      type: boolean
                    defaultModel:
                      description: DefaultModel is the model new sessions start on.
                      type: string
                    models:
                      description: Models is an allowlist of model ids. Empty allows
                        every model the agent reports.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                    type:
                      description: Type of the harness.
                      enum:
                      - claude
                      - codex
                      - opencode
                      - gemini
                      - pi
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: defaultModel must be one of models
                    rule: '!has(self.defaultModel) || !has(self.models) || size(self.models)
                      == 0 || self.defaultModel in self.models'
                maxItems: 5
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: exactly one agent must be marked default
                  rule: self.filter(a, has(a.default) && a.default).size() == 1
              allowedRepositories:
                description: |-
                  AllowedRepositories the git repositories allowed to be used with this devbox,
                  with the same semantics as AgentRuntime.spec.allowedRepositories.
                items:
                  type: string
                type: array
              autonomy:
                description: |-
                  Autonomy sets how agents' permission requests are answered: the level new threads start at and the highest
                  level users can switch a thread to. Defaults to auto for both, so full autonomy needs an explicit max: full.
                properties:
                  default:
                    description: Default is the level new threads start at, lowered
                      to max and to what the agent supports. Defaults to auto.
                    enum:
                    - manual
                    - auto
                    - full
                    type: string
                  max:
                    description: Max is the highest level a thread can use. Defaults
                      to auto.
                    enum:
                    - manual
                    - auto
                    - full
                    type: string
                type: object
                x-kubernetes-validations:
                - message: default must not be above max
                  rule: '!has(self.default) || !has(self.max) || (self.default ==
                    ''manual'' || self.max == ''full'' || self.default == self.max)'
              bindings:
                description: Bindings control who can use this devbox in console.
                properties:
                  create:
                    description: |-
                      Create bindings control who can attach this devbox to a workbench and start instances on it.
                      Only users and groups resolvable by userEmail or groupName apply. If none are set, console falls
                      back to its global create policy, which admins always pass.
                    items:
                      description: Binding ...
                      properties:
                        UserID:
                          type: string
                        groupID:
                          type: string
                        groupName:
                          type: string
                        id:
                          type: string
                        userEmail:
                          type: string
                      type: object
                    type: array
                type: object
              bootstrapScript:
                description: BootstrapScript runs once during the golden boot, so
                  its results are baked into the snapshot.
                type: string
              browser:
                description: Browser enables the in-box headless browser.
                properties:
                  enabled:
                    type: boolean
                type: object
              cloudIdentities:
                description: CloudIdentities are named cloud identities instances
                  can assume. At most one is the default.
                items:
                  description: DevboxCloudIdentity is one named cloud identity. Exactly
                    one provider must be set.
                  properties:
                    aws:
                      properties:
                        durationSeconds:
                          format: int32
                          maximum: 43200
                          minimum: 900
                          type: integer
                        roleArn:
                          pattern: ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$
                          type: string
                        sessionPolicy:
                          description: SessionPolicy is an inline IAM policy JSON
                            further scoping the session.
                          type: string
                      required:
                      - roleArn
                      type: object
                    azure:
                      properties:
                        clientId:
                          type: string
                        tenantId:
                          type: string
                      required:
                      - clientId
                      - tenantId
                      type: object
                    default:
                      description: Default marks the identity instances get when a
                        workbench doesn't pick one.
                      type: boolean
                    extraHosts:
                      description: ExtraHosts are API hosts allowlisted only when
                        this identity is attached.
                      items:
                        type: string
                      type: array
                    gcp:
                      properties:
                        serviceAccount:
                          description: ServiceAccount is the email of the service
                            account to impersonate.
                          type: string
                        workloadIdentityProvider:
                          description: |-
                            WorkloadIdentityProvider is the full provider resource name
                            (projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>).
                          type: string
                      required:
                      - serviceAccount
                      - workloadIdentityProvider
                      type: object
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of aws, gcp or azure must be set
                    rule: '[has(self.aws), has(self.gcp), has(self.azure)].filter(x,
                      x).size() == 1'
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: at most one cloud identity can be marked default
                  rule: self.filter(i, has(i.default) && i.default).size() <= 1
              cloudProviders:
                default: {}
                description: |-
                  CloudProviders opens egress to cloud providers' API endpoints. A provider is on when the runner has a cloud
                  identity for it, unless set to false.
                properties:
                  aws:
                    description: 'AWS: the regional and global service endpoints under
                      amazonaws.com and api.aws.'
                    type: boolean
                  azure:
                    description: 'Azure: Resource Manager, Entra ID sign-in, Microsoft
                      Graph, Key Vault and Storage.'
                    type: boolean
                  gcp:
                    description: 'GCP: the Google APIs under googleapis.com and Google''s
                      OAuth endpoint.'
                    type: boolean
                type: object
              env:
                description: |-
                  Env are environment variables for every process the box starts: agents, terminals and git. Plain values
                  are part of the template, so changing them rolls a new revision. Secret values are read when an instance
                  wakes and are never baked into the template, the golden snapshot or the workspace volume.
                items:
                  properties:
                    name:
                      maxLength: 256
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                      x-kubernetes-validations:
                      - message: DEVBOX_ variables are reserved
                        rule: '!self.startsWith(''DEVBOX_'')'
                    value:
                      type: string
                    valueFrom:
                      properties:
                        secretKeyRef:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                            namespace:
                              description: Namespace of the Secret; defaults to the
                                operator's namespace.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of value and valueFrom
                    rule: has(self.value) != has(self.valueFrom)
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              httpAllowlist:
                description: HTTPAllowlist are extra hosts instances may reach, on
                  top of the built-in ones.
                items:
                  properties:
                    host:
                      description: Host is a hostname or a *.suffix wildcard.
                      minLength: 1
                      type: string
                    passthrough:
                      description: Passthrough tunnels TLS without interception (no
                        credential injection or request authz).
                      type: boolean
                    port:
                      default: 443
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - host
                  type: object
                maxItems: 256
                type: array
              idlePolicy:
                description: IdlePolicy bounds idle suspension. Workbenches can only
                  lower these values.
                properties:
                  activityWindow:
                    default: 2m
                    description: ActivityWindow is how far back activity counts toward
                      keeping an instance awake.
                    type: string
                  completeAfter:
                    default: 336h
                    description: CompleteAfter is how long a suspended instance is
                      kept before it is completed.
                    type: string
                  cpuThreshold:
                    default: 5%
                    description: CPUThreshold is the CPU utilization above which an
                      instance counts as active, e.g. "5%".
                    pattern: ^([0-9]|[1-9][0-9]|100)(\.[0-9]+)?%$
                    type: string
                  gracePeriod:
                    default: 5m
                    description: GracePeriod is how long an instance stays idle before
                      it is suspended.
                    type: string
                  maxContinuousAwake:
                    default: 24h
                    description: MaxContinuousAwake bounds how long an instance can
                      stay awake.
                    type: string
                  maxDeferral:
                    default: 12h
                    description: MaxDeferral bounds how long agents can defer a suspension.
                    type: string
                type: object
              image:
                description: |-
                  Image is the devbox image. Defaults to ghcr.io/pluralsh/devbox-fat at the operator's version;
                  ghcr.io/pluralsh/devbox-minimal is the lean alternative. Custom images must meet the image
                  contract (sh.plural.devbox/contract=v1 label, devbox-daemon entrypoint, UID 1000) and are
                  normally built FROM one of these.
                type: string
              imagePullSecrets:
                description: |-
                  ImagePullSecrets are dockerconfigjson secrets used only to resolve spec.image to a digest.
                  Nodes pull with their own credentials (Substrate's image credential provider).
                items:
                  description: |-
                    SecretReference represents a Secret Reference. It has enough information to retrieve secret
                    in any namespace
                  properties:
                    name:
                      description: name is unique within a namespace to reference
                        a secret resource.
                      type: string
                    namespace:
                      description: namespace defines the space within which the secret
                        name must be unique.
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              imageUpdatePolicy:
                description: |-
                  ImageUpdatePolicy controls re-resolution of spec.image. Defaults to pinned for digest
                  references and to poll every hour for tag references.
                properties:
                  interval:
                    description: Interval between re-resolutions in poll mode. Defaults
                      to 1h.
                    type: string
                  mode:
                    description: Mode is pinned or poll.
                    enum:
                    - pinned
                    - poll
                    type: string
                type: object
              mise:
                description: Mise is an inline mise.toml installed during the golden
                  boot.
                properties:
                  config:
                    description: Config is the contents of a mise.toml.
                    type: string
                type: object
              name:
                description: Name of the Devbox in console. Defaults to metadata.name.
                type: string
              ociRegistries:
                default: {}
                description: |-
                  OCIRegistries opens egress to public container registries, for pulling images with podman, docker,
                  crane or helm. Docker Hub and GitHub Container Registry are on unless set to false.
                properties:
                  dockerHub:
                    default: true
                    description: 'DockerHub: docker.io, its auth service and its Cloudflare
                      blob CDN. Unqualified image names resolve here.'
                    type: boolean
                  ecr:
                    description: ECR opens private Amazon ECR registries, for any
                      account, in the listed regions.
                    properties:
                      regions:
                        description: |-
                          Regions opens, per region, the registry API (<account>.dkr.ecr.<region>.amazonaws.com), the ECR API
                          that issues login tokens, and the S3 bucket image layers download from.
                        items:
                          pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                          type: string
                        maxItems: 32
                        type: array
                    type: object
                  github:
                    default: true
                    description: 'GitHub: ghcr.io and its blob host.'
                    type: boolean
                  google:
                    description: 'Google: Container Registry (gcr.io and its regional
                      hosts) and Artifact Registry (*.pkg.dev).'
                    type: boolean
                  kubernetes:
                    description: |-
                      Kubernetes: registry.k8s.io and the Artifact Registry mirrors it redirects to. From AWS addresses it
                      redirects to regional S3 buckets instead, which need httpAllowlist entries.
                    type: boolean
                  microsoft:
                    description: 'Microsoft: the Microsoft Artifact Registry, mcr.microsoft.com,
                      and its regional data endpoints.'
                    type: boolean
                  quay:
                    description: 'Quay: quay.io, its CDN and its S3 blob bucket.'
                    type: boolean
                type: object
              packageServers:
                default: {}
                description: |-
                  PackageServers opens egress to public package registries by ecosystem. Go, Rust, JavaScript, Java, Elixir
                  and Python are on unless set to false.
                properties:
                  dotnet:
                    description: 'Dotnet: NuGet.'
                    type: boolean
                  elixir:
                    default: true
                    description: 'Elixir: hex.pm and its package and build repositories.'
                    type: boolean
                  go:
                    default: true
                    description: 'Go: proxy.golang.org and sum.golang.org.'
                    type: boolean
                  java:
                    default: true
                    description: 'Java: Maven Central and the Gradle plugin portal
                      and distributions.'
                    type: boolean
                  javascript:
                    default: true
                    description: 'JavaScript: the npm and yarn registries and nodejs.org.'
                    type: boolean
                  php:
                    description: 'PHP: Packagist.'
                    type: boolean
                  python:
                    default: true
                    description: 'Python: PyPI.'
                    type: boolean
                  ruby:
                    description: 'Ruby: rubygems.org.'
                    type: boolean
                  rust:
                    default: true
                    description: 'Rust: crates.io and rustup''s static.rust-lang.org.'
                    type: boolean
                type: object
              resources:
                description: Resources are the per-instance limits.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    default: "2"
                    description: |-
                      CPU limit per instance. When the WorkerPool has limits this is the minimum, and instances get an even share
                      of the worker's CPU.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  disk:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 20Gi
                    description: |-
                      Disk is the size of the durable /home/dev workspace volume. Each instance slot is budgeted Disk plus Memory
                      for its own snapshot and Memory for each of the WorkerPool's SuspendedSnapshotsPerInstance.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 4Gi
                    description: Memory limit per instance, a minimum in the same
                      way as CPU.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              scmConnections:
                description: ScmConnections are names of console SCM connections instances
                  may use for git credentials.
                items:
                  type: string
                type: array
              substrate:
                description: |-
                  Substrate overrides where the operator reaches the Substrate API and the identity it calls it as. The
                  operator mints the token and reads the CA bundle from the cluster when it reconciles the runner, so
                  nothing is mounted into the operator.
                properties:
                  address:
                    description: Address of ate-api-server. Defaults to the deployment-operator
                      chart's devboxes.substrate.apiAddress.
                    type: string
                  caSignerName:
                    description: |-
                      CASignerName is the signer of the ClusterTrustBundles that verify ate-api-server's serving certificate.
                      Defaults to servicedns.podcert.ate.dev/identity.
                    type: string
                  serviceAccountName:
                    description: |-
                      ServiceAccountName is a ServiceAccount in the operator's namespace that the operator mints Substrate API
                      tokens for. It must be a Substrate global owner, since it creates atespaces and drains workers. Defaults
                      to the operator's own ServiceAccount.
                    type: string
                type: object
              workerPool:
                description: WorkerPool sizes the Substrate WorkerPool backing this
                  runner.
                properties:
                  additionalPools:
                    description: |-
                      AdditionalPools are existing Substrate WorkerPools this runner's instances may also run on. The operator
                      labels each with the runner's worker selector and removes the label when the pool leaves this list. They
                      should run the same sandbox class as the runner, and their free capacity counts toward SpareInstances.
                    items:
                      properties:
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          default: ""
                          description: Namespace defaults to the namespace the operator
                            runs devbox WorkerPools in.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    - namespace
                    x-kubernetes-list-type: map
                  autoscaling:
                    description: |-
                      Autoscaling lets the operator size the pool to demand: it keeps SpareInstances free instance slots and
                      removes only workers that host no instance.
                    properties:
                      maxReplicas:
                        format: int32
                        minimum: 1
                        type: integer
                      minReplicas:
                        default: 1
                        format: int32
                        minimum: 0
                        type: integer
                      scaleDownDelay:
                        default: 10m
                        description: ScaleDownDelay is how long after the last scaling
                          event idle workers are kept before being removed.
                        type: string
                      spareInstances:
                        default: 1
                        description: |-
                          SpareInstances is how many free instance slots are kept across the runner's pools, so a resume doesn't
                          wait for a new worker (and node) to start.
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - maxReplicas
                    type: object
                  diskReservePercent:
                    default: 20
                    description: |-
                      DiskReservePercent of DiskSize is kept for the image cache and snapshot staging rather than budgeted to
                      instances.
                    format: int32
                    maximum: 90
                    minimum: 0
                    type: integer
                  diskSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      DiskSize is the size of the disk backing /var/lib/ate on each worker's node (e.g. the devbox-nodes
                      catalog's data disk). Unset leaves disk out of instance sizing.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxInstances:
                    description: MaxInstances caps concurrently running instances
                      in console. Unset means unlimited.
                    format: int32
                    minimum: 1
                    type: integer
                  nodeAffinity:
                    description: NodeAffinity scheduling rules for the worker pods
                      (WorkerPool template.nodeAffinity).
                    properties:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        description: |-
                          The scheduler will prefer to schedule pods to nodes that satisfy
                          the affinity expressions specified by this field, but it may choose
                          a node that violates one or more of the expressions. The node that is
                          most preferred is the one with the greatest sum of weights, i.e.
                          for each node that meets all of the scheduling requirements (resource
                          request, requiredDuringScheduling affinity expressions, etc.),
                          compute a sum by iterating through the elements of this field and adding
                          "weight" to the sum if the node matches the corresponding matchExpressions; the
                          node(s) with the highest sum are the most preferred.
                        items:
                          description: |-
                            An empty preferred scheduling term matches all objects with implicit weight 0
                            (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                          properties:
                            preference:
                              description: A node selector term, associated with the
                                corresponding weight.
                              properties:
                                matchExpressions:
                                  description: A list of node selector requirements
                                    by node's labels.
                                  items:
                                    description: |-
                                      A node selector requirement is a selector that contains values, a key, and an operator
                                      that relates the key and values.
                                    properties:
                                      key:
                                        description: The label key that the selector
                                          applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          Represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                        type: string
                                      values:
                                        description: |-
                                          An array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. If the operator is Gt or Lt, the values
                                          array must have a single element, which will be interpreted as an integer.
                                          This array is replaced during a strategic merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchFields:
                                  description: A list of node selector requirements
                                    by node's fields.
                                  items:
                                    description: |-
                                      A node selector requirement is a selector that contains values, a key, and an operator
                                      that relates the key and values.
                                    properties:
                                      key:
                                        description: The label key that the selector
                                          applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          Represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                        type: string
                                      values:
                                        description: |-
                                          An array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. If the operator is Gt or Lt, the values
                                          array must have a single element, which will be interpreted as an integer.
                                          This array is replaced during a strategic merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                              type: object
                              x-kubernetes-map-type: atomic
                            weight:
                              description: Weight associated with matching the corresponding
                                nodeSelectorTerm, in the range 1-100.
                              format: int32
                              type: integer
                          required:
                          - preference
                          - weight
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      requiredDuringSchedulingIgnoredDuringExecution:
                        description: |-
                          If the affinity requirements specified by this field are not met at
                          scheduling time, the pod will not be scheduled onto the node.
                          If the affinity requirements specified by this field cease to be met
                          at some point during pod execution (e.g. due to an update), the system
                          may or may not try to eventually evict the pod from its node.
                        properties:
                          nodeSelectorTerms:
                            description: Required. A list of node selector terms.
                              The terms are ORed.
                            items:
                              description: |-
                                A null or empty node selector term matches no objects. The requirements of
                                them are ANDed.
                                The TopologySelectorTerm type implements a subset of the NodeSelectorTerm.
                              properties:
                                matchExpressions:
                                  description: A list of node selector requirements
                                    by node's labels.
                                  items:
                                    description: |-
                                      A node selector requirement is a selector that contains values, a key, and an operator
                                      that relates the key and values.
                                    properties:
                                      key:
                                        description: The label key that the selector
                                          applies to.
