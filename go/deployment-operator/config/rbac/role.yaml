---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deployments.plural.sh
  resources:
  - agentruntimes
  - customhealths
  - imagewarmers
  - kubecostextractors
  - pipelinegates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deployments.plural.sh
  resources:
  - agentruntimes/finalizers
  - customhealths/finalizers
  - imagewarmers/finalizers
  - kubecostextractors/finalizers
  - pipelinegates/finalizers
  verbs:
  - update
- apiGroups:
  - deployments.plural.sh
  resources:
  - agentruntimes/status
  - customhealths/status
  - imagewarmers/status
  - kubecostextractors/status
  - pipelinegates/status
  verbs:
  - get
  - patch
  - update
