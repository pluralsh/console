[package]
name = "ferrotunnel-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube = { version = "4.2", default-features = false, features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
