apiVersion: v1
kind: Secret
metadata:
  name: workbench-tool-creds
  namespace: default
stringData:
  token: "placeholder"
  password: "placeholder"
  apiKey: "placeholder"
  appKey: "placeholder"
  platformToken: "placeholder"
  accessKeyId: "placeholder"
  secretAccessKey: "placeholder"
  clientSecret: "placeholder"
  accessToken: "placeholder"
  apiToken: "placeholder"
  botToken: "xoxb-placeholder"
  privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    placeholder
    -----END RSA PRIVATE KEY-----
---
# Dedicated Docker registry secret so credential rotation can be tested independently:
#   kubectl patch secret workbench-docker-creds -n default --type merge -p '{"stringData":{"token":"rotated-token"}}'
# Then confirm the WorkbenchTool reconciles and Console receives the new token.
apiVersion: v1
kind: Secret
metadata:
  name: workbench-docker-creds
  namespace: default
stringData:
  token: "initial-registry-token"
  password: "initial-registry-password"
  username: "registry-user"
---
apiVersion: deployments.plural.sh/v1alpha1
kind: WorkbenchTool
metadata:
  labels:
    app.kubernetes.io/name: workbenchtool
    app.kubernetes.io/instance: workbenchtool-sample
    app.kubernetes.io/part-of: controller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: controller
  name: workbenchtool-sample
  namespace: default
spec:
  name: workbenchtool_sample
  tool: HTTP
  categories:
    - INTEGRATION
  approval: true
  configuration:
    http:
      url: https://api.example.com/health
      method: GET
      function: true
      inputSchema:
        type: object
        properties:
          endpoint:
            type: string
        required:
          - endpoint
---
