---
# Minimal BindingPolicy: attaches a workbench policy to all matching workbenches.
# policyRef   = the Policy to enforce on matched targets.
# bindPolicyRef = the Policy whose logic determines which targets match.
apiVersion: deployments.plural.sh/v1alpha1
kind: BindingPolicy
metadata:
  labels:
    app.kubernetes.io/name: bindingpolicy
    app.kubernetes.io/instance: bindingpolicy-minimal
    app.kubernetes.io/part-of: controller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: controller
  name: workbench-binding-policy-minimal
spec:
  type: WORKBENCH
  policyRef:
    name: workbench-allow-policy
  bindPolicyRef:
    name: workbench-binding-selector
