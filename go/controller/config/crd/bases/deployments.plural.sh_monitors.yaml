---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: monitors.deployments.plural.sh
spec:
  group: deployments.plural.sh
  names:
    kind: Monitor
    listKind: MonitorList
    plural: monitors
    singular: monitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: ID of the Monitor in the Console API.
      jsonPath: .status.id
      name: ID
      type: string
    - description: Monitor data type.
      jsonPath: .spec.type
      name: TYPE
      type: string
    - description: Severity of alerts generated by this Monitor.
      jsonPath: .spec.severity
      name: SEVERITY
      type: string
    - description: Whether the Monitor is ready.
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Monitor represents an observability monitor attached to a service deployment. It periodically
          evaluates a log or metrics query against a threshold and fires alerts when it is crossed.
          Optionally, it can be attached to a workbench to start an investigation when it fires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the Monitor.
            properties:
              alertTemplate:
                description: AlertTemplate is an optional template used when rendering
                  alert messages for this monitor.
                type: string
              description:
                description: Description is an optional free-form description of what
                  this monitor is checking.
                type: string
              evaluationCron:
                description: |-
                  EvaluationCron is the cron schedule defining when the monitor is evaluated (e.g. */5 * * * *).
                  It must be a cron expression with 5 fields (or 6 with an optional year), separated by single spaces,
                  or one of the @yearly, @annually, @monthly, @weekly, @daily, @midnight, @hourly, @minutely,
                  @secondly or @reboot shortcuts. Field values are validated by the Console API.
                minLength: 1
                pattern: ^(@(?i:yearly|annually|monthly|weekly|daily|midnight|hourly|minutely|secondly|reboot)|[^
                  ]+( [^ ]+){4,5})$
                type: string
              modes:
                description: Modes defines mode-specific options for monitor-triggered
                  workbench jobs.
                properties:
                  budget:
                    description: Budget defines budget limits for the job.
                    properties:
                      cost:
                        description: |-
                          Cost is the maximum cost budget for the job.
                          It is a string to allow decimal values (e.g. "12.5").
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                      tokens:
                        description: Tokens is the maximum token budget for the job.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  coding:
                    description: Coding defines coding mode options for the job.
                    properties:
                      approval:
                        description: Approval requires approval before coding agent
                          runs continue.
                        type: boolean
                      babysit:
                        description: Babysit enables babysit mode for coding agent
                          runs.
                        type: boolean
                      review:
                        description: Review enables pull request review mode for coding
                          agent runs.
                        type: boolean
                    type: object
                  kubernetes:
                    description: Kubernetes defines kubernetes action options for
                      the job.
                    properties:
                      delete:
                        description: Delete enables kubernetes delete actions.
                        type: boolean
                      drain:
                        description: Drain enables kubernetes node drain actions.
                        type: boolean
                      excludeNamespaces:
                        description: ExcludeNamespaces are namespaces the agent can
                          never act in.
                        items:
                          type: string
                        type: array
                      exec:
                        description: Exec enables kubernetes exec actions.
                        type: boolean
                      requireNamespaces:
                        description: RequireNamespaces, if set, are the only namespaces
                          the agent is allowed to act in.
                        items:
                          type: string
                        type: array
                      update:
                        description: Update enables kubernetes update actions.
                        type: boolean
                    type: object
                  model:
                    description: Model overrides the AI model used for the job.
                    properties:
                      model:
                        description: Model is the model name for the job.
                        minLength: 1
                        type: string
                      provider:
                        description: Provider is the AI provider for the job.
                        enum:
                        - OPENAI
                        - ANTHROPIC
                        - OLLAMA
                        - AZURE
                        - BEDROCK
                        - VERTEX
                        - OPENAI_COMPATIBLE
                        - XAI
                        type: string
                    required:
                    - model
                    - provider
                    type: object
                  plan:
                    description: Plan enables planning mode for the job.
                    type: boolean
                  verification:
                    description: Verification enables verification mode for the job.
                    type: boolean
                type: object
              name:
                description: |-
                  Name is the short name used to identify this monitor in the Console API.
                  If not set, metadata.name is used.
                type: string
              prompt:
                description: Prompt is used when the monitor starts a workbench investigation.
                maxLength: 2048
                type: string
              query:
                description: Query is the underlying query configuration used to fetch
                  data for this monitor.
                properties:
                  log:
                    description: Log query used when the monitor type is LOG.
                    properties:
                      bucketSize:
                        description: BucketSize is the time bucket size (e.g. 5m)
                          used when aggregating log results.
                        pattern: ^[0-9]+[dmhs]$
                        type: string
                      duration:
                        description: Duration is the lookback duration for the log
                          query (e.g. 1h, 10m, 30s).
                        pattern: ^[0-9]+[dmhs]$
                        type: string
                      facets:
                        description: Facets are optional key/value facets applied
                          as additional filters on the log query.
                        items:
                          description: MonitorFacet is a key/value facet used to further
                            filter log queries.
                          properties:
                            key:
                              description: Key is the facet key (e.g. kubernetes namespace
                                or pod label name).
                              type: string
                            value:
                              description: Value is the facet value to match for the
                                given key.
                              type: string
                          required:
                          - key
                          - value
                          type: object
                        type: array
                      operator:
                        default: OR
                        description: |-
                          Operator to use when combining multiple log queries.
                          Defaults to OR, which is also the Console API default.
                        enum:
                        - OR
                        - AND
                        type: string
                      options:
                        description: Options are provider-specific log query options.
                        properties:
                          azure:
                            description: Azure log query options.
                            properties:
                              resourceId:
                                description: ResourceID is the Azure resource ID to
                                  query logs for.
                                type: string
                            type: object
                        type: object
                      query:
                        description: Query is the log query string passed through
                          to the underlying log provider.
                        minLength: 1
                        type: string
                      tool:
                        description: Tool is the named workbench logs tool. When omitted,
                          the native Plural logs provider is used.
                        type: string
                    required:
                    - bucketSize
                    - query
                    type: object
                  metrics:
                    description: Metrics query used when the monitor type is METRICS.
                    properties:
                      duration:
                        description: Duration is the lookback duration for the metrics
                          query (e.g. 1h).
                        pattern: ^[0-9]+[dmhs]$
                        type: string
                      options:
                        description: Options are provider-specific metrics query options.
                        properties:
                          azure:
                            description: Azure metrics query options.
                            properties:
                              aggregation:
                                description: Aggregation is the Azure metrics aggregation
                                  type.
                                type: string
                              filter:
                                description: Filter is the Azure metrics filter expression.
                                type: string
                              metricsEndpoint:
                                description: MetricsEndpoint is the Azure metrics
                                  endpoint override.
                                type: string
                              metricsNamespace:
                                description: MetricsNamespace is the Azure metrics
                                  namespace.
                                type: string
                              orderBy:
                                description: OrderBy is the Azure metrics ordering
                                  expression.
                                type: string
                              resourceId:
                                description: ResourceID is the Azure resource ID to
                                  query metrics for.
                                type: string
                              rollUpBy:
                                description: RollUpBy is the Azure metrics dimension
                                  to roll up by.
                                type: string
                            type: object
                        type: object
                      query:
                        description: Query is the metrics query string passed through
                          to the underlying metrics provider.
                        minLength: 1
                        type: string
                      step:
                        description: Step is the metrics query step (e.g. 5m).
                        pattern: ^[0-9]+[dmhs]$
                        type: string
                      tool:
                        description: Tool is the named workbench metrics tool. When
                          omitted, the native Plural metrics provider is used.
                        type: string
                    required:
                    - query
                    type: object
                type: object
                x-kubernetes-validations:
                - message: only one of log or metrics can be set
                  rule: '!(has(self.log) && has(self.metrics))'
              reconciliation:
                description: Reconciliation settings for this resource.
                properties:
                  driftDetection:
                    default: true
                    description: |-
                      DriftDetection enables drift detection for this resource.
                      It is destined to detect changes made to the related
                      resources that are not referenced with owner ref.
                      Use with Interval to set how often drift detection runs.
                    example: false
                    type: boolean
                  interval:
                    default: 30m
                    description: |-
                      Interval for the drift detection mechanism.
                      It is subject to jitter to avoid the thundering herd problem,
                      it is calculated as a random value between 50% and 150% of the given duration.
                    example: 5m30s
                    type: string
                type: object
              service:
                description: |-
                  Service references an existing service in the Console API this monitor is attached to,
                  in the format "cluster-handle/service-name" (e.g. mgmt/console). Use it to attach
                  a monitor to a service that is not managed by a ServiceDeployment resource.
                  Either ServiceRef or Service must be set.
                example: mgmt/console
                pattern: ^[^/]+/[^/]+$
                type: string
              serviceRef:
                description: |-
                  ServiceRef references the ServiceDeployment resource this monitor is attached to.
                  The ServiceDeployment must be in the same namespace as the monitor.
                  Either ServiceRef or Service must be set.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: name is required
                  rule: has(self.name) && size(self.name) > 0
              severity:
                description: Severity is the severity level applied to alerts generated
                  by this monitor.
                enum:
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
                - UNDEFINED
                type: string
              threshold:
                description: Threshold is the configuration that determines when the
                  monitor should fire.
                properties:
                  aggregate:
                    description: Aggregate is the aggregation function applied over
                      the result set.
                    enum:
                    - MAX
                    - MIN
                    - AVG
                    type: string
                  value:
                    description: |-
                      Value is the numeric value the aggregated metric must cross to trigger the alert.
                      It is a string to allow decimal values (e.g. "0.95").
                    pattern: ^-?[0-9]+(\.[0-9]+)?$
                    type: string
                required:
                - aggregate
                - value
                type: object
              type:
                description: Type is the monitor data type.
                enum:
                - LOG
                - METRICS
                type: string
              workbenchRef:
                description: |-
                  WorkbenchRef references the Workbench this monitor is attached to.
                  When set, the monitor can start a workbench investigation when it fires.
                  It is required if the query uses a named workbench tool.
                  The Workbench must be in the same namespace as the monitor.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: name is required
                  rule: has(self.name) && size(self.name) > 0
            required:
            - evaluationCron
            - query
            - severity
            - threshold
            - type
            type: object
            x-kubernetes-validations:
            - message: exactly one of serviceRef or service must be set
              rule: has(self.serviceRef) != has(self.service)
            - message: query.log must be set when type is LOG
              rule: self.type != 'LOG' || has(self.query.log)
            - message: query.metrics must be set when type is METRICS
              rule: self.type != 'METRICS' || has(self.query.metrics)
            - message: workbenchRef is required for tool-backed monitor queries
              rule: has(self.workbenchRef) || !((has(self.query.log) && has(self.query.log.tool))
                || (has(self.query.metrics) && has(self.query.metrics.tool)))
          status:
            description: Status represents the current state of this resource.
            properties:
              conditions:
                description: Represents the observations of a PrAutomation's current
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID of the resource in the Console API.
                type: string
              readonly:
                default: false
                description: ReadOnly indicates whether the resource is read-only.
                type: boolean
              sha:
                description: SHA of last applied configuration.
                type: string
            required:
            - readonly
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
