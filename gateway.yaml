      deprecated: true
      properties:
        description:
          type: string
          description: >-
            A description of what the function does, used by the model to choose
            when and how to call the function.
        name:
          type: string
          description: >-
            The name of the function to be called. Must be a-z, A-Z, 0-9, or
            contain underscores and dashes, with a maximum length of 64.
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
      required:
        - name
    ChatCompletionTool:
      type: object
      title: Function tool
      description: |
        A function tool that can be used to generate a response.
      properties:
        type:
          type: string
          enum:
            - function
          description: The type of the tool. Currently, only `function` is supported.
          x-stainless-const: true
        function:
          $ref: '#/components/schemas/FunctionObject'
      required:
        - type
        - function
    ChatCompletionToolChoiceOption:
      description: >
        Controls which (if any) tool is called by the model.

        `none` means the model will not call any tool and instead generates a
        message.

        `auto` means the model can pick between generating a message or calling
        one or more tools.

        `required` means the model must call one or more tools.

        Specifying a particular tool via `{"type": "function", "function":
        {"name": "my_function"}}` forces the model to call that tool.


        `none` is the default when no tools are present. `auto` is the default
        if tools are present.
      anyOf:
        - type: string
          title: Auto
          description: >
            `none` means the model will not call any tool and instead generates
            a message. `auto` means the model can pick between generating a
            message or calling one or more tools. `required` means the model
            must call one or more tools.
          enum:
            - none
            - auto
            - required
        - $ref: '#/components/schemas/ChatCompletionAllowedToolsChoice'
        - $ref: '#/components/schemas/ChatCompletionNamedToolChoice'
        - $ref: '#/components/schemas/ChatCompletionNamedToolChoiceCustom'
      x-stainless-go-variant-constructor:
        naming: tool_choice_option_{variant}
    FunctionObject:
      type: object
      description: Function object
      properties:
        description:
          type: string
          description: >-
            A description of what the function does, used by the model to choose
            when and how to call the function.
        name:
          type: string
          description: >-
            The name of the function to be called. Must be a-z, A-Z, 0-9, or
            contain underscores and dashes, with a maximum length of 64.
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
        strict:
          type: boolean
          nullable: true
          default: false
          description: >-
            Whether to enable strict schema adherence when generating the
            function call. If set to true, the model will follow the exact
            schema defined in the `parameters` field. Only a subset of JSON
            Schema is supported when `strict` is `true`. Learn more about
            Structured Outputs in the [function calling
            guide](https://platform.openai.com/docs/guides/function-calling).
      required:
        - name
    FunctionParameters:
      type: object
      description: >-
        The parameters the functions accepts, described as a JSON Schema object.
        See the
        [guide](https://platform.openai.com/docs/guides/function-calling) for
        examples, and the [JSON Schema
        reference](https://json-schema.org/understanding-json-schema/) for
        documentation about the format. 


        Omitting `parameters` defines a function with an empty parameter list.
      additionalProperties: true
    ResponseModalities:
      type: array
      nullable: true
      description: >
        Output types that you would like the model to generate.

        Most models are capable of generating text, which is the default:


        `["text"]`


        The `gpt-4o-audio-preview` model can also be used to 

        [generate audio](https://platform.openai.com/docs/guides/audio). To
        request that this model generate 

        both text and audio responses, you can use:


        `["text", "audio"]`
      items:
        type: string
        enum:
          - text
          - audio
    Verbosity:
      type: string
      enum:
        - low
        - medium
        - high
      default: medium
      nullable: true
      description: >
        Constrains the verbosity of the model's response. Lower values will
        result in

        more concise responses, while higher values will result in more verbose
        responses.

        Currently supported values are `low`, `medium`, and `high`.
    ReasoningEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
      default: medium
      nullable: true
      description: >
        Constrains effort on reasoning for 

        [reasoning models](https://platform.openai.com/docs/guides/reasoning).

        Currently supported values are `minimal`, `low`, `medium`, and `high`.
        Reducing

        reasoning effort can result in faster responses and fewer tokens used

        on reasoning in a response.
    WebSearchContextSize:
      type: string
      description: >
        High level guidance for the amount of context window space to use for
        the 

        search. One of `low`, `medium`, or `high`. `medium` is the default.
      enum:
        - low
        - medium
        - high
      default: medium
    WebSearchLocation:
      type: object
      title: Web search location
      description: Approximate location parameters for the search.
      properties:
        country:
          type: string
          description: >
            The two-letter 

            [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the
            user,

            e.g. `US`.
        region:
          type: string
          description: |
            Free text input for the region of the user, e.g. `California`.
        city:
          type: string
          description: |
            Free text input for the city of the user, e.g. `San Francisco`.
        timezone:
          type: string
          description: >
            The [IANA
            timezone](https://timeapi.io/documentation/iana-timezones) 

            of the user, e.g. `America/Los_Angeles`.
    ResponseFormatJsonObject:
      type: object
      title: JSON object
      description: >
        JSON object response format. An older method of generating JSON
        responses.

        Using `json_schema` is recommended for models that support it. Note that
        the

        model will not generate JSON without a system or user message
        instructing it

        to do so.
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_object`.
          enum:
            - json_object
          x-stainless-const: true
      required:
        - type
    ResponseFormatJsonSchema:
      type: object
      title: JSON schema
      description: >
        JSON Schema response format. Used to generate structured JSON responses.

        Learn more about [Structured
        Outputs](https://platform.openai.com/docs/guides/structured-outputs).
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_schema`.
          enum:
            - json_schema
          x-stainless-const: true
        json_schema:
          type: object
          title: JSON schema
          description: |
            Structured Outputs configuration options, including a JSON Schema.
          properties:
            description:
              type: string
              description: >
                A description of what the response format is for, used by the
                model to

                determine how to respond in the format.
            name:
              type: string
              description: >
                The name of the response format. Must be a-z, A-Z, 0-9, or
                contain

                underscores and dashes, with a maximum length of 64.
            schema:
              $ref: '#/components/schemas/ResponseFormatJsonSchemaSchema'
            strict:
              type: boolean
              nullable: true
              default: false
              description: >
                Whether to enable strict schema adherence when generating the
                output.

                If set to true, the model will always follow the exact schema
                defined

                in the `schema` field. Only a subset of JSON Schema is supported
                when

                `strict` is `true`. To learn more, read the [Structured Outputs

                guide](https://platform.openai.com/docs/guides/structured-outputs).
          required:
            - name
      required:
        - type
        - json_schema
    ResponseFormatJsonSchemaSchema:
      type: object
      title: JSON schema
      description: |
        The schema for the response format, described as a JSON Schema object.
        Learn how to build JSON schemas [here](https://json-schema.org/).
      additionalProperties: true
    ResponseFormatText:
      type: object
      title: Text
      description: |
        Default response format. Used to generate text responses.
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `text`.
          enum:
            - text
          x-stainless-const: true
      required:
        - type
    VoiceIdsShared:
      description: >
        The voice the model uses to respond. Supported voices are

        `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`, `nova`, `onyx`,
        `sage`, and `shimmer`.
      example: ash
      anyOf:
        - type: string
        - type: string
          enum:
            - alloy
            - ash
            - ballad
            - coral
            - echo
            - sage
            - shimmer
            - verse
            - marin
            - cedar
    StopConfiguration:
      description: |
        Not supported with latest reasoning models `o3` and `o4-mini`.

        Up to 4 sequences where the API will stop generating further tokens. The
        returned text will not contain the stop sequence.
      nullable: true
      anyOf:
        - type: string
          default: <|endoftext|>
          example: |+

          nullable: true
        - type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            example: '["\n"]'
    PredictionContent:
      type: object
      title: Static Content
      description: >
        Static predicted output content, such as the content of a text file that
        is

        being regenerated.
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - content
          description: |
            The type of the predicted content you want to provide. This type is
            currently always `content`.
          x-stainless-const: true
        content:
          description: >
            The content that should be matched when generating a model response.

            If generated tokens would match this content, the entire model
            response

            can be returned much more quickly.
          anyOf:
            - type: string
              title: Text content
              description: |
                The content used for a Predicted Output. This is often the
                text of a file you are regenerating with minor changes.
            - type: array
              description: >-
                An array of content parts with a defined type. Supported options
                differ based on the
                [model](https://platform.openai.com/docs/models) being used to
                generate the response. Can contain text inputs.
              title: Array of content parts
              items:
                $ref: >-
                  #/components/schemas/ChatCompletionRequestMessageContentPartText
              minItems: 1
    ParallelToolCalls:
      description: >-
        Whether to enable [parallel function
        calling](https://platform.openai.com/docs/guides/function-calling#configuring-parallel-function-calling)
        during tool use.
      type: boolean
      default: true
    CustomToolChatCompletions:
      type: object
      title: Custom tool
      description: |
        A custom tool that processes input using a specified format.
      properties:
        type:
          type: string
          enum:
            - custom
          description: The type of the custom tool. Always `custom`.
          x-stainless-const: true
        custom:
          type: object
          title: Custom tool properties
          description: |
            Properties of the custom tool.
          properties:
            name:
              type: string
              description: The name of the custom tool, used to identify it in tool calls.
            description:
              type: string
              description: >
                Optional description of the custom tool, used to provide more
                context.
            format:
              description: >
                The input format for the custom tool. Default is unconstrained
                text.
              anyOf:
                - type: object
                  title: Text format
                  description: Unconstrained free-form text.
                  properties:
                    type:
                      type: string
                      enum:
                        - text
                      description: Unconstrained text format. Always `text`.
                      x-stainless-const: true
                  required:
                    - type
                  additionalProperties: false
                - type: object
                  title: Grammar format
                  description: A grammar defined by the user.
                  properties:
                    type:
                      type: string
                      enum:
                        - grammar
                      description: Grammar format. Always `grammar`.
                      x-stainless-const: true
                    grammar:
                      type: object
                      title: Grammar format
                      description: Your chosen grammar.
                      properties:
                        definition:
                          type: string
                          description: The grammar definition.
                        syntax:
                          type: string
                          description: >-
                            The syntax of the grammar definition. One of `lark`
                            or `regex`.
                          enum:
                            - lark
                            - regex
                      required:
                        - definition
                        - syntax
                  required:
                    - type
                    - grammar
                  additionalProperties: false
              discriminator:
                propertyName: type
          required:
            - name
      required:
        - type
        - custom
    CreateChatCompletionResponse:
      type: object
      description: >-
        Represents a chat completion response returned by model, based on the
        provided input.
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          description: >-
            A list of chat completion choices. Can be more than one if `n` is
            greater than 1.
          items:
            type: object
            required:
              - finish_reason
              - index
              - message
              - logprobs
            properties:
              finish_reason:
                type: string
                description: >
                  The reason the model stopped generating tokens. This will be
                  `stop` if the model hit a natural stop point or a provided
                  stop sequence,

                  `length` if the maximum number of tokens specified in the
                  request was reached,

                  `content_filter` if content was omitted due to a flag from our
                  content filters,

                  `tool_calls` if the model called a tool, or `function_call`
                  (deprecated) if the model called a function.
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
              index:
                type: integer
                description: The index of the choice in the list of choices.
              message:
                $ref: '#/components/schemas/ChatCompletionResponseMessage'
              logprobs:
                description: Log probability information for the choice.
                type: object
                nullable: true
                properties:
                  content:
                    description: >-
                      A list of message content tokens with log probability
                      information.
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatCompletionTokenLogprob'
                    nullable: true
                  refusal:
                    description: >-
                      A list of message refusal tokens with log probability
                      information.
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatCompletionTokenLogprob'
                    nullable: true
                required:
                  - content
                  - refusal
        created:
          type: integer
          description: >-
            The Unix timestamp (in seconds) of when the chat completion was
            created.
        model:
          type: string
          description: |
            ID of the model to use.
            Supported model:
            - `claude-4.7-opus`
        service_tier:
          $ref: '#/components/schemas/ServiceTier'
        system_fingerprint:
          type: string
          deprecated: true
          description: >
            This fingerprint represents the backend configuration that the model
            runs with.


            Can be used in conjunction with the `seed` request parameter to
            understand when backend changes have been made that might impact
            determinism.
        object:
          type: string
          description: The object type, which is always `chat.completion`.
          enum:
            - chat.completion
          x-stainless-const: true
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        metadata:
          type: object
          description: Metadata about the response.
          properties:
            latency:
              type: integer
              format: int64
              description: The processing time in milliseconds.
              example: 5000
            guardrails:
              type: object
              description: Contains summary information about a guardrail evaluation.
              properties:
                result:
                  type: string
                  description: >
                    Overall result of the guardrail evaluation. Returned values
                    are **ALLOW**, **DISALLOW**, **EXECUTED**, or
                    **UNEXECUTED**.

                    - If a value of **ALLOW** is returned, then a determination
                    has been made that the statement is allowed.

                    - If a value of **DISALLOWED** is returned, then the
                    determination has been made that the statement is not
                    allowed.

                    - If a value of **EXECUTED** is returned, the rail has been
                    executed, but no matches have been made to determine whether
                    the statement is allowed or disallowed.

                    - If a value of **UNEXECUTED** is returned, the rail was not
                    executed, and therefore no determination on whether the
                    statement is allowed or disallowed has been made.
                  example: ALLOW
                blockingGuardrail:
                  type: object
                  description: >-
                    Details about the specific guardrail that blocked the
                    request. This section will only be populated if the result
                    is not ALLOW.
                  properties:
                    guardrailType:
                      type: string
                      description: Type of the blocking guardrail (e.g., input, output).
                      example: input
                    guardrailId:
                      type: string
                      description: ID of the blocking guardrail policy.
                      example: gr-12345
                    resultDetails:
                      type: object
                      description: >-
                        Aggregates all rail result types for the guardrail
                        check. This schema is taken directly from the GenAI
                        Guardrails API.
                      properties:
                        similarityRailsResult:
                          type: object
                          description: Details on similarity rails evaluation of an input.
                          properties:
                            result:
                              type: string
                              description: Result status for similarity rails.
                              example: ALLOW
                            similarityRailsDetails:
                              type: array
                              description: >-
                                When similarity rails are run, we get
                                essentially run similarity search, which means
                                we get search results. Each search result is
                                captured in this array.
                              items:
                                type: object
                                description: >-
                                  A representation of the search result, which
                                  rail the search result is from, and some
                                  debugging information on why a determination
                                  was made.
                                properties:
                                  railName:
                                    type: string
                                    description: >-
                                      Name of the similarity rail that the
                                      result belongs to.
                                    example: negative light
                                  railConfiguredThreshold:
                                    type: number
                                    format: double
                                    description: >-
                                      The configured threshold for the
                                      similarity rail, configured through the
                                      Management API.
                                    example: 0.45
                                  railPriority:
                                    type: integer
                                    description: >-
                                      What priority did this rail have over
                                      other rails.
                                    example: 3
                                  searchResultScore:
                                    type: number
                                    format: double
                                    description: The score of the result.
                                    example: 1.12
                                  searchResultText:
                                    type: string
                                    description: The text chunk of the sample.
                                    example: How can I open a checking account?
                                  isRailAllowed:
                                    type: boolean
                                    description: >-
                                      Is the rail this sample is associated with
                                      an allowed or disallowed rail.
                                    example: false
                        regexRailsResult:
                          type: object
                          description: Details on regex rails evaluation.
                          properties:
                            result:
                              type: string
                              description: Result status for regex rails.
                              example: ALLOW
                            regexRailsDetails:
                              type: array
                              description: >-
                                List of regex configurations that matched.
                                Unmatched regexes do not show up here.
                              items:
                                type: object
                                description: A representation of a regex rail that matched.
                                properties:
                                  regexName:
                                    type: string
                                    description: The name of the regex rail that matched.
                                    example: Phone number regex
                        wordRailsResult:
                          type: object
                          description: >-
                            Details on the evaluation of word rails, the words
                            that matched will be included here.
                          properties:
                            result:
                              type: string
                              description: Result status for word rails.
                              example: ALLOW
                            wordRailsDetails:
                              type: array
                              description: A list of words that matched.
                              items:
                                type: object
                                description: A representation of the word that matched.
                                properties:
                                  blockedWord:
                                    type: string
                                    description: >-
                                      The name given to the word that matched at
                                      time of configuration.
                                    example: Chase
                        modelRailsResult:
                          type: object
                          description: Details on the evaluation of model rails.
                          properties:
                            result:
                              type: string
                              description: Result status for model rails.
                              example: ALLOW
                            modelRailsDetails:
                              type: array
                              description: >-
                                A list of details relating a model evaluation
                                failure.
                              items:
                                type: object
                                description: >-
                                  A representation of a single model call,
                                  includes fields about rail settings and
                                  results.
                                properties:
                                  railName:
                                    type: string
                                    description: >-
                                      Name that describes the criteria to be
                                      evaluated using a model.
                                    example: negative light
                                  railConfiguredThreshold:
                                    type: number
                                    format: double
                                    description: >-
                                      The configured threshold for the model
                                      rail.
                                    example: 0.45
                                  modelName:
                                    type: string
                                    description: >-
                                      Name that was used to evaluate the
                                      messages for the given criteria.
                                    example: claude-4.7-opus
                                  modelScore:
                                    type: number
                                    format: double
                                    description: >-
                                      score determined by the model for the
                                      given promptTemplate in the config.
                                    example: 1.12
                                  modelExplanation:
                                    type: string
                                    description: >-
                                      The explanation generated by the model for
                                      the given score.
                                    example: >-
                                      The context provided makes the response
                                      high on groundedness. Score: 8
        error:
          type: string
          description: An error message, if any occurred.
          example: Error message
    ChatCompletionTokenLogprob:
      type: object
      properties:
        token:
          description: The token.
          type: string
        logprob:
          description: >-
            The log probability of this token, if it is within the top 20 most
            likely tokens. Otherwise, the value `-9999.0` is used to signify
            that the token is very unlikely.
          type: number
        bytes:
          description: >-
            A list of integers representing the UTF-8 bytes representation of
            the token. Useful in instances where characters are represented by
            multiple tokens and their byte representations must be combined to
            generate the correct text representation. Can be `null` if there is
            no bytes representation for the token.
          type: array
          items:
            type: integer
          nullable: true
        top_logprobs:
          description: >-
            List of the most likely tokens and their log probability, at this
            token position. In rare cases, there may be fewer than the number of
            requested `top_logprobs` returned.
          type: array
          items:
            type: object
            properties:
              token:
                description: The token.
                type: string
              logprob:
                description: >-
                  The log probability of this token, if it is within the top 20
                  most likely tokens. Otherwise, the value `-9999.0` is used to
                  signify that the token is very unlikely.
                type: number
              bytes:
                description: >-
                  A list of integers representing the UTF-8 bytes representation
                  of the token. Useful in instances where characters are
                  represented by multiple tokens and their byte representations
                  must be combined to generate the correct text representation.
                  Can be `null` if there is no bytes representation for the
                  token.
                type: array
                items:
                  type: integer
                nullable: true
            required:
              - token
              - logprob
              - bytes
      required:
        - token
        - logprob
        - bytes
        - top_logprobs
    CompletionUsage:
      type: object
      description: Usage statistics for the completion request.
      properties:
        completion_tokens:
          type: integer
          default: 0
          description: Number of tokens in the generated completion.
        prompt_tokens:
          type: integer
          default: 0
          description: Number of tokens in the prompt.
        total_tokens:
          type: integer
          default: 0
          description: Total number of tokens used in the request (prompt + completion).
        completion_tokens_details:
          type: object
          description: Breakdown of tokens used in a completion.
          properties:
            accepted_prediction_tokens:
              type: integer
              default: 0
              description: |
                When using Predicted Outputs, the number of tokens in the
                prediction that appeared in the completion.
            audio_tokens:
              type: integer
              default: 0
              description: Audio input tokens generated by the model.
            reasoning_tokens:
              type: integer
              default: 0
              description: Tokens generated by the model for reasoning.
            rejected_prediction_tokens:
              type: integer
              default: 0
              description: >
                When using Predicted Outputs, the number of tokens in the

                prediction that did not appear in the completion. However, like

                reasoning tokens, these tokens are still counted in the total

                completion tokens for purposes of billing, output, and context
                window

                limits.
        prompt_tokens_details:
          type: object
          description: Breakdown of tokens used in the prompt.
          properties:
            audio_tokens:
              type: integer
              default: 0
              description: Audio input tokens present in the prompt.
            cached_tokens:
              type: integer
              default: 0
              description: Cached tokens present in the prompt.
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
    ChatCompletionResponseMessage:
      type: object
      description: A chat completion message generated by the model.
      properties:
        content:
          type: string
          description: The contents of the message.
          nullable: true
        refusal:
          type: string
          description: The refusal message generated by the model.
          nullable: true
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
        annotations:
          type: array
          description: >
            Annotations for the message, when applicable, as when using the

            [web search
            tool](https://platform.openai.com/docs/guides/tools-web-search?api-mode=chat).
          items:
            type: object
            description: |
              A URL citation when using web search.
            required:
              - type
              - url_citation
            properties:
              type:
                type: string
                description: The type of the URL citation. Always `url_citation`.
                enum:
                  - url_citation
                x-stainless-const: true
              url_citation:
                type: object
                description: A URL citation when using web search.
                required:
                  - end_index
                  - start_index
                  - url
                  - title
                properties:
                  end_index:
                    type: integer
                    description: >-
                      The index of the last character of the URL citation in the
                      message.
                  start_index:
                    type: integer
                    description: >-
                      The index of the first character of the URL citation in
                      the message.
                  url:
                    type: string
                    description: The URL of the web resource.
                  title:
                    type: string
                    description: The title of the web resource.
        role:
          type: string
          enum:
            - assistant
          description: The role of the author of this message.
          x-stainless-const: true
        function_call:
          type: object
          deprecated: true
          description: >-
            Deprecated and replaced by `tool_calls`. The name and arguments of a
            function that should be called, as generated by the model.
          properties:
            arguments:
              type: string
              description: >-
                The arguments to call the function with, as generated by the
                model in JSON format. Note that the model does not always
                generate valid JSON, and may hallucinate parameters not defined
                by your function schema. Validate the arguments in your code
                before calling your function.
            name:
              type: string
              description: The name of the function to call.
          required:
            - name
            - arguments
        audio:
          type: object
          nullable: true
          description: >
            If the audio output modality is requested, this object contains data

            about the audio response from the model. [Learn
            more](https://platform.openai.com/docs/guides/audio).
          required:
            - id
            - expires_at
            - data
            - transcript
          properties:
            id:
              type: string
              description: Unique identifier for this audio response.
            expires_at:
              type: integer
              description: >
                The Unix timestamp (in seconds) for when this audio response
                will

                no longer be accessible on the server for use in multi-turn

                conversations.
            data:
              type: string
              description: |
                Base64 encoded audio bytes generated by the model, in the format
                specified in the request.
            transcript:
              type: string
              description: Transcript of the audio generated by the model.
      required:
        - role
        - content
        - refusal
    Choice:
      type: object
      properties:
        text:
          type: string
          description: The generated text completion.
          example: Hello. This is a test response.
        index:
          type: integer
          description: The index of the choice in the list of choices.
          example: 0
        logprobs:
          $ref: '#/components/schemas/Logprobs'
        finish_reason:
          type: string
          nullable: true
          description: The reason the model stopped generating tokens.
          enum:
            - stop
            - length
            - content_filter
            - function_call
            - tool_calls
          example: stop
    Logprobs:
      type: object
      description: >-
        Include the log probabilities on the logprobs most likely output tokens,
        as well the chosen tokens.
      nullable: true
      properties:
        tokens:
          type: array
          items:
            type: string
          description: The tokens in the completion.
        token_logprobs:
          type: array
          items:
            type: number
            format: float
          description: The log probability of each token in the completion.
        top_logprobs:
          type: array
          items:
            type: object
            additionalProperties:
              type: number
              format: float
          description: >
            A list of the most likely tokens and their log probability, at each
            token position.

            Will be `null` if `logprobs` is not used.
        text_offset:
          type: array
          items:
            type: integer
          description: The character offset of each token in the completion.
    BedrockClaudeMessagesRequestBody:
      type: object
      description: >-
        The request body payload for invoking Anthropic Claude Sonnet for
        Bedrock Invoke.
      required:
        - anthropic_version
        - max_tokens
        - messages
      properties:
        anthropic_version:
          type: string
          description: The version of the Anthropic invocation schema.
          enum:
            - bedrock-2023-05-31
          example: bedrock-2023-05-31
        anthropic_beta:
          type: array
          description: Optional list of beta features to enable.
          items:
            type: string
            example: computer-use-2024-10-22
          nullable: true
        max_tokens:
          type: integer
          description: The maximum number of tokens to generate before stopping.
          example: 1024
        system:
          description: >-
            System prompt providing context and instructions to the model. Can
            be a string or an array of text blocks.
          oneOf:
            - type: string
              example: You are a helpful assistant.
            - type: array
              items:
                $ref: '#/components/schemas/BedrockClaudeInputTextBlock'
          nullable: true
        messages:
          type: array
          description: Input messages forming the conversation history.
          minItems: 1
          items:
            $ref: '#/components/schemas/BedrockClaudeInputMessage'
        metadata:
          $ref: '#/components/schemas/BedrockClaudeMetadata'
        temperature:
          type: number
          format: float
          description: >-
            Amount of randomness injected into the response (0.0 to 1.0). You
            should either alter temperature or top_p, but not both.
          minimum: 0
          maximum: 1
          default: 1
          nullable: true
        thinking:
          $ref: '#/components/schemas/BedrockClaudeThinkingConfig'
        top_p:
          type: number
          format: float
          description: >-
            Use nucleus sampling. You should either alter temperature or top_p,
            but not both. Recommended for advanced use cases only. You usually
            only need to use temperature.
          minimum: 0
          maximum: 1
          default: 0.999
          nullable: true
        top_k:
          type: integer
          description: >-
            Sample from the top K options for each subsequent token.  NOTE -
            Cannot be set when `thinking` is enabled.
          minimum: 0
          maximum: 500
          nullable: true
        tools:
          type: array
          description: Definitions of tools that the model may use (Requires Claude 3+).
          items:
            $ref: '#/components/schemas/BedrockClaudeToolDefinition'
          nullable: true
        tool_choice:
          $ref: '#/components/schemas/BedrockClaudeToolChoice'
        stop_sequences:
          type: array
          description: >-
            Custom text sequences that will cause the model to stop generating.
            Max 8191 items.
          items:
            type: string
          maxItems: 8191
          nullable: true
    BedrockClaudeInputMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: The role of the conversation turn.
          enum:
            - user
            - assistant
        content:
          description: >-
            The content of the turn. Can be a string (shorthand for a single
            text block) or an array of content blocks.
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/BedrockClaudeInputContentBlock'
            - type: string
    BedrockClaudeInputContentBlock:
      oneOf:
        - $ref: '#/components/schemas/BedrockClaudeInputTextBlock'
        - $ref: '#/components/schemas/BedrockClaudeInputImageBlock'
        - $ref: '#/components/schemas/BedrockClaudeInputThinkingBlock'
        - $ref: '#/components/schemas/BedrockClaudeInputRedactedThinkingBlock'
    BedrockClaudeInputTextBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          description: The type of input.
          enum:
            - text
        text:
          type: string
          description: The text content.
    BedrockClaudeInputImageBlock:
      type: object
      required:
        - type
        - source
      properties:
        type:
          type: string
          description: Type.
          enum:
            - image
        source:
          $ref: '#/components/schemas/BedrockClaudeImageSource'
    BedrockClaudeImageSource:
      type: object
      description: Image source.
      required:
        - type
        - media_type
        - data
      properties:
        type:
          type: string
          description: The encoding type for the image.
          enum:
            - base64
        media_type:
          type: string
          description: The media type of the image.
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        data:
          type: string
          format: byte
          description: The base64 encoded image bytes. Max size 3.75MB. Max dims 8000px.
    BedrockClaudeInputThinkingBlock:
      type: object
      description: >-
        A block representing a previously received thinking step, sent back to
        maintain context, especially during tool use.
      required:
        - type
        - thinking
        - signature
      properties:
        type:
          type: string
          description: The type of content block.
          enum:
            - thinking
        thinking:
          type: string
          description: The text content of the model's original thought.
        signature:
          type: string
          description: >-
            The opaque signature received from the model for this thinking
            block.
    BedrockClaudeInputRedactedThinkingBlock:
      type: object
      description: >-
        A block representing previously received redacted (encrypted) thinking,
        sent back to maintain context.
      required:
        - type
        - data
      properties:
        type:
          type: string
          description: The type of content block.
          enum:
            - redacted_thinking
        data:
          type: string
          description: >-
            The opaque encrypted data received from the model for this redacted
            block.
    BedrockClaudeToolDefinition:
      oneOf:
        - $ref: '#/components/schemas/BedrockClaudeCustomTool'
        - $ref: '#/components/schemas/BedrockClaudeComputerTool'
        - $ref: '#/components/schemas/BedrockClaudeBashTool'
        - $ref: '#/components/schemas/BedrockClaudeTextEditorTool'
    BedrockClaudeCustomTool:
      type: object
      description: Definition for a custom tool.
      required:
        - name
        - input_schema
      properties:
        type:
          type: string
          description: Optional type specifier.
          enum:
            - custom
          nullable: true
        name:
          type: string
          description: The name of the tool.
        description:
          type: string
          description: Strongly recommended description of the tool's purpose and function.
          nullable: true
        input_schema:
          type: object
          description: >-
            JSON Schema object defining the input parameters for the tool. Top
            level must be 'object'.
          additionalProperties: true
    BedrockClaudeComputerTool:
      type: object
      description: Definition for the built-in computer use tool.
      required:
        - type
        - name
        - display_height_px
        - display_width_px
      properties:
        type:
          type: string
          description: Type
          enum:
            - computer_20241022
        name:
          type: string
          description: Name
          enum:
            - computer
        display_height_px:
          type: integer
          description: The height of the display in pixels.
          minimum: 1
        display_width_px:
          type: integer
          description: The width of the display in pixels.
          minimum: 1
        display_number:
          type: integer
          description: The display number (e.g., for X11 environments).
          minimum: 0
          nullable: true
    BedrockClaudeBashTool:
      type: object
      description: Definition for the built-in bash tool.
      required:
        - type
        - name
      properties:
        type:
          type: string
          description: Type
          enum:
            - bash_20241022
        name:
          type: string
          description: Name
          enum:
            - bash
    BedrockClaudeTextEditorTool:
      type: object
      description: Definition for the built-in text editor tool.
      required:
        - type
        - name
      properties:
        type:
          type: string
          description: Type
          enum:
            - text_editor_20241022
        name:
          type: string
          description: Name
          enum:
            - str_replace_editor
    BedrockClaudeToolChoice:
      type: object
      description: Specifies how the model should use the provided tools.
      required:
        - type
      properties:
        type:
          type: string
          description: The type of tool selection strategy.
          enum:
            - any
            - auto
            - tool
        name:
          type: string
          description: >-
            The name of the specific tool to use. Required only if 'type' is
            'tool'.
          nullable: true
    BedrockClaudeThinkingConfig:
      type: object
      description: >-
        Configuration for enabling Claude's extended thinking. When enabled,
        responses include thinking content blocks showing Claude's thinking
        process before the final answer. `top_k` cannot be set when thinking is
        enabled.
      oneOf:
        - $ref: '#/components/schemas/BedrockClaudeThinkingEnabled'
    BedrockClaudeThinkingEnabled:
      type: object
      required:
        - type
        - budget_tokens
      properties:
        type:
          type: string
          description: Enabled or disabled.
          enum:
            - enabled
            - disabled
        budget_tokens:
          type: integer
          description: >-
            Determines how many tokens Claude can use for its internal reasoning
            process. Larger budgets can enable more thorough analysis for
            complex problems, improving response quality. Must be less than
            `max_tokens`.
          minimum: 1024
          example: 5000
    BedrockClaudeMetadata:
      type: object
      description: Optional metadata about the request.
      properties:
        user_id:
          type: string
          description: >-
            An external identifier for the user associated with the request
            (e.g., a UUID or hash). Do not include any identifying information
            such as name, email address, or phone number.
          example: 13803d75-b4b5-4c3e-b2f2-1399b051b
          maxLength: 256
          nullable: true
    BedrockClaudeMessagesResponse:
      type: object
      description: >-
        Represents a message response from the model, based on the provided
        input via Bedrock/Claude Messages API.
      properties:
        id:
          type: string
          description: Unique object identifier for the message response.
          example: bedrock_01AFUD7rQ12345EXAMPLE
        type:
          type: string
          description: Object type, always "message".
          enum:
            - message
        role:
          type: string
          description: Conversational role of the generated message, always "assistant".
          enum:
            - assistant
        content:
          type: array
          description: >-
            Content generated by the model, as an array of content blocks (e.g.,
            text, tool_use).
          items:
            oneOf:
              - $ref: '#/components/schemas/BedrockClaudeResponseTextBlock'
              - $ref: '#/components/schemas/BedrockClaudeResponseToolUseBlock'
              - $ref: '#/components/schemas/BedrockClaudeResponseThinkingBlock'
              - $ref: >-
                  #/components/schemas/BedrockClaudeResponseRedactedThinkingBlock
        model:
          type: string
          description: |
            ID of the model to use.
            Supported model:
            - `claude-4.7-opus`
          example: claude-4.7-opus
        stop_reason:
          type: string
          description: The reason the model stopped generating tokens.
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
            - tool_use
            - pause_turn
            - refusal
            - model_context_window_exceeded
          nullable: true
        stop_sequence:
          type: string
          description: Which custom stop sequence was generated, if any.
          nullable: true
        usage:
          $ref: '#/components/schemas/BedrockClaudeUsage'
      required:
        - id
        - type
        - role
        - content
        - model
        - usage
    BedrockClaudeResponseTextBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          description: Type
          enum:
            - text
        text:
          type: string
          description: Text
    BedrockClaudeResponseToolUseBlock:
      type: object
      required:
        - type
        - id
        - name
        - input
      properties:
        type:
          type: string
          description: Type
          enum:
            - tool_use
        id:
          type: string
          description: Unique identifier for this specific tool use instance.
        name:
          type: string
          description: The name of the tool requested by the model.
        input:
          type: object
          description: The input parameters for the tool, matching the tool's input_schema.
          additionalProperties: true
    BedrockClaudeResponseThinkingBlock:
      type: object
      description: A block representing the model's internal thinking process.
      required:
        - type
        - thinking
        - signature
      properties:
        type:
          type: string
          description: The type of content block.
          enum:
            - thinking
        thinking:
          type: string
          description: The text content of the model's thought.
        signature:
          type: string
          description: The opaque signature for verifying the thinking block.
    BedrockClaudeResponseRedactedThinkingBlock:
      type: object
      description: >-
        A block representing redacted (encrypted) thinking content due to safety
        systems.
      required:
        - type
        - data
      properties:
        type:
          type: string
          description: The type of content block.
          enum:
            - redacted_thinking
        data:
          type: string
          description: The opaque encrypted data representing the redacted thought.
    BedrockClaudeUsage:
      type: object
      description: >-
        Billing and rate-limit usage information returned by Bedrock for the
        Claude request. Structure may vary slightly from direct Anthropic API.
      required:
        - input_tokens
        - output_tokens
      properties:
        input_tokens:
          type: integer
          description: The number of input tokens used.
        output_tokens:
          type: integer
          description: The number of output tokens generated.
    4xxErrorResponse:
      type: object
      description: 4xx error response of the endpoint.
      properties:
        error:
          type: object
          description: The error information.
          properties:
            code:
              type: integer
              description: The HTTP status code.
              example: 400
            message:
              type: string
              description: A developer-facing error message.
              example: 'Error reading request body: json: unknown field "modelId"'
            request_id:
              type: string
              description: The unique request ID.
              example: bcd0746d0efd/y7MPJIrfqM-000004
    5xxErrorResponse:
      type: object
      description: 5xx error response of the endpoint.
      properties:
        error:
          type: object
          description: The error information.
          properties:
            code:
              type: integer
              description: The HTTP status code.
              example: 500
            message:
              type: string
              description: A developer-facing error message.
              example: Internal Server Error
            request_id:
              type: string
              description: The unique request ID.
              example: bcd0746d0efd/y7MPJIrfqM-000005