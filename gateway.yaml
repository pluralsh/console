openapi: 3.0.3
info:
  title: claude-4.7-opus
  version: '1.0'
  description: >
    The Foundation Model (FM) Gateway API serves as a unified and secure entry
    point for interacting with a variety of powerful Large Language Models
    (LLMs). By acting as a central hub, it simplifies development and enhances
    security by providing a single, consistent interface for different
    underlying models.

    ***

    ## Supported Endpoints 🌐

    * **`/v1/completions` (Completions):** Takes a text prompt and generates a
    single text completion or continuation in response.

    * **`/v1/chat/completions` (Chat Completions):** Processes a sequence of
    messages representing a conversation and generates the next message in the
    dialogue.

    * **`/model/{modelId}/invoke:` (Bedrock Invoke):** Send a structured list of
    input messages using the Bedrock Messages API format, and the model will
    generate the next message in the conversation.



    ***

     ## Important Note
     
     While our API structure is modeled after the OpenAI specification, it's important to note that the FM Gateway implements a specific subset of the available parameters to ensure security and performance.

    - For general information on the API's request and response structure, you
    can refer to the foundational [OpenAI API
    documentation](https://platform.openai.com/docs/api-reference/).


    - **Crucially, before building your requests, you must consult this
    [document](https://docs.google.com/document/d/1dhAXBg2GeK-LPF3nz0hOicrpHAoYUpZMHlh_6JqOmlU/edit?tab=t.s48qbpq9cm1l#heading=h.k6duj0ii9gfc)
    for the definitive list of which fields and parameters are actually
    supported through the gateway. Using unsupported fields will result in an
    error.**
servers:
  - url: ''
paths:
  /model/claude-4.7-opus/invoke:
    post:
      tags:
        - Bedrock Invoke
      summary: Creates a response using the Bedrock Invoke Messages API format.
      description: >
        Creates a model response based on a structured list of input messages
        and parameters. 

        This endpoint uses the [Bedrock Invoke Messages API
        format](https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-request-response.html). 

        Returns the assistant's message and metadata.
      operationId: createMessage
      parameters:
        - name: Client-Correlation-Id
          in: header
          description: Unique key used across systems to identify and correlate requests.
          required: false
          schema:
            type: string
          example: abc123
        - name: Request-Timeout-Ms
          in: header
          description: >-
            Time in milliseconds that the client will wait for the response
            before closing the connection.
          required: false
          schema:
            type: integer
          example: 5000
      requestBody:
        description: >-
          Request payload for creating a message using the Bedrock/Claude
          Messages API format.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedrockClaudeMessagesRequestBody'
      responses:
        '200':
          description: Successful response containing the assistant's message.
          headers:
            X-RateLimit-Limit:
              description: The number of requests allowed per minute.
              schema:
                type: integer
              example: 100
            X-RateLimit-Remaining:
              description: The number of remaining requests in the current period.
              schema:
                type: integer
              example: 95
            X-RateLimit-Reset:
              description: The Unix timestamp (in seconds) when the rate limit will reset.
              schema:
                type: integer
                format: int64
              example: 1620000000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedrockClaudeMessagesResponse'
        '400':
          description: |
            Client error. Possible error responses are detailed below:

            | Status Code | Error Code | Description |
            | :--- | :--- | :--- |
            | 400 | `invalid_request` | The request was malformed or invalid |
            | 401 | `unauthorized` | Authentication failed |
            | 403 | `forbidden` | Not authorized to access the resource |
            | 404 | `not_found` | The requested resource was not found |
            | 429 | `rate_limit_exceeded` | Request rate limit exceeded |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/4xxErrorResponse'
        '404':
          description: >-
            Not Found. The requested model ID does not exist or is not
            supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/4xxErrorResponse'
        '500':
          description: |
            Server error. Possible error responses are detailed below:

            | Status Code | Error Code | Description |
            | :--- | :--- | :--- |
            | 500 | `internal_error` | Internal server error |
            | 503 | `service_unavailable` | Service temporarily unavailable |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/5xxErrorResponse'
components:
  schemas:
    CompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: |
            ID of the model to use.
            Supported model:
            - `claude-4.7-opus`
          enum:
            - claude-4.7-opus
          example: claude-4.7-opus
        prompt:
          oneOf:
            - type: string
              description: The prompt(s) to generate completions for.
              example: Write a poem about cats.
            - type: array
              items:
                type: string
              maxItems: 2048
              description: An array of prompts.
          description: >-
            Input prompt (text, array of strings, tokens or token arrays) the
            model will generate the completion text for.
        best_of:
          type: integer
          default: 1
          minimum: 0
          maximum: 20
          nullable: true
          description: >
            Generates `best_of` completions server-side and returns the "best"
            (the one with the highest log probability per token). Results cannot
            be streamed.


            When used with `n`, `best_of` controls the number of candidate
            completions and `n` specifies how many to return – `best_of` must be
            greater than `n`.


            **Note:** Because this parameter generates many completions, it can
            quickly consume your token quota. Use carefully and ensure that you
            have reasonable settings for `max_tokens` and `stop`.
        echo:
          type: boolean
          default: false
          nullable: true
          description: |
            Echo back the prompt in addition to the completion
        frequency_penalty:
          type: number
          default: 0
          minimum: -2
          maximum: 2
          nullable: true
          description: >
            Number between -2.0 and 2.0. Positive values penalize new tokens
            based on their existing frequency in the text so far, decreasing the
            model's likelihood to repeat the same line verbatim.


            [See more information about frequency and presence
            penalties.](https://platform.openai.com/docs/guides/text-generation)
        logit_bias:
          type: object
          x-oaiTypeLabel: map
          nullable: true
          additionalProperties:
            type: integer
          description: >
            Modify the likelihood of specified tokens appearing in the
            completion.


            Accepts a JSON object that maps tokens (specified by their token ID
            in the GPT tokenizer) to an associated bias value from -100 to 100.
            You can use this [tokenizer tool](/tokenizer?view=bpe) to convert
            text to token IDs. Mathematically, the bias is added to the logits
            generated by the model prior to sampling. The exact effect will vary
            per model, but values between -1 and 1 should decrease or increase
            likelihood of selection; values like -100 or 100 should result in a
            ban or exclusive selection of the relevant token.


            As an example, you can pass `{"50256": -100}` to prevent the
            <|endoftext|> token from being generated.
        logprobs:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
          description: >
            Include the log probabilities on the `logprobs` most likely output
            tokens, as well the chosen tokens. For example, if `logprobs` is 5,
            the API will return a list of the 5 most likely tokens. The API will
            always return the `logprob` of the sampled token, so there may be up
            to `logprobs+1` elements in the response.


            The maximum value for `logprobs` is 5.
        max_tokens:
          type: integer
          minimum: 0
          default: 16
          example: 16
          nullable: true
          description: >
            The maximum number of [tokens](/tokenizer) that can be generated in
            the completion.


            The token count of your prompt plus `max_tokens` cannot exceed the
            model's context length. [Example Python
            code](https://cookbook.openai.com/examples/how_to_count_tokens_with_tiktoken)
            for counting tokens.
        'n':
          type: integer
          minimum: 1
          maximum: 128
          default: 1
          example: 1
          nullable: true
          description: >
            How many completions to generate for each prompt.


            **Note:** Because this parameter generates many completions, it can
            quickly consume your token quota. Use carefully and ensure that you
            have reasonable settings for `max_tokens` and `stop`.
        presence_penalty:
          type: number
          default: 0
          minimum: -2
          maximum: 2
          nullable: true
          description: >
            Number between -2.0 and 2.0. Positive values penalize new tokens
            based on whether they appear in the text so far, increasing the
            model's likelihood to talk about new topics.


            [See more information about frequency and presence
            penalties.](https://platform.openai.com/docs/guides/text-generation)
        seed:
          type: integer
          format: int64
          nullable: true
          description: >
            If specified, our system will make a best effort to sample
            deterministically, such that repeated requests with the same `seed`
            and parameters should return the same result.


            Determinism is not guaranteed, and you should refer to the
            `system_fingerprint` response parameter to monitor changes in the
            backend.
        stop:
          $ref: '#/components/schemas/StopConfiguration'
        stream:
          description: >
            Whether to stream back partial progress. If set, tokens will be sent
            as data-only [server-sent
            events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format)
            as they become available, with the stream terminated by a `data:
            [DONE]` message. [Example Python
            code](https://cookbook.openai.com/examples/how_to_stream_completions).
          type: boolean
          nullable: true
          default: false
        stream_options:
          $ref: '#/components/schemas/ChatCompletionStreamOptions'
        suffix:
          description: |
            The suffix that comes after a completion of inserted text.

            This parameter is only supported for `gpt-3.5-turbo-instruct`.
          nullable: true
          type: string
          example: test.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
          example: 1
          nullable: true
          description: >
            What sampling temperature to use, between 0 and 2. Higher values
            like 0.8 will make the output more random, while lower values like
            0.2 will make it more focused and deterministic.


            We generally recommend altering this or `top_p` but not both.
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          example: 1
          nullable: true
          description: >
            An alternative to sampling with temperature, called nucleus
            sampling, where the model considers the results of the tokens with
            top_p probability mass. So 0.1 means only the tokens comprising the
            top 10% probability mass are considered.


            We generally recommend altering this or `temperature` but not both.
        user:
          type: string
          example: user-1234
          description: >
            A unique identifier representing your end-user, which can help
            OpenAI to monitor and detect abuse. [Learn
            more](https://platform.openai.com/docs/guides/safety-best-practices#end-user-ids).
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the completion.
          example: cmpl-uqkvlQyYKtfdw7RDWPQVk6Sm
        object:
          type: string
          description: The object type, which is always `text_completion`.
          enum:
            - text_completion
          example: text_completion
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the completion was created.
          example: 1589498292
        model:
          type: string
          description: |
            ID of the model to use.
            Supported model:
            - `claude-4.7-opus`
          example: claude-4.7-opus
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          description: >-
            The list of completion choices the model generated for the input
            prompt.
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        system_fingerprint:
          type: string
          description: >-
            This fingerprint represents the backend configuration that the model
            runs with.
        metadata:
          type: object
          description: Metadata about the response.
          properties:
            latency:
              type: integer
              format: int64
              description: The processing time in milliseconds.
              example: 5000
            guardrails:
              type: object
              description: Contains summary information about a guardrail evaluation.
              properties:
                result:
                  type: string
                  description: >
                    Overall result of the guardrail evaluation. Returned values
                    are **ALLOW**, **DISALLOW**, **EXECUTED**, or
                    **UNEXECUTED**.

                    - If a value of **ALLOW** is returned, then a determination
                    has been made that the statement is allowed.

                    - If a value of **DISALLOWED** is returned, then the
                    determination has been made that the statement is not
                    allowed.

                    - If a value of **EXECUTED** is returned, the rail has been
                    executed, but no matches have been made to determine whether
                    the statement is allowed or disallowed.

                    - If a value of **UNEXECUTED** is returned, the rail was not
                    executed, and therefore no determination on whether the
                    statement is allowed or disallowed has been made.
                  example: ALLOW
                blockingGuardrail:
                  type: object
                  description: >-
                    Details about the specific guardrail that blocked the
                    request. This section will only be populated if the result
                    is not ALLOW.
                  properties:
                    guardrailType:
                      type: string
                      description: Type of the blocking guardrail (e.g., input, output).
                      example: input
                    guardrailId:
                      type: string
                      description: ID of the blocking guardrail policy.
                      example: gr-12345
                    resultDetails:
                      type: object
                      description: >-
                        Aggregates all rail result types for the guardrail
                        check. This schema is taken directly from the GenAI
                        Guardrails API.
                      properties:
                        similarityRailsResult:
                          type: object
                          description: Details on similarity rails evaluation of an input.
                          properties:
                            result:
                              type: string
                              description: Result status for similarity rails.
                              example: ALLOW
                            similarityRailsDetails:
                              type: array
                              description: >-
                                When similarity rails are run, we get
                                essentially run similarity search, which means
                                we get search results. Each search result is
                                captured in this array.
                              items:
                                type: object
                                description: >-
                                  A representation of the search result, which
                                  rail the search result is from, and some
                                  debugging information on why a determination
                                  was made.
                                properties:
                                  railName:
                                    type: string
                                    description: >-
                                      Name of the similarity rail that the
                                      result belongs to.
                                    example: negative light
                                  railConfiguredThreshold:
                                    type: number
                                    format: double
                                    description: >-
                                      The configured threshold for the
                                      similarity rail, configured through the
                                      Management API.
                                    example: 0.45
                                  railPriority:
                                    type: integer
                                    description: >-
                                      What priority did this rail have over
                                      other rails.
                                    example: 3
                                  searchResultScore:
                                    type: number
                                    format: double
                                    description: The score of the result.
                                    example: 1.12
                                  searchResultText:
                                    type: string
                                    description: The text chunk of the sample.
                                    example: How can I open a checking account?
                                  isRailAllowed:
                                    type: boolean
                                    description: >-
                                      Is the rail this sample is associated with
                                      an allowed or disallowed rail.
                                    example: false
                        regexRailsResult:
                          type: object
                          description: Details on regex rails evaluation.
                          properties:
                            result:
                              type: string
                              description: Result status for regex rails.
                              example: ALLOW
                            regexRailsDetails:
                              type: array
                              description: >-
                                List of regex configurations that matched.
                                Unmatched regexes do not show up here.
                              items:
                                type: object
                                description: A representation of a regex rail that matched.
                                properties:
                                  regexName:
                                    type: string
                                    description: The name of the regex rail that matched.
                                    example: Phone number regex
                        wordRailsResult:
                          type: object
                          description: >-
                            Details on the evaluation of word rails, the words
                            that matched will be included here.
                          properties:
                            result:
                              type: string
                              description: Result status for word rails.
                              example: ALLOW
                            wordRailsDetails:
                              type: array
                              description: A list of words that matched.
                              items:
                                type: object
                                description: A representation of the word that matched.
                                properties:
                                  blockedWord:
                                    type: string
                                    description: >-
                                      The name given to the word that matched at
                                      time of configuration.
                                    example: Chase
                        modelRailsResult:
                          type: object
                          description: Details on the evaluation of model rails.
                          properties:
                            result:
                              type: string
                              description: Result status for model rails.
                              example: ALLOW
                            modelRailsDetails:
                              type: array
                              description: >-
                                A list of details relating a model evaluation
                                failure.
                              items:
                                type: object
                                description: >-
                                  A representation of a single model call,
                                  includes fields about rail settings and
                                  results.
                                properties:
                                  railName:
                                    type: string
                                    description: >-
                                      Name that describes the criteria to be
                                      evaluated using a model.
                                    example: negative light
                                  railConfiguredThreshold:
                                    type: number
                                    format: double
                                    description: >-
                                      The configured threshold for the model
                                      rail.
                                    example: 0.45
                                  modelName:
                                    type: string
                                    description: >-
                                      Name that was used to evaluate the
                                      messages for the given criteria.
                                    example: claude-4.7-opus
                                  modelScore:
                                    type: number
                                    format: double
                                    description: >-
                                      score determined by the model for the
                                      given promptTemplate in the config.
                                    example: 1.12
                                  modelExplanation:
                                    type: string
                                    description: >-
                                      The explanation generated by the model for
                                      the given score.
                                    example: >-
                                      The context provided makes the response
                                      high on groundedness. Score: 8
        error:
          type: string
          description: An error message, if any occurred.
          example: Error message
    CreateChatCompletionRequest:
      allOf:
        - $ref: '#/components/schemas/CreateModelResponseProperties'
        - type: object
          required:
            - model
            - messages
          properties:
            messages:
              description: >
                A list of messages comprising the conversation so far. Depending
                on the

                [model](https://platform.openai.com/docs/models) you use,
                different message types (modalities) are

                supported, like
                [text](https://platform.openai.com/docs/guides/text-generation),

                [images](https://platform.openai.com/docs/guides/vision), and
                [audio](https://platform.openai.com/docs/guides/audio).
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChatCompletionRequestMessage'
            model:
              description: |
                ID of the model to use.
                Supported model:
                - `claude-4.7-opus`
              type: string
              enum:
                - claude-4.7-opus
              example: claude-4.7-opus
            modalities:
              $ref: '#/components/schemas/ResponseModalities'
            verbosity:
              $ref: '#/components/schemas/Verbosity'
            reasoning_effort:
              $ref: '#/components/schemas/ReasoningEffort'
            max_completion_tokens:
              description: >
                An upper bound for the number of tokens that can be generated
                for a completion, including visible output tokens and [reasoning
                tokens](https://platform.openai.com/docs/guides/reasoning).
              type: integer
              nullable: true
            frequency_penalty:
              type: number
              default: 0
              minimum: -2
              maximum: 2
              nullable: true
              description: >
                Number between -2.0 and 2.0. Positive values penalize new tokens
                based on

                their existing frequency in the text so far, decreasing the
                model's

                likelihood to repeat the same line verbatim.
            presence_penalty:
              type: number
              default: 0
              minimum: -2
              maximum: 2
              nullable: true
              description: >
                Number between -2.0 and 2.0. Positive values penalize new tokens
                based on

                whether they appear in the text so far, increasing the model's
                likelihood

                to talk about new topics.
            web_search_options:
              type: object
              title: Web search
              description: >
                This tool searches the web for relevant results to use in a
                response.

                Learn more about the [web search
                tool](https://platform.openai.com/docs/guides/tools-web-search?api-mode=chat).
              properties:
                user_location:
                  type: object
                  nullable: true
                  required:
                    - type
                    - approximate
                  description: |
                    Approximate location parameters for the search.
                  properties:
                    type:
                      type: string
                      description: >
                        The type of location approximation. Always
                        `approximate`.
                      enum:
                        - approximate
                      x-stainless-const: true
                    approximate:
                      $ref: '#/components/schemas/WebSearchLocation'
                search_context_size:
                  $ref: '#/components/schemas/WebSearchContextSize'
            top_logprobs:
              description: >
                An integer between 0 and 20 specifying the number of most likely
                tokens to

                return at each token position, each with an associated log
                probability.

                `logprobs` must be set to `true` if this parameter is used.
              type: integer
              minimum: 0
              maximum: 20
              nullable: true
            response_format:
              description: >
                An object specifying the format that the model must output.


                Setting to `{ "type": "json_schema", "json_schema": {...} }`
                enables

                Structured Outputs which ensures the model will match your
                supplied JSON

                schema. Learn more in the [Structured Outputs

                guide](https://platform.openai.com/docs/guides/structured-outputs).


                Setting to `{ "type": "json_object" }` enables the older JSON
                mode, which

                ensures the message the model generates is valid JSON. Using
                `json_schema`

                is preferred for models that support it.
              anyOf:
                - $ref: '#/components/schemas/ResponseFormatText'
                - $ref: '#/components/schemas/ResponseFormatJsonSchema'
                - $ref: '#/components/schemas/ResponseFormatJsonObject'
            audio:
              type: object
              nullable: true
              description: >
                Parameters for audio output. Required when audio output is
                requested with

                `modalities: ["audio"]`. [Learn
                more](https://platform.openai.com/docs/guides/audio).
              required:
                - voice
                - format
              properties:
                voice:
                  $ref: '#/components/schemas/VoiceIdsShared'
                format:
                  type: string
                  enum:
                    - wav
                    - aac
                    - mp3
                    - flac
                    - opus
                    - pcm16
                  description: >
                    Specifies the output audio format. Must be one of `wav`,
                    `mp3`, `flac`,

                    `opus`, or `pcm16`.
            store:
              type: boolean
              default: false
              nullable: true
              description: >
                Whether or not to store the output of this chat completion
                request for

                use in our [model
                distillation](https://platform.openai.com/docs/guides/distillation)
                or

                [evals](https://platform.openai.com/docs/guides/evals) products.


                Supports text and image inputs. Note: image inputs over 8MB will
                be dropped.
            stream:
              description: >
                If set to true, the model response data will be streamed to the
                client

                as it is generated using [server-sent
                events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).

                See the [Streaming section
                below](https://platform.openai.com/docs/api-reference/chat/streaming)

                for more information, along with the [streaming
                responses](https://platform.openai.com/docs/guides/streaming-responses)

                guide for more information on how to handle the streaming
                events.
              type: boolean
              nullable: true
              default: false
            stop:
              $ref: '#/components/schemas/StopConfiguration'
            logit_bias:
              type: object
              x-oaiTypeLabel: map
              nullable: true
              additionalProperties:
                type: integer
              description: >
                Modify the likelihood of specified tokens appearing in the
                completion.


                Accepts a JSON object that maps tokens (specified by their token
                ID in the

                tokenizer) to an associated bias value from -100 to 100.
                Mathematically,

                the bias is added to the logits generated by the model prior to
                sampling.

                The exact effect will vary per model, but values between -1 and
                1 should

                decrease or increase likelihood of selection; values like -100
                or 100

                should result in a ban or exclusive selection of the relevant
                token.
            logprobs:
              description: >
                Whether to return log probabilities of the output tokens or not.
                If true,

                returns the log probabilities of each output token returned in
                the

                `content` of `message`.
              type: boolean
              default: false
              nullable: true
            max_tokens:
              description: >
                The maximum number of [tokens](/tokenizer) that can be generated
                in the

                chat completion. This value can be used to control

                [costs](https://openai.com/api/pricing/) for text generated via
                API.


                This value is now deprecated in favor of
                `max_completion_tokens`, and is

                not compatible with [o-series
                models](https://platform.openai.com/docs/guides/reasoning).
              type: integer
              nullable: true
              deprecated: true
            'n':
              type: integer
              minimum: 1
              maximum: 128
              default: 1
              example: 1
              nullable: true
              description: >-
                How many chat completion choices to generate for each input
                message. Note that you will be charged based on the number of
                generated tokens across all of the choices. Keep `n` as `1` to
                minimize costs.
            prediction:
              nullable: true
              description: >
                Configuration for a [Predicted
                Output](https://platform.openai.com/docs/guides/predicted-outputs),

