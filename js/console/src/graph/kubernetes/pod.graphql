fragment PodWithEvents on Pod {
  ...Pod
  events {
    ...Event
  }
}

query Pod($name: String!, $namespace: String!, $clusterId: ID, $serviceId: ID) {
  pod(
    name: $name
    namespace: $namespace
    clusterId: $clusterId
    serviceId: $serviceId
  ) {
    ...PodWithEvents
  }
}

query PodLogs(
  $name: String!
  $namespace: String!
  $clusterId: ID
  $serviceId: ID
  $container: String!
  $sinceSeconds: Int!
) {
  pod(
    name: $name
    namespace: $namespace
    clusterId: $clusterId
    serviceId: $serviceId
  ) {
    logs(container: $container, sinceSeconds: $sinceSeconds)
  }
}

fragment PodMetrics on PodMetrics {
  cpu @include(if: $cpu) {
    ...MetricResponse
  }
  cpuRequests @include(if: $cpuRequests) {
    ...MetricResponse
  }
  cpuLimits @include(if: $cpuLimits) {
    ...MetricResponse
  }
  cpuThrottling @include(if: $cpuThrottling) {
    ...MetricResponse
  }
  memory @include(if: $memory) {
    ...MetricResponse
  }
  memoryRequests @include(if: $memoryRequests) {
    ...MetricResponse
  }
  memoryLimits @include(if: $memoryLimits) {
    ...MetricResponse
  }
  ephemeralStorage @include(if: $ephemeralStorage) {
    ...MetricResponse
  }
  ephemeralStorageRequests @include(if: $ephemeralStorageRequests) {
    ...MetricResponse
  }
  ephemeralStorageLimits @include(if: $ephemeralStorageLimits) {
    ...MetricResponse
  }
  fsReads @include(if: $fsReads) {
    ...MetricResponse
  }
  fsWrites @include(if: $fsWrites) {
    ...MetricResponse
  }
  networkReceive @include(if: $networkReceive) {
    ...MetricResponse
  }
  networkTransmit @include(if: $networkTransmit) {
    ...MetricResponse
  }
  networkReceiveDropped @include(if: $networkReceiveDropped) {
    ...MetricResponse
  }
  networkTransmitDropped @include(if: $networkTransmitDropped) {
    ...MetricResponse
  }
  restarts @include(if: $restarts) {
    ...MetricResponse
  }
}

query PodMetrics(
  $name: String!
  $namespace: String!
  $clusterId: ID
  $serviceId: ID
  $start: DateTime
  $stop: DateTime
  $step: String
  $cpu: Boolean! = false
  $cpuRequests: Boolean! = false
  $cpuLimits: Boolean! = false
  $cpuThrottling: Boolean! = false
  $memory: Boolean! = false
  $memoryRequests: Boolean! = false
  $memoryLimits: Boolean! = false
  $ephemeralStorage: Boolean! = false
  $ephemeralStorageRequests: Boolean! = false
  $ephemeralStorageLimits: Boolean! = false
  $fsReads: Boolean! = false
  $fsWrites: Boolean! = false
  $networkReceive: Boolean! = false
  $networkTransmit: Boolean! = false
  $networkReceiveDropped: Boolean! = false
  $networkTransmitDropped: Boolean! = false
  $restarts: Boolean! = false
) {
  pod(
    name: $name
    namespace: $namespace
    clusterId: $clusterId
    serviceId: $serviceId
  ) {
    metrics(start: $start, stop: $stop, step: $step) {
      ...PodMetrics
    }
  }
}

mutation DeletePod($name: String!, $namespace: String!, $serviceId: ID) {
  deletePod(name: $name, namespace: $namespace, serviceId: $serviceId) {
    ...Pod
  }
}
