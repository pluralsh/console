fragment ComponentMetricsFragment on ServiceDeployment {
  componentMetrics(
    componentId: $componentId
    start: $start
    stop: $stop
    step: $step
  ) {
    cpu @include(if: $cpu) {
      ...MetricResponse
    }
    mem @include(if: $mem) {
      ...MetricResponse
    }

    podCpu @include(if: $podCpu) {
      ...MetricResponse
    }
    podMem @include(if: $podMem) {
      ...MetricResponse
    }

    cpuRequests @include(if: $cpuRequests) {
      ...MetricResponse
    }
    memRequests @include(if: $memRequests) {
      ...MetricResponse
    }
    cpuLimits @include(if: $cpuLimits) {
      ...MetricResponse
    }
    memLimits @include(if: $memLimits) {
      ...MetricResponse
    }

    podCpuRequests @include(if: $podCpuRequests) {
      ...MetricResponse
    }
    podMemRequests @include(if: $podMemRequests) {
      ...MetricResponse
    }
    podCpuLimits @include(if: $podCpuLimits) {
      ...MetricResponse
    }
    podMemLimits @include(if: $podMemLimits) {
      ...MetricResponse
    }
  }
}

query ServiceDeploymentComponentMetrics(
  $id: ID
  $name: String
  $cluster: String
  $componentId: ID!
  $start: DateTime
  $stop: DateTime
  $step: String
  $cpu: Boolean! = false
  $mem: Boolean! = false
  $podCpu: Boolean! = false
  $podMem: Boolean! = false
  $cpuRequests: Boolean! = false
  $memRequests: Boolean! = false
  $cpuLimits: Boolean! = false
  $memLimits: Boolean! = false
  $podCpuRequests: Boolean! = false
  $podMemRequests: Boolean! = false
  $podCpuLimits: Boolean! = false
  $podMemLimits: Boolean! = false
) {
  serviceDeployment(id: $id, name: $name, cluster: $cluster) {
    ...ComponentMetricsFragment
  }
}

query Usage(
  $cpu: String!
  $mem: String!
  $podCpu: String!
  $podMem: String!
  $step: String!
  $offset: Int!
  $clusterId: ID
) {
  cpu: metric(
    clusterId: $clusterId
    query: $cpu
    offset: $offset
    step: $step
  ) {
    ...MetricResponse
  }
  mem: metric(
    clusterId: $clusterId
    query: $mem
    offset: $offset
    step: $step
  ) {
    ...MetricResponse
  }
  podCpu: metric(
    clusterId: $clusterId
    query: $podCpu
    offset: $offset
    step: $step
  ) {
    ...MetricResponse
  }
  podMem: metric(
    clusterId: $clusterId
    query: $podMem
    offset: $offset
    step: $step
  ) {
    ...MetricResponse
  }
}
