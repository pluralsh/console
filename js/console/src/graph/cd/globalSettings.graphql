fragment HttpConnection on HttpConnection {
  host
  user
}

fragment SmtpSettings on SmtpSettings {
  server
  port
  sender
  user
  ssl
}

fragment AiSettings on AiSettings {
  anthropic {
    model
    toolModel
    proxy {
      enabled
      url
      noproxy
    }
  }
  openai {
    baseUrl
    model
    toolModel
    embeddingModel
    method
    proxy {
      enabled
      url
      noproxy
    }
  }
  openaiCompatible {
    baseUrl
    model
    toolModel
    embeddingModel
    method
    proxy {
      enabled
      url
      noproxy
    }
  }
  xai {
    baseUrl
    model
    toolModel
    embeddingModel
    method
    proxy {
      enabled
      url
      noproxy
    }
  }
  azure {
    apiVersion
    endpoint
    model
    embeddingModel
    toolModel
    proxy {
      enabled
      url
      noproxy
    }
  }
  ollama {
    model
    toolModel
    url
    proxy {
      enabled
      url
      noproxy
    }
  }
  vertex {
    model
    embeddingModel
    toolModel
    project
    location
    endpoint
    proxy {
      enabled
      url
      noproxy
    }
  }
  bedrock {
    modelId
    toolModelId
    embeddingModel
    modelSettings {
      modelId
      inferenceProfileArn
    }
    endpoint
    accessKeyId
    region
    proxy {
      enabled
      url
      noproxy
    }
  }
  enabled
  toolsEnabled
  provider
  toolProvider
  embeddingProvider
  analysisRates {
    fast
    slow
  }
  logAnalysis
  vectorStore {
    enabled
    store
  }
}

fragment DeploymentSettings on DeploymentSettings {
  id
  name
  enabled
  selfManaged
  insertedAt
  updatedAt
  onboarded
  agentHelmValues
  agentHelmValuesTemplateable
  logging {
    enabled
    driver
  }
  latestK8sVsn
  lokiConnection {
    ...HttpConnection
  }
  prometheusConnection {
    ...HttpConnection
  }
  artifactRepository {
    ...GitRepository
  }
  deployerRepository {
    ...GitRepository
  }
  createBindings {
    ...PolicyBinding
  }
  smtp {
    ...SmtpSettings
  }
  ai {
    ...AiSettings
  }
  readBindings {
    ...PolicyBinding
  }
  writeBindings {
    ...PolicyBinding
  }
  gitBindings {
    ...PolicyBinding
  }
}

fragment ObservabilityProvider on ObservabilityProvider {
  id
  name
  type
  insertedAt
  updatedAt
}

fragment ObservabilityWebhook on ObservabilityWebhook {
  id
  name
  type
  url
  insertedAt
  updatedAt
  readBindings {
    ...PolicyBinding
  }
  writeBindings {
    ...PolicyBinding
  }
}

query DeploymentSettings {
  deploymentSettings {
    ...DeploymentSettings
  }
  availableModels {
    provider
    model
  }
  defaultModels {
    provider
    model
    toolModel
    embeddingModel
  }
}

query ObservabilityProviders($first: Int, $after: String) {
  observabilityProviders(first: $first, after: $after) {
    edges {
      node {
        ...ObservabilityProvider
      }
    }
    pageInfo {
      ...PageInfo
    }
  }
}

query ObservabilityWebhooks($first: Int, $after: String) {
  observabilityWebhooks(first: $first, after: $after) {
    edges {
      node {
        ...ObservabilityWebhook
      }
    }
    pageInfo {
      ...PageInfo
    }
  }
}

query ObservabilityWebhook($id: ID, $name: String) {
  observabilityWebhook(id: $id, name: $name) {
    ...ObservabilityWebhook
  }
}

mutation UpdateDeploymentSettings($attributes: DeploymentSettingsAttributes!) {
  updateDeploymentSettings(attributes: $attributes) {
    ...DeploymentSettings
  }
}

mutation UpsertObservabilityProvider(
  $attributes: ObservabilityProviderAttributes!
) {
  upsertObservabilityProvider(attributes: $attributes) {
    ...ObservabilityProvider
  }
}

mutation UpsertObservabilityWebhook(
  $attributes: ObservabilityWebhookAttributes!
) {
  upsertObservabilityWebhook(attributes: $attributes) {
    ...ObservabilityWebhook
  }
}

mutation DeleteObservabilityProvider($id: ID!) {
  deleteObservabilityProvider(id: $id) {
    ...ObservabilityProvider
  }
}

mutation DeleteObservabilityWebhook($id: ID!) {
  deleteObservabilityWebhook(id: $id) {
    ...ObservabilityWebhook
  }
}

mutation DissmissOnboarding {
  dismissOnboarding {
    onboarded
  }
}
