query WorkbenchDevboxes($id: ID!) {
  workbench(id: $id) {
    id
    configuration {
      coding {
        repositories
      }
      devbox {
        maxSnapshots
        maxDeferral
        allowSubscriptionCredentials
      }
    }
    devboxes {
      ...DevboxTiny
      allowedRepositories
      agents {
        ...DevboxAgent
      }
    }
  }
}

query Devboxes(
  $q: String
  $clusterId: ID
  $workbenchId: ID
  $first: Int = 100
  $after: String
) {
  devboxes(
    q: $q
    clusterId: $clusterId
    workbenchId: $workbenchId
    first: $first
    after: $after
  ) {
    pageInfo {
      ...PageInfo
    }
    edges {
      node {
        ...DevboxTiny
      }
    }
  }
}

query Devbox($id: ID!) {
  devbox(id: $id) {
    ...Devbox
  }
}

query DevboxAgents($workbenchId: ID!, $devboxId: ID!) {
  devboxAgents(workbenchId: $workbenchId, devboxId: $devboxId) {
    ...DevboxAgent
  }
}

query WorkbenchDevboxInstances(
  $id: ID!
  $first: Int = 50
  $after: String
  $statuses: [DevboxInstanceStatus]
  $mine: Boolean
  $includeEnded: Boolean
) {
  workbench(id: $id) {
    id
    devboxInstances(
      first: $first
      after: $after
      statuses: $statuses
      mine: $mine
      includeEnded: $includeEnded
    ) {
      pageInfo {
        ...PageInfo
      }
      edges {
        node {
          ...DevboxInstanceTiny
        }
      }
    }
  }
}

query WorkbenchDevboxSnapshots($id: ID!, $first: Int = 50, $after: String) {
  workbench(id: $id) {
    id
    devboxSnapshots(first: $first, after: $after) {
      pageInfo {
        ...PageInfo
      }
      edges {
        node {
          ...DevboxSnapshot
        }
      }
    }
  }
}

query WorkbenchDevboxInbox($id: ID!) {
  workbench(id: $id) {
    id
    devboxInbox {
      ...DevboxInteraction
    }
  }
}

query DevboxInstance($id: ID!) {
  devboxInstance(id: $id) {
    ...DevboxInstance
  }
}

query DevboxThread($id: ID!) {
  devboxThread(id: $id) {
    ...DevboxThread
    subagents {
      ...DevboxThread
    }
    interactions {
      ...DevboxInteraction
    }
  }
}

query DevboxInstanceCommands($threadId: ID!) {
  devboxInstanceCommands(threadId: $threadId) {
    ...DevboxCommand
  }
}

query DevboxRepositories($instanceId: ID!) {
  devboxRepositories(instanceId: $instanceId) {
    ...DevboxRepository
  }
}

query DevboxTimeline(
  $instanceId: ID!
  $sessionId: String!
  $before: Long
  $after: Long
  $limit: Int
) {
  devboxTimeline(
    instanceId: $instanceId
    sessionId: $sessionId
    before: $before
    after: $after
    limit: $limit
  ) {
    deltaOffset
    seq
    stream
    hasMore
    entities {
      ...DevboxEntity
    }
  }
}

query DevboxSessions($instanceId: ID!) {
  devboxSessions(instanceId: $instanceId) {
    sessionId
    threadId
    kind
    parentSessionId
    agent
    title
    status
    foregroundState
    lastActivityAt
  }
}

query DevboxImportableSessions($instanceId: ID!) {
  devboxImportableSessions(instanceId: $instanceId) {
    agent
    sessionId
    title
    cwd
    updatedAt
  }
}

query DevboxPullRequests(
  $devboxId: ID
  $devboxInstanceId: ID
  $devboxThreadId: ID
  $first: Int = 50
) {
  pullRequests(
    devboxId: $devboxId
    devboxInstanceId: $devboxInstanceId
    devboxThreadId: $devboxThreadId
    first: $first
  ) {
    edges {
      node {
        ...DevboxPullRequest
      }
    }
  }
}

query DevboxFiles($instanceId: ID!, $path: String) {
  devboxFiles(instanceId: $instanceId, path: $path) {
    ...DevboxFileEntry
  }
}

query DevboxFile($instanceId: ID!, $path: String!) {
  devboxFile(instanceId: $instanceId, path: $path) {
    ...DevboxFile
  }
}

query DevboxChanges(
  $instanceId: ID!
  $threadId: ID
  $repositories: [String]
  $includeDiff: Boolean = true
) {
  devboxChanges(
    instanceId: $instanceId
    threadId: $threadId
    repositories: $repositories
    includeDiff: $includeDiff
  ) {
    ...DevboxRepositoryChanges
  }
}

query AgentCredentials {
