subscription DevboxInstanceStatusDelta($id: ID, $workbenchId: ID) {
  devboxInstanceStatusDelta(id: $id, workbenchId: $workbenchId) {
    delta
    payload {
      ...DevboxInstanceTiny
      idleState {
        idle
        idleSince
        suspendsAt
        busyReasons
        message
      }
    }
  }
}

